services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - vscode-server:/home/vscode/.vscode-server
      - uv-cache:/home/vscode/.cache/uv
      - venv-data:/workspace/.venv
      - pnpm-global:/home/vscode/.local/share/pnpm
      # Bind Mounts for OpenCode
      - ~/.opencode-data/config:/home/vscode/.config/opencode
      - ~/.opencode-data/home:/home/vscode/.opencode
      - ~/.opencode-data/state:/home/vscode/.local/state/opencode
      - ~/.opencode-data/share:/home/vscode/.local/share/opencode
      - ~/.opencode-data/cache:/home/vscode/.cache/opencode
    command: sleep infinity
    environment:
      - DATABASE_URL=postgresql+asyncpg://narrare:narrare@postgres:5432/narrare_dev
      - TEST_DATABASE_URL=postgresql+asyncpg://narrare:narrare@postgres_test:5432/narrare_test
      - NARRARE_DEV_MODE=container
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

volumes:
  vscode-server:
  uv-cache:
  pnpm-global:
  venv-data:
