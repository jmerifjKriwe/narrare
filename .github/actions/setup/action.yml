name: Setup
description: >-
  One place for the toolchain versions: uv, Python and a locked uv sync
  (unless `python: false`), and pnpm, Node with the pnpm cache and a frozen
  pnpm install (unless `node: false`). Checkout stays with the caller.

inputs:
  python-version:
    description: Python version for actions/setup-python.
    required: false
    default: "3.14"
  node-version:
    description: Node version for actions/setup-node.
    required: false
    default: "22"
  pnpm-version:
    description: >-
      pnpm version for pnpm/action-setup. Must match package.json's
      `packageManager` field: pnpm/action-setup v6 rejects a mismatch.
    required: false
    default: "11.5.2"
  just-version:
    description: just version for extractions/setup-just.
    required: false
    default: "1.58.0"
  node:
    description: >-
      Install the JavaScript toolchain too. Set "false" for jobs that run
      only Python-side steps, so pnpm and Node are not installed.
    required: false
    default: "true"
  python:
    description: >-
      Install uv, Python and run the locked uv sync. Set "false" for jobs
      that need only the JavaScript toolchain, so neither uv nor Python is
      installed.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      if: inputs.python != 'false'
      with:
        enable-cache: true
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      if: inputs.python != 'false'
      with:
        python-version: ${{ inputs.python-version }}
    # --locked, not a plain sync: uv otherwise rewrites a stale lock inside
    # the throwaway checkout and reports success. That is how 0.2.0 reached
    # main with uv.lock still at 0.1.0.
    - name: Sync Python dependencies (lockfile is the contract)
      if: inputs.python != 'false'
      run: uv sync --locked
      shell: bash
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      if: inputs.node != 'false'
      with:
        version: ${{ inputs.pnpm-version }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.node != 'false'
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install JavaScript dependencies (lockfile is the contract)
      run: pnpm install --frozen-lockfile
      if: inputs.node != 'false'
      shell: bash
    # `just` is a separate binary not shipped on the runner, and downloading it
    # from GitHub Releases has been flaky (504) for hours at a time. Cache the
    # binary keyed by version so a cache hit skips the network entirely, and
    # retry the download on a miss. This keeps `just` (the best fit for this
    # polyglot repo) without the download being a single point of failure.
    - name: Cache just binary
      id: just-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/just
        key: just-${{ runner.os }}-${{ runner.arch }}-${{ inputs.just-version }}

    - name: Install just (download with retry on cache miss)
      if: steps.just-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        JUST_VERSION: ${{ inputs.just-version }}
      run: |
        set -euo pipefail
        mkdir -p ~/.local/share/just ~/.local/bin
        # All CI runs on ubuntu-latest (x86_64); the musl build is static.
        target="x86_64-unknown-linux-musl"
        url="https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-${target}.tar.gz"
        for attempt in 1 2 3 4 5; do
          if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/just.tar.gz "$url"; then
            break
          fi
          echo "just download attempt ${attempt} failed" >&2
          if [ "$attempt" = "5" ]; then
            echo "failed to download just ${JUST_VERSION} after 5 attempts" >&2
            exit 1
          fi
          sleep $((attempt * 5))
        done
        tar -xzf /tmp/just.tar.gz -C ~/.local/share/just
        chmod +x ~/.local/share/just/just
        ln -sf ~/.local/share/just/just ~/.local/bin/just
        rm -f /tmp/just.tar.gz

    - name: Put just on PATH
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        if [ -x "$HOME/.local/share/just/just" ] && [ ! -e "$HOME/.local/bin/just" ]; then
          ln -s "$HOME/.local/share/just/just" "$HOME/.local/bin/just"
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Verify just
      shell: bash
      run: just --version
