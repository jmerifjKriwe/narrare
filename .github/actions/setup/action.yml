name: Setup
description: >-
  One place for the toolchain versions: uv, Python and a locked uv sync
  (unless `python: false`), and pnpm, Node with the pnpm cache and a frozen
  pnpm install (unless `node: false`). Checkout stays with the caller.

inputs:
  python-version:
    description: Python version for actions/setup-python.
    required: false
    default: "3.14"
  node-version:
    description: Node version for actions/setup-node.
    required: false
    default: "22"
  pnpm-version:
    description: >-
      pnpm version for pnpm/action-setup. Must match package.json's
      `packageManager` field: pnpm/action-setup v6 rejects a mismatch.
    required: false
    default: "11.5.2"
  just-version:
    description: just version for extractions/setup-just.
    required: false
    default: "1.58.0"
  node:
    description: >-
      Install the JavaScript toolchain too. Set "false" for jobs that run
      only Python-side steps, so pnpm and Node are not installed.
    required: false
    default: "true"
  python:
    description: >-
      Install uv, Python and run the locked uv sync. Set "false" for jobs
      that need only the JavaScript toolchain, so neither uv nor Python is
      installed.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      if: inputs.python != 'false'
      with:
        enable-cache: true
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      if: inputs.python != 'false'
      with:
        python-version: ${{ inputs.python-version }}
    # --locked, not a plain sync: uv otherwise rewrites a stale lock inside
    # the throwaway checkout and reports success. That is how 0.2.0 reached
    # main with uv.lock still at 0.1.0.
    - name: Sync Python dependencies (lockfile is the contract)
      if: inputs.python != 'false'
      run: uv sync --locked
      shell: bash
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      if: inputs.node != 'false'
      with:
        version: ${{ inputs.pnpm-version }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.node != 'false'
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install JavaScript dependencies (lockfile is the contract)
      run: pnpm install --frozen-lockfile
      if: inputs.node != 'false'
      shell: bash
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        # The default pins 1.58.0 with the SHA pin above; callers may override.
        just-version: ${{ inputs.just-version }} # zizmor: ignore[unpinned-tools]
