version: 2
updates:
  # =============================================================================
  # Python — root workspace (dev tools only)
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "python"
    groups:
      pydantic:
        patterns:
          - "pydantic*"
      fastapi:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "starlette"
          - "python-multipart"
      sqlalchemy:
        patterns:
          - "sqlalchemy"
          - "alembic"
          - "asyncpg"
          - "pgvector"
      taskiq:
        patterns:
          - "taskiq*"
      llm-ecosystem:
        patterns:
          - "pydantic-ai*"
          - "openai"
          - "anthropic"
          - "mem0ai"
          - "langfuse"
      opentelemetry:
        patterns:
          - "opentelemetry*"
      auth:
        patterns:
          - "PyJWT"
          - "argon2-cffi"
      testing:
        patterns:
          - "pytest*"
          - "playwright*"
          - "hypothesis"
          - "pip-audit"
      major-updates:
        update-types:
          - "version-update:semver-major"

  # =============================================================================
  # Python — API package (~30 deps)
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "python"
      - "api"
    groups:
      pydantic:
        patterns:
          - "pydantic*"
      fastapi:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "starlette"
          - "python-multipart"
          - "fastapi-limiter"
      sqlalchemy:
        patterns:
          - "sqlalchemy"
          - "alembic"
          - "asyncpg"
          - "pgvector"
          - "psycopg*"
      taskiq:
        patterns:
          - "taskiq*"
      llm-ecosystem:
        patterns:
          - "pydantic-ai*"
          - "openai"
          - "anthropic"
          - "mem0ai"
          - "langfuse"
      opentelemetry:
        patterns:
          - "opentelemetry*"
      auth:
        patterns:
          - "PyJWT"
          - "argon2-cffi"
      testing:
        patterns:
          - "pytest*"
          - "playwright*"
          - "hypothesis"
      major-updates:
        update-types:
          - "version-update:semver-major"

  # =============================================================================
  # Python — core package (shared domain logic, no HTTP/DB)
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/packages/core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "python"
      - "core"
    groups:
      pydantic:
        patterns:
          - "pydantic*"
      llm-ecosystem:
        patterns:
          - "pydantic-ai*"
          - "langfuse"
          - "mem0ai"
      major-updates:
        update-types:
          - "version-update:semver-major"

  # =============================================================================
  # Python — i18n package (single dep: pydantic, no groups needed)
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/packages/i18n"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "python"
      - "i18n"

  # =============================================================================
  # npm — root workspace (dev scripts: ts-morph, tsx)
  # =============================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "npm"

  # =============================================================================
  # npm — Frontend (Next.js 16, React 19, TipTap 3, ~50 deps)
  # =============================================================================
  - package-ecosystem: "npm"
    directory: "/packages/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "npm"
      - "frontend"
    groups:
      # Next.js only — React has independent release cycles, separate group
      nextjs:
        patterns:
          - "next"
      # React ecosystem — separate from Next.js to avoid major-version surprises
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # TipTap editor
      tiptap:
        patterns:
          - "@tiptap*"
      # Tailwind CSS + PostCSS plugin
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss*"
          - "tw-animate-css"
      # Frontend testing: vitest, testing-library, playwright, msw
      testing-frontend:
        patterns:
          - "vitest"
          - "@vitest*"
          - "@testing-library*"
          - "@playwright/test"
          - "jsdom"
          - "msw"
      # UI libraries: dnd, animation, icons, charts, graph, styling utils
      ui-libs:
        patterns:
          - "@dnd-kit*"
          - "@base-ui*"
          - "motion"
          - "lucide-react"
          - "recharts"
          - "cytoscape*"
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
          - "shadcn"
      major-updates:
        update-types:
          - "version-update:semver-major"

  # =============================================================================
  # Docker — production image (python:3.14-slim-bookworm + node:24-slim-bookworm)
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "docker"

  # =============================================================================
  # Docker — devcontainer image (mcr.microsoft.com/devcontainers/python)
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "docker"

  # =============================================================================
  # GitHub Actions — all workflows in .github/workflows/
  # =============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "github-actions"
