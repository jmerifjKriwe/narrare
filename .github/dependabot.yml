version: 2

# Code ecosystems run monthly with a 7-day cooldown held to 30 days for
# majors. Actions run weekly with a 3-day default cooldown; the Actions
# updater supports only `default-days`, so majors there have no separate
# hold. Grouping plus the cooldown keeps PRs
# few and safe: minor/patch bumps sit for a week before they open, majors for
# 30 days. Security advisories still fire immediately and independently of
# this schedule. Rebases follow the default `auto` strategy.
#
# Every entry uses the `chore` prefix with a scope: Dependabot's default
# `build(deps)` is not a conventional-commit type this repo allows, and the
# commits it writes land on main unchanged.

updates:
  # `uv`, not `pip`: the pip updater writes `pyproject.toml` and cannot touch
  # `uv.lock`, so every Python PR arrived with a stale lock and died in
  # `uv sync --locked` before a single test ran. The uv updater resolves with
  # `uv lock`, so the pin and the lock move in one PR.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "python"]
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  # `/`, the workspace root, not `/web`: `pnpm-workspace.yaml` lists `web` and
  # `pnpm-lock.yaml` lives here, so a run from `/web` rewrites the manifest and
  # cannot reach the lock — every web PR then died in
  # `pnpm install --frozen-lockfile` with ERR_PNPM_OUTDATED_LOCKFILE. From the
  # root the updater finds `web` through the workspace and moves both.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "npm"]
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  # Container images: a `devcontainers` entry returns only with a dev
  # container, a `docker` entry at `/` only with a `Dockerfile`.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "github-actions"]
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]

  # The composite action's own `uses:` pins. The updater reads
  # `.github/workflows/**` only, so a `directory: "/"` entry never sees
  # `.github/actions/setup/action.yml` (dependabot-core#6949); the `directories`
  # glob names the action tree explicitly. Same cooldown, grouping and commit
  # shape as the workflow entry above.
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "github-actions"]
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]
