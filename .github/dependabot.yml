version: 2
updates:
  # =============================================================================
  # Python — root workspace (dev tools only)
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "version-update:semver-major"

  # =============================================================================
  # Python — API package (~30 deps)
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "api"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "version-update:semver-major"

  # =============================================================================
  # Python — core package (shared domain logic, no HTTP/DB)
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/packages/core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "core"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "version-update:semver-major"

  # =============================================================================
  # Python — i18n package
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/packages/i18n"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "i18n"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "version-update:semver-major"

  # =============================================================================
  # npm — root workspace (dev scripts: ts-morph, tsx)
  # =============================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "version-update:semver-major"

  # =============================================================================
  # npm — Frontend (Next.js 16, React 19, TipTap 3, ~50 deps)
  # =============================================================================
  - package-ecosystem: "npm"
    directory: "/packages/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "frontend"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "version-update:semver-major"

  # =============================================================================
  # Docker — production image
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "docker"

  # =============================================================================
  # Docker — devcontainer image
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "docker"

  # =============================================================================
  # GitHub Actions
  # =============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "github-actions"
