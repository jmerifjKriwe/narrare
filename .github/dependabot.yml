version: 2

# Budget policy: routine dependency PRs run on a monthly cadence to conserve
# GitHub Actions minutes. Security detection stays event-driven and schedule-
# independent — Dependabot alerts and automated security updates still fire
# immediately on new advisories. Rebases are manual (`@dependabot rebase`).
updates:
  # =============================================================================
  # Python — root workspace (dev tools only)
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    groups:
      # pydantic-evals pins pydantic-ai-slim to the exact same version —
      # both must move in lockstep (see PR #176). Keep them out of the
      # generic groups so they land in a dedicated, clearly-labelled PR.
      pydantic:
        patterns:
          - "pydantic-ai-slim"
          - "pydantic-evals"
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "major"

  # =============================================================================
  # Python — API package (~30 deps)
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
      - "api"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "major"

  # =============================================================================
  # Python — core package (shared domain logic, no HTTP/DB)
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/packages/core"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
      - "core"
    groups:
      # pydantic-ai-slim must move in lockstep with pydantic-evals (root dev
      # group) — pydantic-evals pins pydantic-ai-slim exactly (see PR #176).
      # Keep it out of the generic groups so it lands in a dedicated PR.
      pydantic:
        patterns:
          - "pydantic-ai-slim"
          - "pydantic-evals"
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "major"

  # =============================================================================
  # Python — i18n package
  # =============================================================================
  - package-ecosystem: "pip"
    directory: "/packages/i18n"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
      - "i18n"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "major"

  # =============================================================================
  # npm — root workspace (dev scripts: ts-morph, tsx)
  # =============================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "major"

  # =============================================================================
  # Docker — production image
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # =============================================================================
  # Docker — devcontainer image
  # =============================================================================
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # =============================================================================
  # GitHub Actions
  # =============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
