version: 2

# Monthly cadence keeps Actions minutes down; security advisories still fire
# immediately and independently of this schedule. Rebases are manual.
#
# Every entry uses the `chore` prefix with a scope: Dependabot's default
# `build(deps)` is not a conventional-commit type this repo allows, and the
# commits it writes land on main unchanged.

updates:
  # `uv`, not `pip`: the pip updater writes `pyproject.toml` and cannot touch
  # `uv.lock`, so every Python PR arrived with a stale lock and died in
  # `uv sync --locked` before a single test ran. The uv updater resolves with
  # `uv lock`, so the pin and the lock move in one PR.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "python"]
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "npm"]
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "docker"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "github-actions"]
