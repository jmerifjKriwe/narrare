# Reusable E2E gate: the single definition of one capability's browser
# suite with its Postgres service, called as `./.github/workflows/_e2e.yml`
# from ci.yml and nightly.yml, which were two copies of the same job. The
# caller's matrix supplies ONE capability name per entry — no name is ever
# expanded into a path by string surgery on the JSON list. This file
# declares no trigger of its own (`on: workflow_call`): it does nothing
# until called.

on:
  workflow_call:
    inputs:
      capability:
        description: >-
          One capability name, as scripts/affected.py and the resolver
          spell it; `just test-e2e` maps it to that capability's own e2e
          directory. One entry per runner — never `all`.
        type: string
        required: true

# Actions are pinned by commit SHA and name their release in a trailing
# comment, like every other workflow here (see ci.yml's header comment).

jobs:
  e2e:
    name: e2e (${{ inputs.capability }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U narrare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing below pushes; the token has no work to persist.
          persist-credentials: false
      # The composite carries uv, Python, the locked sync, pnpm, Node and
      # just — the E2E builds the web app and starts it, so the JavaScript
      # toolchain is needed here (node: default, not "false").
      #
      # `./`, not `$/`: zizmor prefers the self-repository syntax, but the
      # pinned actionlint image (1.7.7) does not know it yet — the two gate
      # probes must pass together. Flip to `$/` when the actionlint pin is
      # bumped past the version that understands `$/`, or when
      # `sha_pinning_required` rejects the `./` reference.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      # The matrix runs once per capability, on runners that share nothing —
      # without this cache every entry downloads chromium afresh. The
      # Playwright version lives in uv.lock, so `hashFiles('uv.lock')` is
      # the key that turns: bump Playwright, key changes, fresh download —
      # a stale browser can never match a new lock.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}
      # The directory the cache step saves. A hit skips the chromium
      # download; `--with-deps` still runs the apt system-dependency
      # install every run — the browser is cached, the system packages
      # are not.
      - run: uv run playwright install --with-deps chromium
      # The matrix runs the same recipe the local gate runs.
      - name: E2E
        env:
          # Indirection for zizmor's template-injection audit: the capability
          # name reaches the shell as an env value, never as an expanded
          # expression in the command line.
          CAPABILITY: ${{ inputs.capability }}
        run: just test-e2e "$CAPABILITY"
