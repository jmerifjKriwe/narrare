name: Architecture Constraints

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "pyproject.toml"

jobs:
  check:
    name: Check Architecture Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Run architecture constraint check
        run: uv run python scripts/check_architecture.py

      - name: Check prompt structure
        run: uv run python scripts/check_prompt_structure.py

      - name: Check feature adoption
        run: uv run python scripts/check_adoption.py

      - name: Check locale sync
        continue-on-error: true
        run: uv run python scripts/check_locale_sync.py

      - name: Annotate on failure
        if: failure()
        run: |
          echo "::error::Architecture constraints violated."
          echo "::notice::See docs/agents/_shared/CONSTRAINTS.md for rules."
          echo "::notice::Allowed LLM imports: packages/core/narrare_core/llm/gateway.py"
          echo "::notice::Prompt building: packages/core/narrare_core/prompts/ only"
