# Auto-approves the owner's own pull requests once CI is green on the exact
# commit, so the owner never has to reach for the admin bypass to merge their
# own work. Foreign PRs, fork PRs and bot PRs are never approved — they keep
# the manual human review the ruleset demands.
#
# Why this is safe: the workflow runs as `workflow_run`, so it always executes
# the file from the default branch; a PR cannot rewrite it for itself. It
# checks out nothing, so no PR code runs. It only approves a PR that is
# authored by the repository owner, lives in this repository, targets the
# default branch, and whose head is exactly the commit the green CI run
# tested. A fork PR can neither fake the owner as author nor match the SHA,
# and `isCrossRepository` is false only for a branch in this repository.
#
# The token is a dedicated GitHub App, not `GITHUB_TOKEN`: the repository keeps
# "Allow GitHub Actions to create and approve pull requests" off, so a
# `GITHUB_TOKEN` can never approve. The App is scoped to `pull-requests: write`
# and is only used here. Its events create workflow runs, so the approval also
# starts the `pull_request_review` run, which stays green for a non-release PR.
#
# Setup: create a GitHub App with "Pull requests: Read and write", install it on
# this repository, and add its client ID and private key as the repository
# secrets AUTO_APPROVE_CLIENT_ID and AUTO_APPROVE_PRIVATE_KEY. Until both exist
# the mint step fails and every green owner PR gets a red run.
#
# `github.repository_owner` is the account login; moving the repository under an
# organisation makes the author check never match, and this workflow stops.
#
# This deliberately replaces the earlier "no bot auto-approve" stance: the
# reason is the bypass habit, not the scorecard. Remove this workflow when a
# second maintainer joins and a human approval becomes available again.

name: Auto Approve (Owner PRs)

on: # zizmor: ignore[dangerous-triggers] — workflow_run is the only trigger that sees CI's conclusion, and this use runs no PR code
  workflow_run:
    # Matched by workflow *name*: renaming `name: CI` in ci.yml silently stops
    # this workflow. Keep the two in step.
    workflows: ["CI"]
    types: [completed]

# The App token carries the only write permission; `GITHUB_TOKEN` needs none.
permissions: {}

# Serialise runs for the same CI run so two do not overlap. A re-run after the
# first finished still approves again, which GitHub permits; the approval is
# idempotent enough that a duplicate is noise, not a defect.
concurrency:
  group: auto-approve-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  approve:
    name: Approve the owner PR
    # Only a green CI run started by a pull request in this repository is a
    # candidate: push, dispatch and pull_request_review runs are not approvals,
    # and a fork PR's run is skipped before the App token is minted at all.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `pull-requests: write` only. `GITHUB_TOKEN` could not approve even if
      # this step wanted to: the repository keeps that setting off.
      - name: Mint the auto-approve App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Find the owner PR on this commit and approve it
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # The jq filter needs single quotes so `$ENV` stays jq, not shell,
          # which shellcheck cannot know from the text alone.
          # shellcheck disable=SC2016
          # The base check keeps a PR into a non-default branch (e.g. the
          # read-only `v1`) out: `workflow_run` fires for CI runs on any branch.
          PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number,author,headRefOid,isCrossRepository,baseRefName \
            --jq '[.[] | select(.author.login == $ENV.OWNER
                               and .headRefOid == $ENV.HEAD_SHA
                               and .isCrossRepository == false
                               and .baseRefName == $ENV.DEFAULT_BRANCH) | .number]
                  | first // empty')

          if [ -z "$PR" ]; then
            echo "No owner PR on $HEAD_SHA into $DEFAULT_BRANCH; nothing to approve."
            exit 0
          fi

          # `gh pr review` approves the PR's current head; a push landing
          # between the lookup and the review would approve a commit CI never
          # saw. The ruleset's required `ci-required` still blocks that commit,
          # so the blast radius is a stray approval, not a bad merge.
          gh pr review "$PR" --repo "$REPO" --approve \
            --body "Auto-approve: owner PR, CI green on $HEAD_SHA."
