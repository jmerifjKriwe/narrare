name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # -------------------------------------------------------------------------
  # Fast fail: architecture constraints (< 30s)
  # -------------------------------------------------------------------------
  architecture:
    name: Architecture Constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Check architecture constraints
        run: uv run python scripts/check_architecture.py

      - name: Check OpenAPI spec drift
        run: uv run python scripts/export_openapi.py --check

      - name: Check prompt structure
        run: uv run python scripts/check_prompt_structure.py

      - name: Check feature adoption
        run: uv run python scripts/check_adoption.py

      - name: Check locale sync
        continue-on-error: true
        run: uv run python scripts/check_locale_sync.py

      - name: Check streaming compliance (RULE-20)
        continue-on-error: true
        run: |
          uv run python scripts/check_streaming_compliance.py

  # -------------------------------------------------------------------------
  # Lint & format (< 60s)
  # -------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: architecture
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Ruff lint
        run: uv run ruff check apps/ packages/ scripts/ tests/

      - name: Ruff format check
        run: uv run ruff format --check apps/ packages/ scripts/ tests/

  # -------------------------------------------------------------------------
  # Type checking (< 2 min)
  # -------------------------------------------------------------------------
  typecheck:
    name: Type Check (pyright)
    runs-on: ubuntu-latest
    needs: architecture
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Pyright
        run: uv run pyright

  # -------------------------------------------------------------------------
  # Security (< 60s)
  # -------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: architecture
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Bandit
        run: |
          uv run bandit -c pyproject.toml \
            -r apps/api/narrare packages/core/narrare_core

      - name: pip-audit
        run: uv run pip-audit --skip-editable --ignore-vuln PYSEC-2025-183

  # -------------------------------------------------------------------------
  # Unit tests (< 5 min, no Docker)
  # -------------------------------------------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Run unit tests
        id: tests
        env:
          # Dummy API keys for unit tests (tests mock all LLM calls)
          ANTHROPIC_API_KEY: sk-test-dummy
          OPENAI_API_KEY: sk-test-dummy
        run: |
          set -o pipefail
          uv run pytest tests/unit/ \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=pytest.xml \
            --cov-fail-under=0 \
            -v | tee pytest-coverage.txt

      - name: Check coverage threshold
        if: always() && steps.tests.outcome != 'cancelled'
        run: |
          uv run python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib['line-rate'])
          pct = rate * 100
          print(f'Coverage: {pct:.1f}%')
          if pct < 80:
              print(f'::warning::Coverage {pct:.1f}% is below the 80% target threshold')
          else:
              print(f'Coverage {pct:.1f}% meets the 80% target threshold')
          "

      - name: Pytest coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
          title: "Unit Test Coverage"
          badge-title: "Coverage"
          hide-emoji: true
          report-only-changed-files: true
          remove-links-to-files: true
          remove-links-to-lines: true
          xml-skip-covered: true

      - name: Upload coverage artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-artifacts
          path: |
            coverage.xml
            pytest-coverage.txt
            pytest.xml
          retention-days: 1

  # -------------------------------------------------------------------------
  # Integration tests (< 5 min, with Docker)
  # -------------------------------------------------------------------------
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      TEST_DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Run migrations
        run: cd apps/api && uv run alembic upgrade head

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v

  # -------------------------------------------------------------------------
  # Update coverage badge in README (main push only)
  # -------------------------------------------------------------------------
  update-coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    needs: test-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: coverage-artifacts

      - name: Pytest coverage comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
          hide-comment: true

      - name: Update README badge
        run: |
          python3 -c "
          import re
          coverage = int(float('${{ steps.coverage.outputs.coverage }}'.strip('%')))
          if coverage >= 90:
              color = 'brightgreen'
          elif coverage >= 80:
              color = 'green'
          elif coverage >= 70:
              color = 'yellow'
          elif coverage >= 60:
              color = 'orange'
          else:
              color = 'red'
          badge = f'<a href=\"https://github.com/jmerifjKriwe/narrare/blob/main/README.md\"><img alt=\"Coverage\" src=\"https://img.shields.io/badge/Coverage-{coverage}%25-{color}.svg\" /></a>'
          badge_block = f'<!-- Pytest Coverage Comment:Begin -->\n{badge}\n<!-- Pytest Coverage Comment:End -->'
          with open('README.md', 'r') as f:
              content = f.read()
          pattern = r'<!-- Pytest Coverage Comment:Begin -->.*?<!-- Pytest Coverage Comment:End -->'
          new_content, count = re.subn(pattern, badge_block, content, flags=re.DOTALL)
          if count == 0:
              lines = content.split('\n')
              insert_idx = -1
              for i, line in enumerate(lines):
                  if 'img.shields.io/badge/' in line or '[![' in line:
                      insert_idx = i
              if insert_idx >= 0:
                  lines.insert(insert_idx + 1, '')
                  lines.insert(insert_idx + 2, badge_block)
                  new_content = '\n'.join(lines)
              else:
                  lines.insert(1, '')
                  lines.insert(2, badge_block)
                  new_content = '\n'.join(lines)
          with open('README.md', 'w') as f:
              f.write(new_content)
          print(f'Updated coverage badge: {coverage}% ({color})')
          "

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update coverage badge"
          file_pattern: README.md

  # -------------------------------------------------------------------------
  # Frontend (< 3 min)
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: architecture

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint + format check
        run: cd packages/web && npx biome check .

      - name: i18n validation
        run: npx tsx scripts/validate-i18n.ts

      - name: Type check
        run: cd packages/web && pnpm type-check

      - name: Test
        run: cd packages/web && pnpm test

      - name: Build
        run: cd packages/web && pnpm build

  # -------------------------------------------------------------------------
  # E2E tests (main branch only, full stack)
  # -------------------------------------------------------------------------
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      TEST_DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-not-for-production
      ANTHROPIC_API_KEY: sk-test-dummy
      OPENAI_API_KEY: sk-test-dummy
      NARRARE_ENCRYPTION_KEY: WYcr1iULJse2Oo6GPpmw1Au4ovp_fXZwbrNF11C12ZQ=
      NARRARE_E2E_TEST: 1

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Python dependencies
        run: uv sync --all-packages --group dev

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: cd apps/api && uv run alembic upgrade head

      - name: Seed dev user
        run: uv run python scripts/seed_dev_user.py

      - name: Build frontend
        run: cd packages/web && pnpm build

      - name: Start API server
        run: |
          cd apps/api && uv run uvicorn narrare._app.main:app \
            --host 0.0.0.0 --port 8000 > /tmp/api-server.log 2>&1 &
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API server is ready"
              break
            fi
            sleep 1
          done
          # Verify the server actually started
          if ! curl -sf http://localhost:8000/health > /dev/null; then
            echo "ERROR: API server failed to start. Logs:"
            cat /tmp/api-server.log || true
            exit 1
          fi

      - name: Start frontend server
        run: |
          # Use the standalone server instead of 'pnpm start' because Next.js standalone mode
          # is not compatible with 'next start'.
          # We need to copy static and public files into the standalone directory first.
          cp -r packages/web/.next/static packages/web/.next/standalone/packages/web/.next/static
          cp -r packages/web/public packages/web/.next/standalone/packages/web/public

          PORT=3000 node packages/web/.next/standalone/packages/web/server.js > /tmp/frontend-server.log 2>&1 &
          echo "Waiting for frontend server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Frontend server is ready"
              break
            fi
            sleep 1
          done
          # Verify the server actually started
          if ! curl -sf http://localhost:3000 > /dev/null; then
            echo "ERROR: Frontend server failed to start. Logs:"
            cat /tmp/frontend-server.log || true
            exit 1
          fi

      - name: Run E2E tests
        timeout-minutes: 15
        run: uv run pytest tests/e2e/ -v -m e2e --timeout=300 --timeout-method=thread
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
          CI: "true"
          NARRARE_E2E_TEST: 1

      - name: Collect server logs on failure
        if: failure()
        run: |
          echo "=== API Server Logs ==="
          cat /tmp/api-server.log || echo "No API logs found"
          echo ""
          echo "=== Frontend Server Logs ==="
          cat /tmp/frontend-server.log || echo "No frontend logs found"
