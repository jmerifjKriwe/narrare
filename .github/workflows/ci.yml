name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly: every capability, every suite — but only when main moved since
    # the last successful nightly (the guard job decides). 03:17 UTC.
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A narrow change on top of a wide one supersedes it, so a new push cancels
  # the run of the commit it stands on: two pushes in a row used to run two
  # full suites side by side, for two trees where the newer one contains the
  # older. The nightly is exempt, because a push at 03:18 must not cancel the
  # one run the nightly-guard reads back tomorrow.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

# Actions are pinned by commit SHA and name their release in a trailing comment;
# release-please.yml, which carries write tokens, has always done it this way.
# A major tag is a mutable ref: its owners can move `v7` to any commit, and that
# commit then runs with this workflow's token — no diff here, no review.
# Dependabot's monthly `github-actions` update keeps the pins current.
#
# The pin also fixes the runtime: every action below runs on Node 24, so no
# action is forced onto a runtime its own CI never tested.

jobs:
  # One cheap job every other job waits for. On a nightly it answers the
  # only question that matters first: is main still where the last
  # successful nightly left it? Then nothing below runs, because the same
  # commit has already been tested — no runner minutes, no credits, and
  # every job below reports skipped. On PRs and pushes it always proceeds.
  nightly-guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # gh api prefixes nothing: a relative path without repos/<owner>/<repo>
          # resolves to api.github.com/actions/... and answers 404.
          last=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          echo "last successful nightly tested: ${last:-none}"
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly skipped: main is unchanged since the last successful nightly."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  lint-types:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks scans the push range base^..head, which needs
      # the base commit that a shallow (depth-1) checkout does not have.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      # --locked, not a plain sync: uv otherwise rewrites a stale lock inside
      # the throwaway checkout and reports success. That is how 0.2.0 reached
      # main with uv.lock still at 0.1.0.
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: just lint
      - run: just typecheck
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Which E2E suites a change owes: the capabilities it touches, or all of
  # them when a shared surface moved (spec §6 "affected capabilities"; the
  # shared surfaces are kernel, api, the generated views, web, i18n and the
  # tooling). A pull request is measured against where it branched, a push
  # against the commits it landed, so a docs-only change owes no browser suite
  # either way. A nightly takes everything.
  changes:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: suites
        env:
          # What kind of event this is: the range below differs per event, and
          # `schedule` has none at all.
          EVENT: ${{ github.event_name }}
          # A fork may name its branch anything, so the branch name alone says
          # nothing about who pushed it: the exception below also requires the
          # head to live in this repository.
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          # The commit a push landed on. Exactly 40 zeros on the first push of a
          # branch, and no object at all after a force push.
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # "none" is only ever a decision, never a fallback: a path that cannot
          # name a range takes all suites instead.
          if [ "$EVENT" = pull_request ]; then
            git fetch origin main
            changed=$(git diff --name-only origin/main...HEAD)
          elif [ "$EVENT" = push ]; then
            # The commits this push landed, which is the diff the same change
            # would show as a PR. A first push and a force push both name a base
            # that cannot be read, and `git diff` failing must not read as
            # "nothing changed" — both take everything.
            if ! echo "$PUSH_BEFORE" | grep -qxE '[0-9a-f]{40}' \
              || echo "$PUSH_BEFORE" | grep -qxE '0{40}' \
              || ! changed=$(git diff --name-only "$PUSH_BEFORE..HEAD"); then
              echo "suites=all (the push range cannot be read)"
              echo "suites=all" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "suites=all (a nightly tests every capability)"
            echo "suites=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${changed:-<no file changed>}"
          # A release PR moves version strings and the changelog; no browser
          # runs any of them. release-please force-pushes this branch on every
          # push to main, so the suites here cost minutes per release and get
          # cancelled mid-flight by the next update. Three conditions, because
          # each alone is spoofable: a fork may take the branch name, and
          # pyproject.toml and uv.lock are ordinary dependency files. A skipped
          # job still satisfies the required check.
          if [ "$EVENT" = pull_request ] \
            && [ "$PR_HEAD_REPO" = "$BASE_REPO" ] \
            && [ "$GITHUB_HEAD_REF" = "release-please--branches--main--components--narrare" ] \
            && ! echo "$changed" | grep -qvE '^(\.release-please-manifest\.json|CHANGELOG\.md|app/kernel/version\.py|package\.json|web/package\.json|pyproject\.toml|web/lib/api/openapi\.json|uv\.lock)$'; then
            echo "suites=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -qE '^(app/(kernel|api|generated)/|web/|i18n/|justfile|pyproject\.toml|uv\.lock|pnpm-lock\.yaml|\.github/workflows/ci\.yml)'; then
            echo "suites=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The trailing `|| true` is insurance, not a fix: the pipeline's status
          # is `sort`'s, so an empty match already returns 0 under the runner's
          # `bash -e {0}`. Declaring `shell: bash` on this step would add
          # `pipefail` and turn "no capability" into a failed job.
          capabilities=$(echo "$changed" | grep -oP '^app/capabilities/\K[^/]+' | sort -u || true)
          if [ -z "$capabilities" ]; then
            echo "suites=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          suites=""
          for name in $capabilities; do suites="$suites app/capabilities/$name/e2e/"; done
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  tests:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U narrare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      # One suite, run once. `main` is where coverage is measured, and a second
      # job used to measure it by running the same suite a second time; the
      # covered invocation replaces the plain one on a main push instead. A PR
      # keeps `just test`, so nothing instruments a PR.
      - run: just test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      - name: Tests with coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run pytest app --cov --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      # `!cancelled()` on both uploads: a report is worth uploading even when a
      # test failed, and a report that stays away is worse than a red one. A
      # bare `if:` carries `success()`, so the coverage upload skipped itself on
      # every failing `main` push: 0a468e49 reached Codecov as a commit with no
      # report at all (`state: pending`, `totals: null`), and the dashboard kept
      # showing the previous merge — the failing run is exactly the one whose
      # coverage matters. `always()` would be wrong in the other direction: it
      # also uploads from a run `concurrency` cancelled mid-suite, which is
      # partial by construction. A hard crash that leaves no `coverage.xml`
      # still fails the upload step, and should: on a green run that is a real
      # defect.
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
      # A second run of the same action with `report_type`, not Codecov's
      # separate test-results-action: that one is deprecated in favor of this
      # (it says so on every run) and would be the only Node-20 action left in
      # this file.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          fail_ci_if_error: true
          report_type: test_results

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-types, changes]
    if: needs.changes.outputs.suites != 'none'
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U narrare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: pnpm install --frozen-lockfile
      # The same invocation `just test-e2e` makes; the suites come from the
      # changes job, so a change pays for what it touches.
      - name: E2E
        run: |
          suites="${{ needs.changes.outputs.suites }}"
          [ "$suites" = all ] && suites="app/capabilities/*/e2e/"
          uv run pytest $suites -v -m e2e --timeout=60

  build:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      # The web unit suite — six files (four in `web/`, two in capability `web/`
      # folders) and 39 tests — lived only in the pre-commit hook: a fresh clone
      # has that hook, a drive-by contributor does not, so their frontend could
      # reach `main` with `vitest` red. It runs before the build because it is
      # the cheaper step.
      - run: just test-frontend
      - run: just build

