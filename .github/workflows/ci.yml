name: CI

# ---------------------------------------------------------------------------
# Gate Compliance Audit (as of: 2026-06-03)
# ---------------------------------------------------------------------------
# Referenz: .opencode/context/narrare-dev/processes/quality-gates.md
#
# | Gate | Tool / Check                          | CI Status   | Notes                              |
# |------|----------------------------------------|-------------|------------------------------------|
# | G1   | pytest unit + integration + e2e        | ✅ Blocking  | Unit/Integration in separate jobs  |
# | G2   | --cov-fail-under (Coverage)            | ✅ Blocking (≥80%) | Target 80% reached (global 82.51%) |
# | G3   | check_architecture.py                  | ✅ Blocking  | architecture Job                   |
# | G3e  | check_type_ignores (RULE-23)           | ✅ Blocking  | architecture Job (ratchet — additions fail) |
# | G3b  | check_exception_baseline.py            | ✅ Blocking  | architecture Job                   |
# | G3d  | check_prompt_surface_contract.py       | ✅ Blocking  | architecture Job (ADR-037 + ADR-049 Phase D) |
# | G3c  | export_openapi.py --check              | ✅ Blocking  | architecture Job                   |
# | G4   | test_fake_conformance.py               | ✅ Blocking  | test-unit Job (via pytest)         |
# | G5   | Cross-layer contract tests             | ✅ Blocking  | test-unit Job (via pytest)         |
# | G6   | pyright (strict; mypy not required)    | ✅ Blocking  | quality Job                        |
# | G7   | ruff check + ruff format --check       | ✅ Blocking  | quality Job                        |
# | G8   | check_adoption.py                      | ✅ Blocking  | architecture Job                   |
# | G9   | check_prompt_structure.py              | ✅ Blocking  | architecture Job                   |
# | G9   | check_streaming_compliance.py (RULE-20)| ✅ Blocking  | architecture Job                   |
# | G10  | check_locale_sync.py                   | ✅ Blocking  | architecture Job (was: warning)    |
# | --   | check_doc_drift.py                     | ✅ Blocking  | architecture Job                   |
# | --   | check_registry_drift.py                | ✅ Blocking  | architecture Job                   |
# | --   | check_quality_metrics.py               | ⚠️ Warning   | architecture Job (opt-in)          |
# | --   | check_frontend_file_size.py (RULE-04)  | ✅ Blocking  | frontend Job                       |
# | --   | check_test_coverage_gaps.py (RULE-10)  | ✅ Blocking  | architecture Job                   |
# | --   | evals smoke (pydantic-evals)            | ✅ Blocking  | architecture Job (secret-free)     |
# | --   | check_eval_drift.py                     | ✅ Blocking  | architecture Job                   |
# | --   | check_module_coverage.py (RULE-10)    | ✅ Blocking   | test-unit Job (--fail, ratcheted baselines) |
# | --   | check-testid.ts (data-testid gate)      | ✅ Blocking  | frontend Job                       |
# | --   | check-vrt-mock-contract.ts (ADR-059)    | ✅ Blocking  | frontend Job (before VRT run)     |
# | --   | Gitleaks (secret scanning, AUFG-05-09) | ✅ Blocking  | quality Job                        |
# | --   | bandit + pip-audit                     | ✅ Blocking  | quality Job                        |
# | --   | biome check (frontend lint/format)     | ✅ Blocking  | frontend Job                       |
# | --   | pnpm test (frontend tests)             | ✅ Blocking  | frontend Job                       |
# | --   | Standalone boot smoke (frontend)       | ✅ Blocking  | frontend-standalone Job (PR-only)  |
# | --   | check_test_performance.py              | ⚠️ Warning   | frontend Job (WARNING-only)        |
# | --   | check_pytest_collection_performance.py  | ⚠️ Warning   | test-unit Job (WARNING-only)       |
# | --   | check_current_state_facts.py (SSOT)    | ✅ Blocking  | architecture Job                   |
# | --   | check_adr_naming.py (review-04 AUFG-04-10) | ✅ Blocking | architecture Job (ADR-XXX-*.md convention) |
# | MutMut Mutation Score       | mutation-testing-monthly.yml    | 📅 Monthly  | Non-blocking, issue report        |
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  schedule:
    # Nightly FULL run (default branch): PRs are the gate; this is the
    # post-merge safety net (spec 2026-09-29 §3). 02:37 UTC.
    # Off the :30 minute deliberately: GitHub's scheduler full-skipped the
    # first two slots at :30 (Oct 1 + Oct 2, 2026; 0 schedule runs in the
    # workflow's history despite state=active) and its docs warn about
    # high load at common minutes (our monthly cron saw a 6.8 h delay on
    # Oct 1). Validated executable via workflow_dispatch run 36972990834.
    - cron: "37 2 * * *"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "evals/**"
      - "docs/development/deployment-guide.md"
      - "docs/_shared/CONSTRAINTS.md"
      - "docs/_shared/CURRENT_STATE.md"
      - "docs/_shared/TECH_STACK.md"
      - "docs/architecture/decisions/**"
      - ".devcontainer/**"
      - ".env.example"
      - ".gitleaks.toml"
      - ".github/workflows/**"
      - ".github/zizmor.yml"
      - ".github/CODEOWNERS"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose*.yml"
      - "justfile"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "packages/web/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".pre-commit-config.yaml"
  push:
    branches: [main, develop]

# Budget guard: superseded runs on the same PR cancel; main pushes queue
# instead of cancelling. The group includes the event name so the nightly
# full run (schedule) can never be cancelled by a same-ref push — PRs are
# the gate, the nightly is the post-merge safety net (spec 2026-09-29 §3).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # -------------------------------------------------------------------------
  # Change detection: which parts of the tree actually moved?
  # Cheap (~5s), lets expensive jobs skip themselves when irrelevant.
  # Always runs on push (main/develop) so post-merge signal stays complete;
  # on PRs it narrows scope to what the diff actually touches. Nightly and
  # dispatch runs execute this job too — on schedule the filter step is
  # skipped (no diff base); its outputs are only consulted on PRs.
  # -------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        # schedule runs have no diff base — skip the filter there; outputs
        # stay empty and are only consulted on PRs (expensive jobs gate on
        # `github.event_name == 'schedule' ||` first, so nightly runs full).
        if: github.event_name != 'schedule'
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'packages/core/**'
              - 'packages/i18n/**'
              - 'scripts/**'
              - '!scripts/check_frontend_file_size.py'
              - '!scripts/check-testid.ts'
              - '!scripts/validate-i18n.ts'
              - '!scripts/testid_baselines.json'
              - 'tests/**'
              - 'evals/**'
              - 'pyproject.toml'
              - 'uv.lock'
            frontend:
              - 'packages/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              # Cross-cutting: these scripts/ files live outside
              # packages/web/ but are only ever run by the frontend job
              # (see check_frontend_file_size.py's import of
              # scripts/architecture/baselines.py — a shared, low-level
              # module also used by backend architecture checks, so it
              # stays in both lists).
              - 'scripts/check_frontend_file_size.py'
              - 'scripts/architecture/baselines.py'
              - 'scripts/check-testid.ts'
              - 'scripts/check_test_performance.py'
              - 'scripts/validate-i18n.ts'
              - 'scripts/testid_baselines.json'
            workflows:
              - '.github/workflows/**'
              - '.github/zizmor.yml'
              - '.github/CODEOWNERS'

  # -------------------------------------------------------------------------
  # Fast fail: architecture constraints (< 30s)
  # -------------------------------------------------------------------------
  architecture:
    name: Architecture Constraints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately NOT gated on `changes` — this job is cheap (~3min) and
    # covers cross-cutting drift checks (docs, ADRs, eval smoke, registry)
    # that don't map cleanly to a single path. Keep it as the universal
    # fast-fail gate; gate only the genuinely expensive jobs below instead.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev

      # ── Deterministic venv contract ──────────────────────────────────
      # The venv is synced ONCE above via `uv sync --all-packages`. Every
      # check below uses `uv run --no-sync` so uv never re-reconciles the
      # workspace between steps. Without --no-sync, a version-sensitive uv
      # reconciliation can evict the `narrare` workspace member (it is not a
      # declared dependency of the root project), causing
      # `No module named 'narrare'` flakes.
      # ─────────────────────────────────────────────────────────────────
      - name: Check architecture constraints (incl. prompt integrity)
        run: uv run --no-sync python scripts/check_architecture.py --prompt-integrity

      # RULE-23 type-ignore discipline — blocking ratchet (wired 2026-08-19,
      # RULE-23 Phase 2). Full scan against the JSON baseline: production
      # violations (naked / uncommented / production growth) exit 2, any
      # suppression-budget growth (test/other/total over the frozen
      # baseline) exits 1 — both fail this step. Baseline updates are
      # deliberate, guarded commits (--update-baseline; disappearing keys
      # must be named via --allow-removed).
      - name: Check type-ignore discipline (RULE-23 ratchet)
        run: uv run --no-sync python -m scripts.check_type_ignores

      - name: Check prompt surface contract (ADR-037 + ADR-049 Phase D)
        run: uv run --no-sync python scripts/check_prompt_surface_contract.py

      - name: Check version consistency (workspace drift)
        run: uv run --no-sync python scripts/check_version_consistency.py

      - name: Check exception baseline (no-growth gate)
        run: uv run --no-sync python scripts/check_exception_baseline.py

      - name: Check exception sync (pyproject ↔ CONSTRAINTS.md)
        run: uv run --no-sync python scripts/check_exception_baseline.py --check-sync

      - name: Check OpenAPI spec drift
        run: uv run --no-sync python scripts/export_openapi.py --check

      - name: Check prompt structure
        run: uv run --no-sync python scripts/check_prompt_structure.py

      - name: Run invocation probes
        run: uv run --no-sync python scripts/probes/run_all_probes.py --evidence-dir .evidence

      - name: Check feature adoption
        run: uv run --no-sync python scripts/check_adoption.py --evidence-dir .evidence

      - name: Check locale sync
        run: uv run --no-sync python scripts/check_locale_sync.py

      - name: Check documentation drift
        run: uv run --no-sync python scripts/check_doc_drift.py

      - name: Check ADR naming convention (review-04 AUFG-04-10)
        run: uv run --no-sync python scripts/check_adr_naming.py

      - name: Check registry drift (P3)
        run: uv run --no-sync python scripts/check_registry_drift.py

      - name: Quality metrics (P3, opt-in)
        run: uv run --no-sync python scripts/check_quality_metrics.py --quality

      - name: Check gate exceptions expiry
        run: uv run --no-sync python scripts/check_gate_expirations.py

      - name: Check gate drift (docs vs CI)
        run: uv run --no-sync python scripts/check_gate_drift.py

      - name: Check streaming compliance (RULE-20)
        run: |
          uv run --no-sync python scripts/check_streaming_compliance.py

      - name: Check AI interaction compliance (ADR-043 / §16)
        run: |
          uv run --no-sync python scripts/checks/check_ai_interaction_compliance.py

      # Mutation-inert convention — asset-reading tests under the MutMut scopes
      # (tests/unit/core/, tests/unit/api/) must carry @pytest.mark.mutation_inert
      # so MutMut's -m "not mutation_inert" filter excludes them. Prevents the
      # sandbox crash class that aborted the August 2026 monthly run (#146).
      - name: Check mutation-inert convention (asset-reading tests)
        run: |
          uv run --no-sync python scripts/checks/check_mutation_inert_assets.py

      - name: System health aggregation
        run: uv run --no-sync python scripts/check_system_health.py

      - name: Check test coverage gaps (RULE-10)
        run: uv run --no-sync python scripts/check_test_coverage_gaps.py --fail-on-missing

      # Eval smoke tests — deterministic, no provider secrets needed.
      # Runtime evals (with real LLM calls) run in nightly workflow, not PR CI.
      # See docs/development/testing-standards.md § "LLM Prompt Evaluation".
      - name: Run eval smoke tests
        run: uv run --no-sync python -m evals run --suite all --mode smoke

      - name: Check eval drift
        run: uv run --no-sync python scripts/check_eval_drift.py

      - name: Check SSOT facts (CURRENT_STATE.md)
        run: uv run --no-sync python scripts/check_current_state_facts.py

  # -------------------------------------------------------------------------
  # Quality gate: lint, typecheck, security in ONE job (spec §8 Phase 2) —
  # a shared checkout + a single `uv sync` save ~2-3 min per run in setup
  # and per-job minute rounding. Event-agnostic like its predecessors
  # (lint / typecheck / security ran on every event too).
  # -------------------------------------------------------------------------
  quality:
    name: Lint, Typecheck & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [architecture]
    steps:
      # fetch-depth: full history (0) on pushes to main/develop for the
      # gitleaks full-history scan; shallow (1) otherwise — PR diffs are
      # small enough that the default clone covers the changed range.
      # NOTE: must stay in canonical ternary form `!= 'push' && 1 || 0`.
      # The previous `== 'push' && 0 || 1` silently always yielded 1 (the
      # true-branch 0 is falsy, so `|| 1` always won) — zizmor's
      # unsound-ternary rule guards this pattern now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ github.event_name != 'push' && 1 || 0 }}
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      # Single sync for all three blocks. The embeddings extra is REQUIRED
      # (not optional): pyright resolves imports behind the embeddings extra
      # (the old typecheck job synced it; ruff/bandit don't care, so this
      # superset serves everyone).
      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --extra embeddings

      # ── Lint & format ─────────────────────────────────────────────────
      - name: Ruff lint
        run: uv run ruff check apps/ packages/ scripts/ tests/

      - name: Ruff format check
        run: uv run ruff format --check apps/ packages/ scripts/ tests/

      # ── Type checking ─────────────────────────────────────────────────
      # Pyright cache: RESTORE-only here. The write is a separate, explicit
      # actions/cache/save step at the END of this job, gated to nightly
      # and main pushes (see "Save Pyright cache" below) — cache writes are
      # visible and deliberate, never an implicit post-step side effect.
      - name: Restore Pyright cache
        id: pyright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .pyright/
            **/.pyc
          key: pyright-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'tests/pyrightconfig.json') }}
          restore-keys: |
            pyright-${{ runner.os }}-

      - name: Pyright
        run: uv run pyright

      # Mirror the local `just typecheck-tests` gate (and pre-commit
      # `pyright-tests` hook): the main pyright config (pyproject.toml)
      # excludes tests/ for performance, so test files are type-checked
      # separately by tests/pyrightconfig.json (basic mode). Q-015-Q-019
      # gate-coverage follow-up.
      - name: Pyright (Tests)
        run: uv run pyright --project tests/pyrightconfig.json

      # ── Security ──────────────────────────────────────────────────────
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scanning (Gitleaks) — AUFG-05-09
        run: uv run python scripts/check_secrets.py

      # Bandit — the -r target set MUST stay set-equal to the pre-push bandit
      # hook and `just security` (production + scripts + evals); parity is
      # machine-pinned by tests/unit/scripts/test_bandit_scope_parity.py.
      - name: Bandit
        run: |
          uv run bandit -c pyproject.toml \
            -r apps/api/narrare packages/core/narrare_core scripts evals

      - name: pip-audit
        # No vulnerability ignores are currently active (re-evaluated 2026-08).
        # Previously-ignored advisories — both now resolved, so the ignores
        # were stale and have been removed:
        #   - PYSEC-2025-183 (CVE-2025-45768, PyJWT <= 2.10.1): pyjwt is pinned
        #     at 2.13.0, above the last-affected version, so pip-audit no longer
        #     flags it.
        #   - GHSA-rrmf-rvhw-rf47 (CVE-2025-3000, PyTorch torch.jit.script): a
        #     fix is now published upstream (torch 2.13.0) and torch is locked at
        #     that version, so the previous "no upstream fix" ignore was stale.
        # h2 CVE-2026-71554 was resolved by upgrading h2 4.3.0 -> 4.4.1.
        # If a future advisory genuinely has no upstream fix, add a targeted
        # --ignore-vuln here with a re-evaluate date and a linked tracking issue.
        run: uv run pip-audit --skip-editable

      # Pyright cache WRITE — explicit, gated, auditable (TanStack lesson:
      # cache writes must be visible, not hidden in a post-step). PRs are
      # restore-only; only the nightly (schedule) and pushes to main write
      # the cache, so PR-supplied code can never poison a cache consumed by
      # other workflows. The cache-hit guard skips futile re-saves of an
      # already-existing immutable key (nightly/main noise).
      - name: Save Pyright cache
        if: (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.pyright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .pyright/
            **/.pyc
          key: pyright-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'tests/pyrightconfig.json') }}
  # -------------------------------------------------------------------------
  # Workflow security audit (zizmor) — blocking PR check when workflows
  # change + nightly (spec §5.2). Catches: dangerous triggers, template
  # injection, impostor commits, vulnerable action versions, unpinned uses.
  # -------------------------------------------------------------------------
  zizmor:
    name: Workflow Security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       needs.changes.outputs.workflows == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        env:
          # GITHUB_TOKEN enables zizmor's online audits (impostor-commit,
          # known-vulnerable-actions) against this private repo.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pipx install "zizmor==1.30.1"
          zizmor --config .github/zizmor.yml .github/workflows/

  # -------------------------------------------------------------------------
  # Unit tests (< 5 min, no Docker)
  # -------------------------------------------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]
    # PR-gated full suite; nightly/dispatch run everything (spec §3).
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev

      - name: Install export toolchain
        # pandoc is required by the real-binary renderer unit tests in
        # tests/unit/api/export/test_pandoc_{base,md}.py (ADR-081 / Slice 3).
        # These live in tests/unit/ (NOT tests/integration/) because they need
        # the binary but NO postgres — the integration conftest's
        # session-autouse fixture would skip them when the DB is down. Without
        # pandoc here, their ``skipif(not shutil.which("pandoc"))`` guard skips
        # them in every CI job (test-integration/test-e2e install the toolchain
        # but only collect tests/integration|e2e/), so the real renderer would
        # never be exercised in CI. Typst is included for the upcoming PDF
        # renderer tests (Slice 4/5, also tests/unit/). EPUBCheck is skipped —
        # it needs Java and is CI-validation-only (golden tests).
        run: bash scripts/install_export_toolchain.sh

      - name: Run unit tests
        id: tests
        env:
          # Dummy API keys for unit tests (tests mock all LLM calls)
          ANTHROPIC_API_KEY: sk-test-dummy
          OPENAI_API_KEY: sk-test-dummy
        run: |
          set -o pipefail
          uv run pytest tests/unit/ \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=pytest.xml \
            --cov-fail-under=80 \
            -n auto --dist loadfile \
            -v | tee pytest-coverage.txt

      - name: Check coverage threshold
        if: always() && steps.tests.outcome != 'cancelled'
        run: |
          uv run python -c "
          import xml.etree.ElementTree as ET
          import sys
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib['line-rate'])
          pct = rate * 100
          print(f'Coverage: {pct:.1f}%')
          if pct < 80:
              print(f'::error::Coverage {pct:.1f}% is below the 80% target threshold')
              sys.exit(1)
          else:
              print(f'Coverage {pct:.1f}% meets the 80% target threshold')
           "

      - name: Check per-module coverage (RULE-10 + ratchet)
        if: always() && steps.tests.outcome != 'cancelled'
        run: |
          uv run python scripts/check_module_coverage.py --fail

      - name: Check pytest collection performance
        if: always() && steps.tests.outcome != 'cancelled'
        run: |
          mkdir -p /tmp/warnings
          # Capture output for the step log; only real ::warning:: lines go
          # to the warnings report (keeps the summary clean when under threshold).
          output=$(uv run python scripts/check_pytest_collection_performance.py 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q "::warning::"; then
            printf '%s\n' "$output" >> /tmp/warnings/report.txt
          fi

      - name: Pytest coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@432ac90e8d345c93e1d90ee0838b35913abc9c9b # v1.12.2
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
          title: "Unit Test Coverage"
          badge-title: "Coverage"
          hide-emoji: true
          hide-report: true
          report-only-changed-files: true
          remove-links-to-files: true
          remove-links-to-lines: true
          xml-skip-covered: true

      - name: Upload coverage artifacts
        # Feeds the nightly badge job (same-run artifact). Schedule-only:
        # test-unit itself is skipped on push, so a push gate here is dead.
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-artifacts
          path: |
            coverage.xml
            pytest-coverage.txt
            pytest.xml
          retention-days: 1

      - name: Upload warnings
        if: always() && steps.tests.outcome != 'cancelled'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warnings-test-unit
          path: /tmp/warnings/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # Integration tests (< 5 min, with Docker)
  # -------------------------------------------------------------------------
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, changes]
    # PR path: skip on draft PRs (WIP iteration doesn't need the
    # Docker+spaCy path — it reruns once marked ready-for-review) and on
    # PRs whose diff never touched backend code. Nightly/dispatch run all.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       needs.changes.outputs.backend == 'true' &&
       github.event.pull_request.draft != true)

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      TEST_DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --extra nlp

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0" # pinned — zizmor unpinned-tools

      - name: Install spaCy NLP models
        run: just install-nlp-models

      - name: Run migrations
        run: cd apps/api && uv run alembic upgrade head

      - name: Install export toolchain
        # Typst + pandoc (render binaries) + EPUBCheck (EPUB validation gate).
        # The Golden-Pages acceptance tests (tests/golden/export/) need all
        # three; the RULE-08 checker runs statically in the architecture job.
        run: INSTALL_EPUBCHECK=1 bash scripts/install_export_toolchain.sh

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ -v -n auto --dist=loadfile --timeout=120 -m "not schema_mutating"
          # Schema-mutating migration round-trip tests (alembic downgrade/upgrade)
          # run serially in a second phase — they must never race other tests
          # against the shared test-DB schema.
          uv run pytest tests/integration/ -v --timeout=120 -m schema_mutating

      - name: Run Golden-Pages export tests (EPUBCheck gate)
        # W3C EPUBCheck validates the rendered EPUB end-to-end (ADR-081 D7).
        # EPUBCheck (installed above via INSTALL_EPUBCHECK=1) is a Java tool;
        # the ubuntu runner image ships a JRE, so no setup-java step is needed.
        # EPUBCheck is CI-only — never a local-dev or production dependency —
        # so this gate lives in tests/golden/ and is exercised only here (the
        # test-unit job installs pandoc but not EPUBCheck, so the
        # epubcheck-subprocess test skips there; the structural EPUB
        # assertions still run in test-unit). Serial for clear EPUBCheck output.
        run: uv run pytest tests/golden/ -v -m golden_pages --timeout=120

  # -------------------------------------------------------------------------
  # Update coverage badge in README (nightly only — test-unit no longer
  # runs on push, so push runs produce no coverage artifact)
  # -------------------------------------------------------------------------
  update-coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test-unit
    # Nightly-only: test-unit is skipped on push, so no coverage artifact
    # exists there to download (spec §4.1 — push+schedule collapses to
    # schedule).
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-artifacts

      - name: Extract coverage percentage
        id: coverage
        run: |
          python3 -c "
          import os, xml.etree.ElementTree as ET
          rate = float(ET.parse('coverage.xml').getroot().attrib['line-rate'])
          pct = int(round(rate * 100))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'coverage={pct}\n')
          print(f'coverage={pct}')
          "

      - name: Update README badge
        env:
          COVERAGE: ${{ steps.coverage.outputs.coverage }}
        run: |
          python3 -c "
          import os, re
          coverage = int(os.environ['COVERAGE'])
          if coverage >= 90:
              color = 'brightgreen'
          elif coverage >= 80:
              color = 'green'
          elif coverage >= 70:
              color = 'yellow'
          elif coverage >= 60:
              color = 'orange'
          else:
              color = 'red'
          badge = f'<a href=\"https://github.com/jmerifjKriwe/narrare/blob/main/README.md\"><img alt=\"Coverage\" src=\"https://img.shields.io/badge/Coverage-{coverage}%25-{color}.svg\" /></a>'
          badge_block = f'<!-- Pytest Coverage Comment:Begin -->\n{badge}\n<!-- Pytest Coverage Comment:End -->'
          with open('README.md', 'r') as f:
              content = f.read()
          pattern = r'<!-- Pytest Coverage Comment:Begin -->.*?<!-- Pytest Coverage Comment:End -->'
          new_content, count = re.subn(pattern, badge_block, content, flags=re.DOTALL)
          if count == 0:
              lines = content.split('\n')
              insert_idx = -1
              for i, line in enumerate(lines):
                  if 'img.shields.io/badge/' in line or '[![' in line:
                      insert_idx = i
              if insert_idx >= 0:
                  lines.insert(insert_idx + 1, '')
                  lines.insert(insert_idx + 2, badge_block)
                  new_content = '\n'.join(lines)
              else:
                  lines.insert(1, '')
                  lines.insert(2, badge_block)
                  new_content = '\n'.join(lines)
          with open('README.md', 'w') as f:
              f.write(new_content)
          print(f'Updated coverage badge: {coverage}% ({color})')
          "

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          # [skip ci] prevents the badge commit from re-triggering a full
          # push CI run (spec §4.1 — the amplifier loop).
          commit_message: "docs: update coverage badge [skip ci]"
          file_pattern: README.md

  # -------------------------------------------------------------------------
  # Frontend (< 3 min)
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend
    # Pinned to ubuntu-22.04 (not ubuntu-latest) for reproducible font
    # library versions (libpango/libcairo/libfreetype) — VRT screenshot
    # baselines are font-rendering-sensitive. ubuntu-latest silently
    # rotates OS versions and would drift baselines without warning.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [architecture, changes]
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.workflows == 'true') &&
       github.event.pull_request.draft != true)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # check_frontend_file_size.py (+ its import scripts/architecture/
      # baselines.py) and check_test_performance.py are both confirmed
      # stdlib-only (json, dataclasses, pathlib, typing / argparse, os,
      # subprocess, time). No uv/venv needed anywhere in this job — GitHub's
      # ubuntu-latest runner ships Python 3.12+ already. This drops
      # setup-uv entirely, on top of the ~45s `uv sync --all-packages
      # --group dev` this job never actually needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint + format check
        run: cd packages/web && npx biome check .

      - name: i18n validation
        run: npx tsx scripts/validate-i18n.ts

      - name: Check frontend file sizes (RULE-04)
        run: python3 scripts/check_frontend_file_size.py

      - name: Type check
        run: cd packages/web && pnpm type-check

      - name: Test
        id: frontend-tests
        run: |
          start_time=$(date +%s)
          trap 'end_time=$(date +%s); echo "duration=$((end_time - start_time))" >> "$GITHUB_OUTPUT"' EXIT
          cd packages/web && pnpm test:coverage

      # NOTE: 307 test files, 2518 tests. Per-file overhead dominates
      # (~90% of time). Consolidating test files is the only path to <120s.
      # Threshold 240s. Re-measured snapshot 2026-07-09: 161.3s locally (307
      # files / 2518 tests), ~49% headroom under the 240s budget. CI runs on a
      # slower 4-core runner than local dev; the budget absorbs that variance.
      # Still WARNING-only — check_test_performance.py emits a ::warning::
      # annotation and always exits 0 (does not block CI).
      # Re-measure locally:
      #   uv run python scripts/check_test_performance.py --run --threshold 99999
      - name: Check frontend test performance
        if: always() && steps.frontend-tests.outcome != 'cancelled'
        run: |
          mkdir -p /tmp/warnings
          threshold=240
          duration=${{ steps.frontend-tests.outputs.duration }}
          if [ -z "$duration" ]; then
            echo "⚠️ Could not determine test duration (step may have been cancelled)"
            echo "⚠️ Frontend test duration unavailable (cancelled)" >> /tmp/warnings/report.txt
            exit 0
          fi
          # Capture output for the step log; only real ::warning:: lines go to
          # the warnings report (keeps the summary clean when under threshold).
          output=$(python3 scripts/check_test_performance.py \
            --duration "$duration" --threshold "$threshold" 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q "::warning::"; then
            printf '%s\n' "$output" >> /tmp/warnings/report.txt
          fi

      - name: Check component markers (data-testid)
        run: cd packages/web && npx tsx scripts/check-testid.ts --strict --fail --ratchet-baseline scripts/testid_baselines.json

      # ADR-059 Mock Contract (BINDING) — static check that every VRT spec
      # has the catch-all route, expect.poll guard, and timezoneId. Runs
      # BEFORE the expensive Playwright browser install + dev-server compile
      # so a contract violation fails in <1s instead of after minutes.
      - name: Check VRT mock contract (ADR-059 BINDING)
        run: cd packages/web && npx tsx scripts/check-vrt-mock-contract.ts

      - name: Install Playwright Chromium
        run: cd packages/web && pnpm playwright install chromium

      - name: VRT Screenshot Tests
        id: vrt-tests
        run: |
          start_time=$(date +%s)
          trap 'end_time=$(date +%s); echo "duration=$((end_time - start_time))" >> "$GITHUB_OUTPUT"' EXIT
          cd packages/web && pnpm playwright test --project=vrt

      # VRT is a hard gate: baselines are CI-native (ubuntu-22.04), regenerated
      # via .github/workflows/vrt-update-baselines.yml. Diffs are uploaded on
      # failure for diagnosis.
      - name: Upload VRT diffs
        if: failure() && steps.vrt-tests.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-test-results
          path: packages/web/test-results/
          retention-days: 7

      - name: Build
        run: cd packages/web && pnpm build

      - name: Upload warnings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warnings-frontend
          path: /tmp/warnings/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # Frontend standalone smoke (PR-only blind-spot guard)
  # -------------------------------------------------------------------------
  # test-e2e boots the standalone Next server but runs nightly + on dispatch —
  # the next@16.3.1/@swc/helpers standalone crash (fixed in 5e014943) was
  # invisible on PR CI. This job builds the standalone tree and verifies it
  # boots on PRs, cheaply: no Playwright, no screenshots → ubuntu-latest
  # (no font-rendering sensitivity).
  frontend-standalone:
    name: Frontend Standalone Smoke
    runs-on: ubuntu-latest
    needs: [changes]
    # PR-only (nightly runs are covered by test-e2e). workflows==true keeps
    # the job self-exercising on PRs that modify ci.yml itself.
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true')
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone frontend
        run: cd packages/web && pnpm build

      - name: Copy static + public into standalone tree
        run: |
          cp -r packages/web/.next/static packages/web/.next/standalone/packages/web/.next/static
          cp -r packages/web/public packages/web/.next/standalone/packages/web/public

      - name: Boot standalone server (smoke check)
        run: |
          # Use the standalone server instead of 'pnpm start' because Next.js
          # standalone mode is not compatible with 'next start' (mirrors test-e2e).
          AUTH_JWT_SECRET=test-secret-key-not-for-production \
          PORT=3000 node packages/web/.next/standalone/packages/web/server.js > /tmp/standalone-server.log 2>&1 &
          server_pid=$!
          # Always stop the server once the smoke check is done (success or fail).
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          echo "Waiting for standalone server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Standalone server is ready"
              break
            fi
            sleep 1
          done
          # Verify the server actually started
          if ! curl -sf http://localhost:3000 > /dev/null; then
            echo "ERROR: Standalone server failed to start. Logs:"
            cat /tmp/standalone-server.log || true
            exit 1
          fi

  # -------------------------------------------------------------------------
  # E2E tests (nightly + manual dispatch, full stack)
  # -------------------------------------------------------------------------
  test-e2e:
    name: E2E Tests
    # Pinned to ubuntu-22.04 to match the frontend (VRT) job — both use
    # Playwright, keeping them on the same OS version avoids environment
    # divergence between the two browser-driven jobs.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [quality]
    # Full-stack E2E moved from every main-push to nightly + manual
    # dispatch (spec §3; was 192 min of the Sept 1-14 burn).
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      TEST_DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-not-for-production
      ANTHROPIC_API_KEY: sk-test-dummy
      OPENAI_API_KEY: sk-test-dummy
      NARRARE_ENCRYPTION_KEY: WYcr1iULJse2Oo6GPpmw1Au4ovp_fXZwbrNF11C12ZQ=
      NARRARE_E2E_TEST: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Python dependencies
        run: uv sync --frozen --all-packages --group dev --extra nlp

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0" # pinned — zizmor unpinned-tools

      - name: Install spaCy NLP models
        run: just install-nlp-models

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: cd apps/api && uv run alembic upgrade head

      - name: Seed dev user
        run: uv run python scripts/seed_dev_user.py

      - name: Install export toolchain
        # Typst + pandoc so a real export E2E can run (ADR-081).
        run: INSTALL_EPUBCHECK=1 bash scripts/install_export_toolchain.sh

      - name: Build frontend
        run: cd packages/web && pnpm build

      - name: Start API server
        run: |
          cd apps/api && uv run uvicorn narrare._app.main:app \
            --host 0.0.0.0 --port 8000 > /tmp/api-server.log 2>&1 &
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API server is ready"
              break
            fi
            sleep 1
          done
          # Verify the server actually started
          if ! curl -sf http://localhost:8000/health > /dev/null; then
            echo "ERROR: API server failed to start. Logs:"
            cat /tmp/api-server.log || true
            exit 1
          fi

      - name: Start frontend server
        run: |
          # Use the standalone server instead of 'pnpm start' because Next.js standalone mode
          # is not compatible with 'next start'.
          # We need to copy static and public files into the standalone directory first.
          cp -r packages/web/.next/static packages/web/.next/standalone/packages/web/.next/static
          cp -r packages/web/public packages/web/.next/standalone/packages/web/public

          AUTH_JWT_SECRET=test-secret-key-not-for-production \
          PORT=3000 node packages/web/.next/standalone/packages/web/server.js > /tmp/frontend-server.log 2>&1 &
          echo "Waiting for frontend server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Frontend server is ready"
              break
            fi
            sleep 1
          done
          # Verify the server actually started
          if ! curl -sf http://localhost:3000 > /dev/null; then
            echo "ERROR: Frontend server failed to start. Logs:"
            cat /tmp/frontend-server.log || true
            exit 1
          fi

      - name: Run E2E tests
        timeout-minutes: 15
        run: uv run pytest tests/e2e/ -v -m e2e --timeout=300 --timeout-method=thread
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
          CI: "true"
          NARRARE_E2E_TEST: 1
          AUTH_JWT_SECRET: test-secret-key-not-for-production

      - name: Collect server logs on failure
        if: failure()
        run: |
          echo "=== API Server Logs ==="
          cat /tmp/api-server.log || echo "No API logs found"
          echo ""
          echo "=== Frontend Server Logs ==="
          cat /tmp/frontend-server.log || echo "No frontend logs found"

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # Warning summary — aggregates ::warning:: annotations across all jobs
  # -------------------------------------------------------------------------
  warnings-summary:
    if: >-
      always() && !cancelled() &&
      (needs.test-unit.result != 'skipped' ||
       needs.frontend.result != 'skipped')
    needs: [architecture, test-unit, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download warning artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: warnings-*
          merge-multiple: true

      - name: Build warning summary
        run: |
          # Show ⚠️ header only when there are real warnings; otherwise a clean
          # all-clear line so an all-green run no longer looks like a problem.
          if [ -f report.txt ] && [ -s report.txt ]; then
            echo "# ⚠️ CI Warning Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See individual job steps for full ::warning:: annotation details." \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No CI warnings across all jobs." >> $GITHUB_STEP_SUMMARY
          fi

  # -------------------------------------------------------------------------
  # Quota guardrail (spec §4.3): month-to-date Actions minutes vs the
  # 2000-min GitHub Free quota. Sums per-job wall time — billing counts
  # each job separately and rounds each job up to the minute, so this
  # stays ~1-3% low; treat 80% as "act now". Fetching one jobs page per
  # completed run takes a couple of minutes, hence timeout-minutes 10.
  # -------------------------------------------------------------------------
  budget-report:
    name: Quota Budget Report
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Sum month-to-date workflow minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          quota = 2000
          warn_at = 0.80
          first = datetime.now(timezone.utc).strftime("%Y-%m-01T00:00:00Z")
          runs_cap = 500  # bound jobs API calls (~1 request per run)

          def fetch(url):
              # At this request volume (~1 per run) transient 5xx/429s do
              # happen; retry with backoff so the guardrail never dies on one.
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={
                          "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                          "Accept": "application/vnd.github+json"})
                      with urllib.request.urlopen(req) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if attempt == 3 or e.code not in (429, 500, 502, 503, 504):
                          raise
                      time.sleep(2 * (attempt + 1))

          def job_minutes(started, completed):
              s = datetime.fromisoformat(started.replace("Z", "+00:00"))
              c = datetime.fromisoformat(completed.replace("Z", "+00:00"))
              return (c - s).total_seconds() / 60

          repo = os.environ["REPO"]
          total = 0.0
          processed = 0
          suspect = 0  # runs whose jobs data looks empty vs their own wall time
          for page in range(1, 11):  # 10 x 100 runs/month is ample
              data = fetch(f"https://api.github.com/repos/{repo}/actions/runs"
                           f"?per_page=100&page={page}&created=>={first}")
              runs = data.get("workflow_runs", [])
              for run in runs:
                  if run["event"] == "dynamic":   # Dependabot runs are free
                      continue
                  if run.get("status") != "completed":
                      continue
                  if processed >= runs_cap:
                      break
                  processed += 1
                  # Billing counts each job separately: sum per-job wall
                  # time. per_page=100 covers this repo's ~13-job runs.
                  jobs = fetch(f"https://api.github.com/repos/{repo}/actions"
                               f"/runs/{run['id']}/jobs?per_page=100")
                  run_sum = 0.0
                  for job in jobs.get("jobs", []):
                      # Skipped jobs carry bogus timestamps (observed:
                      # completed before started) and are not billed —
                      # exclude by conclusion; clamp residual negatives.
                      started, completed = job.get("started_at"), job.get("completed_at")
                      if (started and completed
                              and job.get("status") == "completed"
                              and job.get("conclusion") != "skipped"):
                          run_sum += max(job_minutes(started, completed), 0.0)
                  total += run_sum
                  # Degraded-API guard: a completed run with minutes of wall
                  # time but almost no job minutes signals missing jobs data
                  # (observed live alongside 502s) — flag it instead of
                  # silently undercounting.
                  wall = 0.0
                  if run.get("run_started_at") and run.get("updated_at"):
                      wall = job_minutes(run["run_started_at"], run["updated_at"])
                  if wall >= 2.0 and run_sum < wall * 0.1:
                      suspect += 1
              if len(runs) < 100 or data.get("incomplete_results") or processed >= runs_cap:
                  break
          pct = total / quota
          summary = (f"Month-to-date CI usage: {total:.0f} min of {quota} "
                     f"({pct:.0%}, per-job sum; billing rounds each job up to the minute).")
          if suspect:
              summary += (f" WARNING: jobs data missing for {suspect} of "
                          f"{processed} run(s) — figure may undercount.")
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(summary + "\n")
          if suspect:
              print(f"::warning title=Actions quota::Jobs data missing for "
                    f"{suspect} run(s) — this figure may undercount.")
          if pct >= warn_at:
              print(f"::warning title=Actions quota::Quota at {pct:.0%} — "
                    "activate reserve levers (spec §8: Phase 2 consolidation, "
                    "weekly nightly).")
          EOF
