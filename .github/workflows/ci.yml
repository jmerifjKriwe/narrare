name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly: every capability, every suite — but only when main moved since
    # the last successful nightly (the guard job decides). 03:17 UTC.
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A narrow change on top of a wide one supersedes it, so a new push cancels
  # the run of the commit it stands on: two pushes in a row used to run two
  # full suites side by side, for two trees where the newer one contains the
  # older. The nightly is exempt, because a push at 03:18 must not cancel the
  # one run the nightly-guard reads back tomorrow.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

# Actions are pinned by commit SHA and name their release in a trailing comment;
# release-please.yml, which carries write tokens, has always done it this way.
# A major tag is a mutable ref: its owners can move `v7` to any commit, and that
# commit then runs with this workflow's token — no diff here, no review.
# Dependabot's monthly `github-actions` update keeps the pins current.
#
# The pin also fixes the runtime: every action below runs on Node 24, so no
# action is forced onto a runtime its own CI never tested.

jobs:
  # One cheap job every other job waits for. On a nightly it answers the
  # only question that matters first: is main still where the last
  # successful nightly left it? Then nothing below runs, because the same
  # commit has already been tested — no runner minutes, no credits, and
  # every job below reports skipped. On PRs and pushes it always proceeds.
  nightly-guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # gh api prefixes nothing: a relative path without repos/<owner>/<repo>
          # resolves to api.github.com/actions/... and answers 404.
          last=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          echo "last successful nightly tested: ${last:-none}"
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly skipped: main is unchanged since the last successful nightly."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  lint-types:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks scans the push range base^..head, which needs
      # the base commit that a shallow (depth-1) checkout does not have.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      # --locked, not a plain sync: uv otherwise rewrites a stale lock inside
      # the throwaway checkout and reports success. That is how 0.2.0 reached
      # main with uv.lock still at 0.1.0.
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: just lint
      - run: just typecheck
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Which E2E suites a change owes, resolved by scripts/affected.py — one
  # resolver, not a second copy of the mapping here (spec §6 "affected
  # capabilities": the capabilities a change touches, or all of them when a
  # shared surface moved). This job only picks the resolver's mode per event:
  # a pull request is measured against where it branched, a push to main owes
  # nothing, and a nightly takes everything.
  changes:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      capabilities: ${{ steps.suites.outputs.capabilities }}
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: suites
        env:
          # What kind of event this is: the resolver's mode differs per event.
          EVENT: ${{ github.event_name }}
          # A fork may name its branch anything, so the branch name alone says
          # nothing about who pushed it: the release-PR exception below also
          # requires the head to live in this repository.
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git fetch origin main
            mode="--base origin/main"
          elif [ "$EVENT" = push ]; then
            # A push to main owes nothing: the merge tree is the tree its PR
            # already tested, and a change that lands without a PR is covered
            # by the nightly. The workflow decides the mode, so no range is
            # read.
            mode="--none"
          else
            # A nightly has no range to read: every suite.
            mode="--all"
          fi
          # No single condition below is trustable alone: a fork may take the
          # branch name, and the release files are ordinary ones. Passing
          # --release-pr only re-checks the range against the release set in
          # the script; the script itself still requires every changed path
          # to be one.
          release_pr=""
          if [ "$EVENT" = pull_request ] \
            && [ "$PR_HEAD_REPO" = "$BASE_REPO" ] \
            && [ "$GITHUB_HEAD_REF" = "release-please--branches--main--components--narrare" ] \
            && [ -n "$(git diff --name-only origin/main...HEAD)" ]; then
            release_pr="--release-pr"
          fi
          # The runner's python3, before any uv sync: the resolver is stdlib
          # only. A resolver that cannot name a range answers with every
          # suite (fail-open), and every resolution exits 0 — only a broken
          # script reddens the job, which is why the exit status is read
          # instead of trusted to `bash -e`.
          reason_file=$(mktemp)
          status=0
          capabilities=$(python3 scripts/affected.py $mode $release_pr --json 2>"$reason_file") || status=$?
          echo "::notice::$(cat "$reason_file")"
          rm -f "$reason_file"
          if [ "$status" -ne 0 ]; then
            echo "affected.py failed with status $status"
            exit "$status"
          fi
          echo "capabilities=$capabilities"
          echo "capabilities=$capabilities" >> "$GITHUB_OUTPUT"
          # Legacy output for the e2e job below, which still reads `suites`;
          # the matrix that replaces it consumes `capabilities` directly.
          suites=none
          if [ "$capabilities" != "[]" ]; then
            names=${capabilities#\[}
            names=${names%\]}
            names=${names//\"/}
            # Splitting on the JSON punctuation is safe: the names are
            # directory identifiers the resolver read from
            # app/capabilities/*/e2e, never anything with a quote or comma.
            set -- ${names//,/ }
            known=$(find app/capabilities -mindepth 2 -maxdepth 2 -type d -name e2e | wc -l)
            if [ "$#" -eq "$known" ]; then
              suites=all
            else
              suites=""
              for name in "$@"; do suites="$suites app/capabilities/$name/e2e/"; done
              suites=${suites# }
            fi
          fi
          echo "suites=$suites"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  tests:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U narrare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      # One suite, run once. `main` is where coverage is measured, and a second
      # job used to measure it by running the same suite a second time; the
      # covered invocation replaces the plain one on a main push instead. A PR
      # keeps `just test`, so nothing instruments a PR.
      - run: just test
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      - name: Tests with coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run pytest app --cov --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      # `!cancelled()` on both uploads: a report is worth uploading even when a
      # test failed, and a report that stays away is worse than a red one. A
      # bare `if:` carries `success()`, so the coverage upload skipped itself on
      # every failing `main` push: 0a468e49 reached Codecov as a commit with no
      # report at all (`state: pending`, `totals: null`), and the dashboard kept
      # showing the previous merge — the failing run is exactly the one whose
      # coverage matters. `always()` would be wrong in the other direction: it
      # also uploads from a run `concurrency` cancelled mid-suite, which is
      # partial by construction. A hard crash that leaves no `coverage.xml`
      # still fails the upload step, and should: on a green run that is a real
      # defect.
      #
      # `version` pins the CLI the action downloads, which is unchecked by
      # default: without it every run pulls `cli.codecov.io/latest` — v11.3.2
      # when this line was written — so an upstream release would land in this
      # job unreviewed. Dependabot follows the action's SHA and cannot see this
      # input: the bump is manual.
      #
      # `fail_ci_if_error` on the coverage upload only. The report is what the
      # dashboard reads, so a run that could not deliver it says so instead of
      # going green with nothing to show — that silence is what left the
      # dashboard on an older merge. It cannot gate anything: both uploads run
      # only on a `main` push, so `tests` blocks a merge on a red suite and
      # never on Codecov. The junit upload keeps the default, because test
      # analytics failing should not red an otherwise green suite.
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          version: v11.3.2
          fail_ci_if_error: true
      # A second run of the same action with `report_type`, not Codecov's
      # separate test-results-action: that one is deprecated in favor of this
      # (it says so on every run) and would be the only Node-20 action left in
      # this file.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          version: v11.3.2
          report_type: test_results

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-types, changes]
    if: needs.changes.outputs.suites != 'none'
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U narrare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: pnpm install --frozen-lockfile
      # What `just test-e2e` runs, minus its `--worktree` (a no-op on this
      # clean checkout); the suites come from the changes job, so a change
      # pays for what it touches.
      - name: E2E
        run: |
          suites="${{ needs.changes.outputs.suites }}"
          [ "$suites" = all ] && suites="app/capabilities/*/e2e/"
          uv run pytest $suites -v -m e2e --timeout=60

  build:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      # The web unit suite — six files (four in `web/`, two in capability `web/`
      # folders) and 39 tests — lived only in the pre-commit hook: a fresh clone
      # has that hook, a drive-by contributor does not, so their frontend could
      # reach `main` with `vitest` red. It runs before the build because it is
      # the cheaper step.
      - run: just test-frontend
      - run: just build

