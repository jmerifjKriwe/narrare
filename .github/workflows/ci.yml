name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # -------------------------------------------------------------------------
  # Fast fail: architecture constraints (< 30s)
  # -------------------------------------------------------------------------
  architecture:
    name: Architecture Constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Check architecture constraints
        run: uv run python scripts/check_architecture.py

  # -------------------------------------------------------------------------
  # Lint & format (< 60s)
  # -------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: architecture
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Ruff lint
        run: uv run ruff check apps/ packages/ scripts/ tests/

      - name: Ruff format check
        run: uv run ruff format --check apps/ packages/ scripts/ tests/

  # -------------------------------------------------------------------------
  # Type checking (< 2 min)
  # -------------------------------------------------------------------------
  typecheck:
    name: Type Check (pyright)
    runs-on: ubuntu-latest
    needs: architecture
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Pyright
        run: uv run pyright

  # -------------------------------------------------------------------------
  # Security (< 60s)
  # -------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: architecture
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Bandit
        run: |
          uv run bandit -c pyproject.toml \
            -r apps/api/narrare packages/core/narrare_core

      - name: pip-audit
        run: uv run pip-audit

  # -------------------------------------------------------------------------
  # Unit tests (< 5 min, no Docker)
  # -------------------------------------------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Run unit tests
        env:
          # Dummy API keys for unit tests (tests mock all LLM calls)
          ANTHROPIC_API_KEY: sk-test-dummy
          OPENAI_API_KEY: sk-test-dummy
        run: |
          uv run pytest tests/unit/ \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=pytest.xml \
            -v | tee pytest-coverage.txt

      - name: Pytest coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
          title: "Unit Test Coverage"
          badge-title: "Coverage"
          hide-emoji: true
          report-only-changed-files: true

  # -------------------------------------------------------------------------
  # Integration tests (< 5 min, with Docker)
  # -------------------------------------------------------------------------
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Run migrations
        run: cd apps/api && uv run alembic upgrade head

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v

  # -------------------------------------------------------------------------
  # Update coverage badge in README (main push only)
  # -------------------------------------------------------------------------
  update-coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    needs: test-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Run unit tests
        env:
          ANTHROPIC_API_KEY: sk-test-dummy
          OPENAI_API_KEY: sk-test-dummy
        run: |
          uv run pytest tests/unit/ \
            --cov \
            --cov-report=term-missing:skip-covered \
            --junitxml=pytest.xml \
            -v | tee pytest-coverage.txt

      - name: Pytest coverage comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
          hide-comment: true

      - name: Update README badge
        run: |
          sed -i '/<!-- Pytest Coverage Comment:Begin -->/,/<!-- Pytest Coverage Comment:End -->/c\<!-- Pytest Coverage Comment:Begin -->\n${{ steps.coverage.outputs.coverageHtml }}\n<!-- Pytest Coverage Comment:End -->' ./README.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update coverage badge"
          file_pattern: README.md

  # -------------------------------------------------------------------------
  # Frontend (< 3 min)
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: architecture

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint + format check
        run: cd packages/web && npx biome check .

      - name: i18n validation
        run: npx tsx scripts/validate-i18n.ts

      - name: Type check
        run: cd packages/web && pnpm type-check

      - name: Test
        run: cd packages/web && pnpm test

      - name: Build
        run: cd packages/web && pnpm build

  # -------------------------------------------------------------------------
  # E2E tests (main branch only, full stack)
  # -------------------------------------------------------------------------
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      TEST_DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-not-for-production
      ANTHROPIC_API_KEY: sk-test-dummy
      OPENAI_API_KEY: sk-test-dummy

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Python dependencies
        run: uv sync --all-packages --group dev

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: cd apps/api && uv run alembic upgrade head

      - name: Seed dev user
        run: uv run python scripts/seed_dev_user.py

      - name: Build frontend
        run: cd packages/web && pnpm build

      - name: Start API server
        run: |
          cd apps/api && uv run uvicorn narrare._app.main:app \
            --host 0.0.0.0 --port 8000 > /tmp/api-server.log 2>&1 &
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API server is ready"
              break
            fi
            sleep 1
          done
          # Verify the server actually started
          if ! curl -sf http://localhost:8000/health > /dev/null; then
            echo "ERROR: API server failed to start. Logs:"
            cat /tmp/api-server.log || true
            exit 1
          fi

      - name: Start frontend server
        run: |
          cd packages/web && pnpm start > /tmp/frontend-server.log 2>&1 &
          echo "Waiting for frontend server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Frontend server is ready"
              break
            fi
            sleep 1
          done
          # Verify the server actually started
          if ! curl -sf http://localhost:3000 > /dev/null; then
            echo "ERROR: Frontend server failed to start. Logs:"
            cat /tmp/frontend-server.log || true
            exit 1
          fi

      - name: Run E2E tests
        run: uv run pytest tests/e2e/ -v -m e2e --timeout=60
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
          CI: "true"

      - name: Collect server logs on failure
        if: failure()
        run: |
          echo "=== API Server Logs ==="
          cat /tmp/api-server.log || echo "No API logs found"
          echo ""
          echo "=== Frontend Server Logs ==="
          cat /tmp/frontend-server.log || echo "No frontend logs found"
