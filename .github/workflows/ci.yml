name: CI

# ---------------------------------------------------------------------------
# Gate Compliance Audit (as of: 2026-10-17 — synced with the CI R1
# event-driven redesign; spec:
# docs/superpowers/specs/2026-10-16-ci-r1-event-driven-redesign.md)
# ---------------------------------------------------------------------------
# Reference: this header table is the CI-gate SSOT; canonical prose doc:
# docs/development/quality-gates.md (mirrored content, machine-checked for
# presence by scripts/check_gate_drift.py — keep the two in sync).
#
# | Gate | Tool / Check                            | CI Status   | Notes                                                          |
# |------|------------------------------------------|-------------|----------------------------------------------------------------|
# | G1   | pytest unit + integration + e2e          | ✅ Blocking  | Unit/Integration/E2E in separate jobs                          |
# | G2   | --cov-fail-under (Coverage)              | ✅ Blocking (≥80%) | Target 80% reached (global 82.51%)                       |
# | G3   | check_architecture.py                    | ✅ Blocking  | architecture Job                                               |
# | G3e  | check_type_ignores (RULE-23)             | ✅ Blocking  | architecture Job (ratchet — additions fail)                    |
# | G3b  | check_exception_baseline.py              | ✅ Blocking  | architecture Job                                               |
# | G3d  | check_prompt_surface_contract.py         | ✅ Blocking  | architecture Job (ADR-037 + ADR-049 Phase D)                   |
# | G3c  | export_openapi.py --check                | ✅ Blocking  | architecture Job                                               |
# | G4   | test_fake_conformance.py                 | ✅ Blocking  | test-unit Job (via pytest)                                     |
# | G5   | Cross-layer contract tests               | ✅ Blocking  | test-unit Job (via pytest)                                     |
# | G6   | pyright (strict; mypy not required)      | ✅ Blocking  | test-unit pre-block (PR/nightly) + push-only quality Job [1]   |
# | G6a  | pyrefly (additive, ADR-097; 3 kinds off + baseline) | ✅ Blocking | quality split as G6 [1]                                |
# | G7   | ruff check + ruff format --check         | ✅ Blocking  | quality split as G6 [1]                                        |
# | G8   | check_adoption.py                        | ✅ Blocking  | architecture Job                                               |
# | G9   | check_prompt_structure.py                | ✅ Blocking  | architecture Job                                               |
# | G9   | check_streaming_compliance.py (RULE-20)  | ✅ Blocking  | architecture Job                                               |
# | G10  | check_locale_sync.py                     | ✅ Blocking  | architecture Job (was: warning)                                |
# | --   | check_doc_drift.py                       | ✅ Blocking  | architecture Job                                               |
# | --   | check_registry_drift.py                  | ✅ Blocking  | architecture Job                                               |
# | --   | check_quality_metrics.py                 | ⚠️ Warning   | architecture Job (opt-in)                                      |
# | --   | check_frontend_file_size.py (RULE-04)    | ✅ Blocking  | frontend Job                                                   |
# | --   | check_test_coverage_gaps.py (RULE-10)    | ✅ Blocking  | architecture Job                                               |
# | --   | evals smoke (pydantic-evals)             | ✅ Blocking  | architecture Job (secret-free)                                 |
# | --   | check_eval_drift.py                      | ✅ Blocking  | architecture Job                                               |
# | --   | check_module_coverage.py (RULE-10)       | ✅ Blocking  | test-unit Job (--fail, ratcheted baselines)                    |
# | --   | check-testid.ts (data-testid gate)       | ✅ Blocking  | frontend Job                                                   |
# | --   | check-vrt-mock-contract.ts (ADR-059)     | ✅ Blocking  | frontend Job (before VRT run)                                  |
# | --   | Gitleaks (secret scanning, AUFG-05-09)   | ✅ Blocking  | quality split as G6 [1] (push path: full history)              |
# | --   | bandit + pip-audit                       | ✅ Blocking  | quality split as G6 [1]                                        |
# | --   | biome check (frontend lint/format)       | ✅ Blocking  | frontend Job                                                   |
# | --   | pnpm test (frontend tests)               | ✅ Blocking  | frontend Job                                                   |
# | --   | Standalone boot smoke (frontend)         | ✅ Blocking  | frontend Job (post-Build step; PRs + frontend nights, W1-6)    |
# | --   | check_test_performance.py                | ⚠️ Warning   | frontend Job (WARNING-only)                                    |
# | --   | check_pytest_collection_performance.py   | ⚠️ Warning   | test-unit Job (WARNING-only)                                   |
# | --   | check_current_state_facts.py (SSOT)      | ✅ Blocking  | architecture Job                                               |
# | --   | check_adr_naming.py (review-04 AUFG-04-10) | ✅ Blocking | architecture Job (ADR-XXX-*.md convention)                     |
# | --   | budget-report (quota early-warning)      | 📅 Weekly    | Sundays 03:07 UTC, non-blocking (W1-7, spec §5.7)              |
# | MutMut Mutation Score | mutation-testing-monthly.yml | 📅 Monthly | Non-blocking, issue report                                     |
#
# [1] Quality split (R3, spec §5.8, tasks W1-3/W1-4): the tool steps live
#     once in the local composite .github/actions/quality — run as
#     test-unit's pre-pytest step-group on the PR/nightly paths and by the
#     push-only quality Job (code-filtered, spec §5.3) on direct pushes.
#
# Composition notes (post-redesign; spec §5):
# - Nightly (02:37): event-driven/incremental via the nightly-gate Job —
#   should_run/probe/component gating (e2e = backend ∨ frontend); weekly
#   full probe Sundays; idle nights skip all expensive jobs. Budget
#   nights (Sun 03:07) run budget-report only.
# - PR types: [opened, synchronize, reopened, ready_for_review] (W1-5) —
#   draft != true jobs rerun when a draft is marked ready.
# - test-unit (incl. the folded quality tools) runs on backend PRs only
#   (changes.backend, spec §5.4); docs-/frontend-only PRs skip it.
# - E2E (W1-12, spec §5.10): nightly + dispatch + path-gated PR branch —
#   tests/e2e/** only (changes.e2e_specs, draft != true); closes the
#   W0-3 cluster-A blind spot (new E2E specs' first CI contact was the
#   post-merge nightly). An E2E-spec PR also trips changes.backend
#   (tests/** is inside the backend filter), so unit + integration run
#   on the same PR as well — per the §5.10 cost estimate, not an error.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  schedule:
    # Nightly FULL run (default branch): PRs are the gate; this is the
    # post-merge safety net (spec 2026-09-29 §3). 02:37 UTC.
    # Off the :30 minute deliberately: GitHub's scheduler full-skipped the
    # first two slots at :30 (Oct 1 + Oct 2, 2026; 0 schedule runs in the
    # workflow's history despite state=active) and its docs warn about
    # high load at common minutes (our monthly cron saw a 6.8 h delay on
    # Oct 1). Validated executable via workflow_dispatch run 36972990834.
    - cron: "37 2 * * *"
    # Budget report: weekly, Sundays 03:07 UTC (W1-7, spec §5.7) — off-peak
    # like the nightly. Jobs discriminate by the exact schedule string
    # (`github.event.schedule`): on budget nights everything except
    # budget-report skips.
    - cron: "7 3 * * 0"
  pull_request:
    # W1-5 (spec §5.5): default types omit ready_for_review, so jobs that
    # skip drafts (draft != true guards) never rerun when a draft is marked
    # ready — with no branch protection (GitHub Free) nothing catches the gap.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "evals/**"
      - "docs/development/deployment-guide.md"
      - "docs/_shared/CONSTRAINTS.md"
      - "docs/_shared/CURRENT_STATE.md"
      - "docs/_shared/TECH_STACK.md"
      - "docs/architecture/decisions/**"
      - ".devcontainer/**"
      - ".env.example"
      - ".gitleaks.toml"
      - ".github/workflows/**"
      - ".github/zizmor.yml"
      - ".github/CODEOWNERS"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose*.yml"
      - "justfile"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "packages/web/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".pre-commit-config.yaml"
  push:
    branches: [main, develop]

# Budget guard: superseded runs on the same PR cancel; main pushes queue
# instead of cancelling. The group includes the event name so the nightly
# full run (schedule) can never be cancelled by a same-ref push — PRs are
# the gate, the nightly is the post-merge safety net (spec 2026-09-29 §3).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # -------------------------------------------------------------------------
  # Change detection: which parts of the tree actually moved?
  # Cheap (~5s), lets expensive jobs skip themselves when irrelevant.
  # Always runs on push (main/develop) so post-merge signal stays complete;
  # on PRs it narrows scope to what the diff actually touches. Nightly and
  # dispatch runs execute this job too — on schedule the filter step is
  # skipped (no diff base). Budget nights (03:07 Sundays, W1-7 §5.7) skip
  # the whole job: nothing consumes these outputs there. Outputs are
  # consulted on PRs (component gates) and, since W1-4, on push: the
  # `code` output gates the push-only quality job (spec §5.3).
  # -------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The exact schedule string is the 02:37-nightly vs 03:07-budget
    # discriminator (W1-7, §5.7): PR/push/dispatch/nightly run exactly as
    # before, budget nights skip.
    if: >-
      github.event_name != 'schedule' ||
      github.event.schedule == '37 2 * * *'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
      code: ${{ steps.filter.outputs.code }}
      # Gates test-e2e's PR branch (W1-12, §5.10). Consulted on
      # pull_request only — the schedule/dispatch paths run the full
      # matrix via nightly-gate (W1-2 empty-output pattern: the gate
      # skips on PRs, so its outputs are '' and this output decides).
      e2e_specs: ${{ steps.filter.outputs.e2e_specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        # schedule runs have no diff base — skip the filter there; outputs
        # stay empty and are only consulted on PRs (expensive jobs gate on
        # `github.event_name == 'schedule' ||` first, so nightly runs full).
        if: github.event_name != 'schedule'
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'packages/core/**'
              - 'packages/i18n/**'
              - 'scripts/**'
              - '!scripts/check_frontend_file_size.py'
              - '!scripts/check-testid.ts'
              - '!scripts/validate-i18n.ts'
              - '!scripts/testid_baselines.json'
              - 'tests/**'
              - 'evals/**'
              - 'pyproject.toml'
              - 'uv.lock'
              # Tool-input parity (§5.8, W1-4): a gitleaks-config-only PR
              # still exercises the folded quality tools (same precedent
              # as pyproject.toml/uv.lock above).
              - '.gitleaks.toml'
            frontend:
              - 'packages/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              # Cross-cutting: these scripts/ files live outside
              # packages/web/ but are only ever run by the frontend job
              # (see check_frontend_file_size.py's import of
              # scripts/architecture/baselines.py — a shared, low-level
              # module also used by backend architecture checks, so it
              # stays in both lists).
              - 'scripts/check_frontend_file_size.py'
              - 'scripts/architecture/baselines.py'
              - 'scripts/check-testid.ts'
              - 'scripts/check_test_performance.py'
              - 'scripts/validate-i18n.ts'
              - 'scripts/testid_baselines.json'
            workflows:
              - '.github/workflows/**'
              - '.github/zizmor.yml'
              - '.github/CODEOWNERS'
            # Push-only quality gate (R3, spec §5.3, task W1-4): consumed
            # by the `quality` job's `if`. Sealed exact list — a superset
            # of every quality-tool input (ruff/pyright/bandit/pip-audit
            # target exactly these paths; gitleaks scans shallow on push),
            # so docs/state-only pushes cannot change any tool input and
            # skip the job. Deliberately job-level (NOT on.push.paths): a
            # workflow-level filter would suppress changes/architecture on
            # docs pushes, violating §5.3's "always" requirement.
            code:
              - 'apps/api/**'
              - 'packages/**'
              - 'scripts/**'
              - 'evals/**'
              - 'pyproject.toml'
              - 'uv.lock'
            # E2E spec-suite files (W1-12, spec §5.10) — gates test-e2e's
            # PR branch. Decision: tests/e2e/** ONLY. The CI E2E job runs
            # the pytest suite (uv run pytest tests/e2e/); it never reads
            # packages/web/playwright.config.ts — that config drives the
            # frontend Job's Node @playwright/test runner (VRT + web e2e),
            # already PR-gated via the `frontend` filter
            # (packages/web/**). Shared boot infra (seed_dev_user.py,
            # justfile, export toolchain) is likewise excluded:
            # cross-job inputs are validated by the nightly (≤1d) and by
            # the jobs that own them on the same PR. The PR path
            # validates the SPECS (the W0-3 cluster-A gap), not the app.
            # Nightly needs NO duplicate term here: tests/e2e/** ⊂
            # tests/** ⊂ the backend filter, so spec changes already wake
            # the nightly and set backend=true — nightly-gate's derived
            # `e2e` (backend ∨ frontend) covers them. Deliberately
            # distinct from that derived output: spec files (PR) vs
            # full-stack delta (nightly).
            e2e_specs:
              - 'tests/e2e/**'

  # -------------------------------------------------------------------------
  # Nightly Gate — event-driven nightly foundation (spec
  # 2026-10-16-ci-r1-event-driven-redesign §5.1, task W1-1).
  #
  # Resolves the last SUCCESSFUL schedule run of this workflow ("last
  # green") and diffs every nightly-relevant path against it. Every
  # expensive job consumes these outputs since W1-2 (spec §5.1 table):
  # the schedule path gates on them, the PR path keeps consulting the
  # `changes` job, so on PR/push events this job skips entirely and its
  # outputs stay empty by design (consumer `if`s tolerate that — every
  # gate-output reference sits behind an explicit event check).
  #
  # FAIL-OPEN CONTRACT (spec §5.1, §11): an unresolvable API failure or a
  # first-ever run without any successful nightly emits should_run=true
  # plus every component true — a gate bug must degrade to a FULL nightly,
  # never to a skipped one. should_run=false is reachable ONLY through a
  # correctly resolved, genuinely empty delta (idle night). dorny with an
  # explicit base SHA likewise treats an unreachable base (force-push/
  # rebase, no common ancestor) as "all files added" — same direction.
  #
  # workflow_dispatch = full matrix unconditionally (manual run, no base
  # comparison); `probe` additionally turns true on Sundays (§5.1.4).
  # -------------------------------------------------------------------------
  nightly-gate:
    name: Nightly Gate
    # PR/push runs skip the whole job: outputs are consulted on the
    # nightly path only (W1-2's PR branches keep consulting `changes`).
    # W1-7 (§5.7): the schedule branch additionally discriminates the cron
    # string, so the gate doesn't run (and bill) on budget nights (03:07
    # Sundays); dispatch and the 02:37 nightly keep running.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       github.event.schedule == '37 2 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Last-green lookup calls the Actions API (workflow runs list).
      actions: read
    outputs:
      # Composition: dispatch or fail-open forces every output true;
      # otherwise the resolved dorny delta decides. All derivation stays
      # in these expressions — no ${{ }} templating inside run: bodies.
      # should_run includes the probe term: a probe Sunday forces the
      # FULL matrix "regardless of deltas" (§5.1.4; §9.2 R4 bills 4.3 ×
      # ~39 min/mo for exactly that), and the consumer conditions are
      # sealed as `should_run && (probe ‖ component)` — without the term
      # here, an idle Sunday would evaluate should_run=false, probe=true
      # and skip the entire probe. should_run therefore means "the
      # nightly does anything tonight", not merely "a delta exists".
      should_run: >-
        ${{
          github.event_name == 'workflow_dispatch' ||
          steps.lastgreen.outputs.failopen == 'true' ||
          steps.lastgreen.outputs.sunday == 'true' ||
          steps.filter.outputs.backend == 'true' ||
          steps.filter.outputs.frontend == 'true' ||
          steps.filter.outputs.workflows == 'true'
        }}
      backend: >-
        ${{
          github.event_name == 'workflow_dispatch' ||
          steps.lastgreen.outputs.failopen == 'true' ||
          steps.filter.outputs.backend == 'true'
        }}
      frontend: >-
        ${{
          github.event_name == 'workflow_dispatch' ||
          steps.lastgreen.outputs.failopen == 'true' ||
          steps.filter.outputs.frontend == 'true'
        }}
      workflows: >-
        ${{
          github.event_name == 'workflow_dispatch' ||
          steps.lastgreen.outputs.failopen == 'true' ||
          steps.filter.outputs.workflows == 'true'
        }}
      # E2E is full-stack (spec §5.1): runs when either side changed.
      e2e: >-
        ${{
          github.event_name == 'workflow_dispatch' ||
          steps.lastgreen.outputs.failopen == 'true' ||
          steps.filter.outputs.backend == 'true' ||
          steps.filter.outputs.frontend == 'true'
        }}
      # Weekly full probe: Sundays, UTC (§5.1.4). Dispatch/fail-open
      # already run the full matrix, which subsumes the probe.
      probe: >-
        ${{
          github.event_name == 'workflow_dispatch' ||
          steps.lastgreen.outputs.failopen == 'true' ||
          steps.lastgreen.outputs.sunday == 'true'
        }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The last-green base can be arbitrarily old; a full clone keeps
          # dorny's local diff possible and fetch-doubling out of the way.
          fetch-depth: 0
          # dorny must be able to fetch the base commit when it is no
          # longer locally reachable (force-push/rebase) — without the
          # token that path would fail CLOSED, violating the fail-open
          # contract. Same adjudication as the `changes` job's checkout
          # above (persisted credentials REQUIRED; Task-2 CONCERN 1);
          # the zizmor baseline carries the entry.
          persist-credentials: true

      - name: Resolve last successful nightly SHA (fail-open)
        id: lastgreen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYEOF'
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          out_path = os.environ["GITHUB_OUTPUT"]

          def emit(key, value):
              with open(out_path, "a", encoding="utf-8") as fh:
                  fh.write(f"{key}={value}\n")

          # Manual dispatch = full matrix by definition; no base lookup.
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              emit("failopen", "true")
              print("workflow_dispatch: manual run = full matrix (no base)")
              raise SystemExit(0)

          # Weekly full-probe flag (§5.1.4): Sunday in UTC. (Note: %u
          # numbers Sunday 7, not 0 — weekday()==6 is the unambiguous form.)
          now = dt.datetime.now(dt.timezone.utc)
          emit("sunday", "true" if now.weekday() == 6 else "false")

          url = (
              "https://api.github.com/repos/"
              + os.environ["REPO"]
              + "/actions/workflows/ci.yml/runs"
              + "?event=schedule&status=success&per_page=1"
          )
          data = None
          try:
              # Retry with backoff on 429/5xx — budget-report pattern
              # (§5.1 step 1). Unresolvable failure -> fail-open below.
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={
                          "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                          "Accept": "application/vnd.github+json",
                      })
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          data = json.load(resp)
                      break
                  except urllib.error.HTTPError as exc:
                      if attempt == 3 or exc.code not in (429, 500, 502, 503, 504):
                          raise
                      time.sleep(2 * (attempt + 1))
          except Exception as exc:
              # Fail-open contract: degrade to a full nightly, never fail
              # closed (failure is logged here, RULE-11 satisfied).
              print(f"last-green lookup failed: {exc!r} -> fail-open")

          runs = (data or {}).get("workflow_runs") or []
          sha = runs[0].get("head_sha") if runs else ""
          if sha:
              emit("sha", sha)
              emit("failopen", "false")
              print(f"last successful nightly: {sha[:12]}")
          else:
              # First-ever run (no successful nightly yet) or unresolved
              # API failure — both fail open.
              emit("failopen", "true")
              print("no last-green SHA resolved -> fail-open (full nightly)")
          PYEOF

      - name: Detect nightly-relevant changes since last green
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        # Meaningful only with a resolved base; dispatch and fail-open
        # short-circuit at the outputs level instead (all forced true).
        if: steps.lastgreen.outputs.sha != ''
        with:
          # Delta against the last green nightly, not the default branch.
          base: ${{ steps.lastgreen.outputs.sha }}
          filters: |
            # NIGHTLY FILTER SYNC: the backend/frontend/workflows path
            # lists below must stay identical to the `changes` job's
            # filters above (spec §5.1 reuse-verbatim rule) so the PR-side
            # and nightly side can never drift; the `.gitleaks.toml`
            # backend entry (W1-4, §5.8 tool-input parity) is present in
            # BOTH lists. should_run = the union of the three.
            backend:
              - 'apps/api/**'
              - 'packages/core/**'
              - 'packages/i18n/**'
              - 'scripts/**'
              - '!scripts/check_frontend_file_size.py'
              - '!scripts/check-testid.ts'
              - '!scripts/validate-i18n.ts'
              - '!scripts/testid_baselines.json'
              - 'tests/**'
              - 'evals/**'
              - 'pyproject.toml'
              - 'uv.lock'
              # Tool-input parity (§5.8, W1-4): a gitleaks-config-only PR
              # still exercises the folded quality tools (same precedent
              # as pyproject.toml/uv.lock above).
              - '.gitleaks.toml'
            frontend:
              - 'packages/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              # Cross-cutting scripts: rationale documented in the
              # `changes` job's frontend filter (shared baseline module).
              - 'scripts/check_frontend_file_size.py'
              - 'scripts/architecture/baselines.py'
              - 'scripts/check-testid.ts'
              - 'scripts/check_test_performance.py'
              - 'scripts/validate-i18n.ts'
              - 'scripts/testid_baselines.json'
            workflows:
              - '.github/workflows/**'
              - '.github/zizmor.yml'
              - '.github/CODEOWNERS'

  # -------------------------------------------------------------------------
  # Fast fail: architecture constraints (< 30s)
  # -------------------------------------------------------------------------
  architecture:
    name: Architecture Constraints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately NOT gated on `changes` — this job is cheap (~3min) and
    # covers cross-cutting drift checks (docs, ADRs, eval smoke, registry)
    # that don't map cleanly to a single path. Keep it as the universal
    # fast-fail gate on PR/push/dispatch; only the nightly path respects
    # nightly-gate's should_run so idle nights skip everything
    # (spec 2026-10-16 §5.1 table). The !cancelled() && !failure() prefix
    # is load-bearing: nightly-gate SKIPS on PR/push events, and without
    # an always()-class guard GitHub would skip this dependent too.
    needs: [nightly-gate]
    if: >-
      !cancelled() && !failure() &&
      (github.event_name != 'schedule' ||
       needs.nightly-gate.outputs.should_run == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          # World-drift pin: with no explicit interpreter, uv resolves the
          # NEWEST CPython it can find (`requires-python = ">=3.14"` admits
          # 3.15) — that broke the 2026-10-10 nightly: psycopg-binary ships
          # no cp315 wheels yet, so `uv sync --frozen` exited 2. "3.14"
          # matches .python-version and the project stack (TECH_STACK.md).
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev

      # ── Deterministic venv contract ──────────────────────────────────
      # The venv is synced ONCE above via `uv sync --all-packages`. Every
      # check below uses `uv run --no-sync` so uv never re-reconciles the
      # workspace between steps. Without --no-sync, a version-sensitive uv
      # reconciliation can evict the `narrare` workspace member (it is not a
      # declared dependency of the root project), causing
      # `No module named 'narrare'` flakes.
      # ─────────────────────────────────────────────────────────────────
      - name: Check architecture constraints (incl. prompt integrity)
        run: uv run --no-sync python scripts/check_architecture.py --prompt-integrity

      # RULE-23 type-ignore discipline — blocking ratchet (wired 2026-08-19,
      # RULE-23 Phase 2). Full scan against the JSON baseline: production
      # violations (naked / uncommented / production growth) exit 2, any
      # suppression-budget growth (test/other/total over the frozen
      # baseline) exits 1 — both fail this step. Baseline updates are
      # deliberate, guarded commits (--update-baseline; disappearing keys
      # must be named via --allow-removed).
      - name: Check type-ignore discipline (RULE-23 ratchet)
        run: uv run --no-sync python -m scripts.check_type_ignores

      - name: Check prompt surface contract (ADR-037 + ADR-049 Phase D)
        run: uv run --no-sync python scripts/check_prompt_surface_contract.py

      - name: Check version consistency (workspace drift)
        run: uv run --no-sync python scripts/check_version_consistency.py

      - name: Check exception baseline (no-growth gate)
        run: uv run --no-sync python scripts/check_exception_baseline.py

      - name: Check exception sync (pyproject ↔ CONSTRAINTS.md)
        run: uv run --no-sync python scripts/check_exception_baseline.py --check-sync

      - name: Check OpenAPI spec drift
        run: uv run --no-sync python scripts/export_openapi.py --check

      - name: Check prompt structure
        run: uv run --no-sync python scripts/check_prompt_structure.py

      - name: Run invocation probes
        run: uv run --no-sync python scripts/probes/run_all_probes.py --evidence-dir .evidence

      - name: Check feature adoption
        run: uv run --no-sync python scripts/check_adoption.py --evidence-dir .evidence

      - name: Check locale sync
        run: uv run --no-sync python scripts/check_locale_sync.py

      - name: Check documentation drift
        run: uv run --no-sync python scripts/check_doc_drift.py

      - name: Check ADR naming convention (review-04 AUFG-04-10)
        run: uv run --no-sync python scripts/check_adr_naming.py

      - name: Check registry drift (P3)
        run: uv run --no-sync python scripts/check_registry_drift.py

      - name: Quality metrics (P3, opt-in)
        run: uv run --no-sync python scripts/check_quality_metrics.py --quality

      - name: Check gate exceptions expiry
        run: uv run --no-sync python scripts/check_gate_expirations.py

      - name: Check gate drift (docs vs CI)
        run: uv run --no-sync python scripts/check_gate_drift.py

      - name: Check streaming compliance (RULE-20)
        run: |
          uv run --no-sync python scripts/check_streaming_compliance.py

      - name: Check AI interaction compliance (ADR-043 / §16)
        run: |
          uv run --no-sync python scripts/checks/check_ai_interaction_compliance.py

      # Mutation-inert convention — asset-reading tests under the MutMut scopes
      # (tests/unit/core/, tests/unit/api/) must carry @pytest.mark.mutation_inert
      # so MutMut's -m "not mutation_inert" filter excludes them. Prevents the
      # sandbox crash class that aborted the August 2026 monthly run (#146).
      - name: Check mutation-inert convention (asset-reading tests)
        run: |
          uv run --no-sync python scripts/checks/check_mutation_inert_assets.py

      - name: System health aggregation
        run: uv run --no-sync python scripts/check_system_health.py

      - name: Check test coverage gaps (RULE-10)
        run: uv run --no-sync python scripts/check_test_coverage_gaps.py --fail-on-missing

      # Eval smoke tests — deterministic, no provider secrets needed.
      # Runtime evals (with real LLM calls) run in nightly workflow, not PR CI.
      # See docs/development/testing-standards.md § "LLM Prompt Evaluation".
      - name: Run eval smoke tests
        run: uv run --no-sync python -m evals run --suite all --mode smoke

      - name: Check eval drift
        run: uv run --no-sync python scripts/check_eval_drift.py

      - name: Check SSOT facts (CURRENT_STATE.md)
        run: uv run --no-sync python scripts/check_current_state_facts.py

  # -------------------------------------------------------------------------
  # Quality gate (PUSH-ONLY, R3 decision (a), spec §5.8 + §5.3) — lint,
  # typecheck, security for direct pushes to main/develop, which bypass
  # PR gating entirely (§5.3: ~152 direct code pushes/month — this job
  # is their ONLY quality gate). On the PR and nightly paths the
  # identical tool set runs as a folded step-group inside test-unit
  # (backend-gated, §5.4), calling the same composite — tool parity
  # between the two call sites is structural, not discipline-dependent.
  # Code-gated (the sealed §5.3 `code` filter): docs/state-only pushes
  # cannot change any quality-tool input (ruff/pyright/bandit/pip-audit
  # inputs are exactly the filter's paths; gitleaks scans shallow on
  # push), so they skip the job.
  # -------------------------------------------------------------------------
  quality:
    name: Lint, Typecheck & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [architecture, changes]
    # Push-only AND code-gated (§5.3, task W1-4): never on PR/schedule/
    # dispatch — those paths get the tools inside test-unit (§5.8). The
    # !cancelled() && !failure() prefix keeps the push fast-fail
    # property: an architecture failure on a code push still skips this
    # job (unchanged from when the job ran on every event).
    if: >-
      !cancelled() && !failure() &&
      github.event_name == 'push' &&
      needs.changes.outputs.code == 'true'
    steps:
      # Push-only since W1-4: full history (0) for the gitleaks
      # full-history scan. The old event ternary collapsed to its push
      # branch once the job stopped running on any other event (§5.8).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          # World-drift pin — see architecture job (unpinned uv resolves the newest CPython; psycopg-binary wheel lag).
          python-version: "3.14"

      # Single sync for all three blocks. The embeddings extra is REQUIRED
      # (not optional): pyright resolves imports behind the embeddings extra
      # (the old typecheck job synced it; ruff/bandit don't care, so this
      # superset serves everyone).
      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --extra embeddings

      # ── Tool steps: shared composite action (R3, spec §5.8) ───────────
      # ruff → pip-audit + the Pyright cache restore/save live ONCE in
      # .github/actions/quality; this push-only job and the folded
      # test-unit step-group both call it, so the tool sequence cannot
      # drift between call sites. Contract (inputs/outputs, caller
      # obligations) is documented in that action's header.
      - uses: ./.github/actions/quality
  # -------------------------------------------------------------------------
  # Workflow security audit (zizmor) — blocking PR check when workflows
  # change + nightly (spec §5.2). Catches: dangerous triggers, template
  # injection, impostor commits, vulnerable action versions, unpinned uses.
  # -------------------------------------------------------------------------
  zizmor:
    name: Workflow Security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, nightly-gate]
    # Nightly path: workflow-relevant nights and the weekly probe only
    # (§5.1); PR path unchanged (self-exercising via `changes`); push
    # events keep skipping it. The !cancelled() && !failure() prefix
    # keeps the PR path alive despite the skipped nightly-gate need
    # (empty gate outputs are only ever consulted behind the explicit
    # `schedule` conjunct).
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'schedule' &&
        needs.nightly-gate.outputs.should_run == 'true' &&
        (needs.nightly-gate.outputs.probe == 'true' ||
         needs.nightly-gate.outputs.workflows == 'true')) ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        needs.changes.outputs.workflows == 'true'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        env:
          # GITHUB_TOKEN enables zizmor's online audits (impostor-commit,
          # known-vulnerable-actions) against this private repo.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pipx install "zizmor==1.30.1"
          zizmor --config .github/zizmor.yml .github/workflows/

  # -------------------------------------------------------------------------
  # Unit tests (< 5 min, no Docker) + folded quality tools (R3, §5.8)
  # -------------------------------------------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `architecture` replaces the dissolved quality edge as fast-fail
    # predecessor; `changes` feeds the PR backend gate (§5.4).
    needs: [architecture, changes, nightly-gate]
    # PR path: backend PRs only (§5.4, task W1-4) — docs-only, frontend-only
    # and workflows-only PRs skip unit AND the folded tools (R5 absorbed,
    # §5.8). The PR branch OR-composes nightly-gate's backend with changes'
    # backend per the W1-2 empty-output pattern (the gate skips on PR
    # events, so its output is '' and only `changes` decides). Nightly
    # path: active nights with a backend delta, or the weekly probe (§5.1)
    # — the folded tools ride this same gate, so unit nights exercise them
    # by construction (§5.8). Dispatch = full matrix incl. tools. The
    # !cancelled() && !failure() prefix keeps the PR/dispatch paths alive
    # when nightly-gate skips.
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'schedule' &&
        needs.nightly-gate.outputs.should_run == 'true' &&
        (needs.nightly-gate.outputs.probe == 'true' ||
         needs.nightly-gate.outputs.backend == 'true')) ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        (needs.nightly-gate.outputs.backend == 'true' ||
         needs.changes.outputs.backend == 'true')))
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          # World-drift pin — see architecture job (unpinned uv resolves the newest CPython; psycopg-binary wheel lag).
          python-version: "3.14"

      # The embeddings extra is REQUIRED from W1-4: pyright (folded
      # below) resolves imports behind it (§5.8 — previously only the
      # quality job synced it; setup-uv caching keeps the delta at
      # ~0.1–0.3 min).
      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --extra embeddings

      # ── R3 fold: quality tool steps (spec §5.8, task W1-4) ────────────
      # ruff → pip-audit + the Pyright cache restore/save run here via
      # the shared composite — the identical sequence the push-only
      # quality job runs (drift structurally impossible). Backend-gated
      # by this job's `if` (R5 absorbed); on the nightly path the cache
      # save stays schedule-only (the gate `if` lives inside the
      # composite). A lint/typecheck failure now fails THIS job — the
      # signal location changed, the isolation effect did not (§5.8
      # honest trade-off); pytest runs only after the tools pass.
      - uses: ./.github/actions/quality

      # ── Export toolchain cache (W3-3, spec §7) ────────────────────────
      # Key = hashFiles of the installer script (its version pins are the
      # only cache-relevant input) + runner.os, with a `lite` variant
      # namespace: this job installs WITHOUT EPUBCheck, test-integration/
      # test-e2e install WITH it — a shared key would let unit hit a
      # full cache and silently skip the launcher the golden tests need
      # (or poison a full cache with a launcher-less tree). Exact-key
      # only, NO restore-keys: a stale fallback would skip the install
      # of NEWLY pinned tool versions (silent version skew — the one
      # unacceptable failure mode here).
      # Hit mechanism: the install step is skipped entirely on exact
      # hit — the script force-reinstalls by design, so the guard is
      # what makes the hit a no-op; the cache itself carries identical
      # binaries (same script hash ⇒ same pins ⇒ same artifacts).
      # NARRARE_TOOLCHAIN_DIR redirects the installer into the cacheable
      # dir; the PATH step (always) makes shutil.which() find the
      # binaries in the pytest steps, exactly like ~/.local/bin did.
      - name: Restore export toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .toolchain/
          key: export-toolchain-lite-${{ runner.os }}-${{ hashFiles('scripts/install_export_toolchain.sh') }}

      - name: Install export toolchain
        # pandoc is required by the real-binary renderer unit tests in
        # tests/unit/api/export/test_pandoc_{base,md}.py (ADR-081 / Slice 3).
        # These live in tests/unit/ (NOT tests/integration/) because they need
        # the binary but NO postgres — the integration conftest's
        # session-autouse fixture would skip them when the DB is down. Without
        # pandoc here, their ``skipif(not shutil.which("pandoc"))`` guard skips
        # them in every CI job (test-integration/test-e2e install the toolchain
        # but only collect tests/integration|e2e/), so the real renderer would
        # never be exercised in CI. Typst is included for the upcoming PDF
        # renderer tests (Slice 4/5, also tests/unit/). EPUBCheck is skipped —
        # it needs Java and is CI-validation-only (golden tests).
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          NARRARE_TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchain
        run: bash scripts/install_export_toolchain.sh

      - name: Add export toolchain to PATH
        run: echo "${{ github.workspace }}/.toolchain/bin" >> "$GITHUB_PATH"

      # WRITE gate (spec §7 trust boundary): schedule only (nightly/
      # probe nights are the only writers; test-unit does not run on
      # push). PRs/dispatch restore-only; cache-hit guard skips futile
      # re-saves of an existing immutable key.
      - name: Save export toolchain cache
        if: github.event_name == 'schedule' && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .toolchain/
          key: export-toolchain-lite-${{ runner.os }}-${{ hashFiles('scripts/install_export_toolchain.sh') }}

      - name: Run unit tests
        id: tests
        env:
          # Dummy API keys for unit tests (tests mock all LLM calls)
          ANTHROPIC_API_KEY: sk-test-dummy
          OPENAI_API_KEY: sk-test-dummy
        run: |
          set -o pipefail
          uv run pytest tests/unit/ \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=pytest.xml \
            --cov-fail-under=80 \
            -n auto --dist loadfile \
            -v | tee pytest-coverage.txt

      - name: Check coverage threshold
        if: always() && steps.tests.outcome != 'cancelled'
        run: |
          uv run python -c "
          import xml.etree.ElementTree as ET
          import sys
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib['line-rate'])
          pct = rate * 100
          print(f'Coverage: {pct:.1f}%')
          if pct < 80:
              print(f'::error::Coverage {pct:.1f}% is below the 80% target threshold')
              sys.exit(1)
          else:
              print(f'Coverage {pct:.1f}% meets the 80% target threshold')
           "

      - name: Check per-module coverage (RULE-10 + ratchet)
        if: always() && steps.tests.outcome != 'cancelled'
        run: |
          uv run python scripts/check_module_coverage.py --fail

      - name: Check pytest collection performance
        if: always() && steps.tests.outcome != 'cancelled'
        run: |
          mkdir -p /tmp/warnings
          # Capture output for the step log; only real ::warning:: lines go
          # to the warnings report (keeps the summary clean when under threshold).
          output=$(uv run python scripts/check_pytest_collection_performance.py 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q "::warning::"; then
            printf '%s\n' "$output" >> /tmp/warnings/report.txt
          fi

      - name: Pytest coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@432ac90e8d345c93e1d90ee0838b35913abc9c9b # v1.12.2
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
          title: "Unit Test Coverage"
          badge-title: "Coverage"
          hide-emoji: true
          hide-report: true
          report-only-changed-files: true
          remove-links-to-files: true
          remove-links-to-lines: true
          xml-skip-covered: true

      - name: Upload coverage artifacts
        # Feeds the nightly badge job (same-run artifact). Schedule-only:
        # test-unit itself is skipped on push, so a push gate here is dead.
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-artifacts
          path: |
            coverage.xml
            pytest-coverage.txt
            pytest.xml
          retention-days: 1

      - name: Upload warnings
        if: always() && steps.tests.outcome != 'cancelled'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warnings-test-unit
          path: /tmp/warnings/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # Integration tests (< 5 min, with Docker)
  # -------------------------------------------------------------------------
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `architecture` replaces the dissolved quality edge (W1-4, §5.8) —
    # LOAD-BEARING: with `needs: [quality, …]` left in place this job
    # would silently skip on every PR/nightly run once quality became
    # push-only (spec §12 risk row "Missed needs rewires").
    needs: [architecture, changes, nightly-gate]
    # PR path: skip on draft PRs (WIP iteration doesn't need the
    # Docker+spaCy path — it reruns once marked ready-for-review) and on
    # PRs whose diff never touched backend code. Nightly path: active
    # nights with a backend delta, or the weekly probe (§5.1); dispatch
    # runs all. The !cancelled() && !failure() prefix keeps the PR/
    # dispatch paths alive when nightly-gate skips.
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'schedule' &&
        needs.nightly-gate.outputs.should_run == 'true' &&
        (needs.nightly-gate.outputs.probe == 'true' ||
         needs.nightly-gate.outputs.backend == 'true')) ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        needs.changes.outputs.backend == 'true' &&
        github.event.pull_request.draft != true))

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      TEST_DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          # World-drift pin — see architecture job (unpinned uv resolves the newest CPython; psycopg-binary wheel lag).
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --extra nlp

      # ── spaCy model cache (W3-2, spec §7) ─────────────────────────────
      # `just install-nlp-models` (justfile) does `uv pip install` of three
      # GitHub-release wheels (de/en/fr_core_news_md-<SPACY_VER>), where
      # SPACY_VER derives at runtime from the INSTALLED spacy version
      # (major.minor + ".0" per the recipe) — the model versions are NOT
      # literals in the justfile, so hashFiles('justfile') would NOT bust
      # on a spaCy/model bump. The key therefore resolves the same
      # derivation from the synced venv (uv.lock pins spacy): the most
      # stable minimal key — changes only when the models change. Tradeoff
      # vs duplicating the formula: if the recipe's derivation ever
      # changed, a drifted key would at worst restore models the install
      # step then correctly replaces (uv pip install compares
      # name==version, satisfaction always wins) — a saving degradation,
      # never a correctness risk.
      # Path: the wheels are pure (py3-none-any) and land as plain
      # packages in .venv site-packages. Restoring them AFTER `uv sync`
      # (which would prune foreign packages) makes `uv pip install`
      # short-circuit as already-satisfied — a wheel-URL requirement
      # carries name+version in its filename, so on match there is no
      # download and no relink: the install step becomes a near-no-op.
      # NO restore-keys: a fallback hit would restore wrong-version
      # models — stale model versions are useless, not partial (unlike
      # Playwright's additive browser revisions).
      - name: Resolve spaCy model version (cache key)
        id: spacy-version
        run: echo "version=$(uv run python -c 'import spacy; print(spacy.__version__.rsplit(".", 1)[0] + ".0")')" >> "$GITHUB_OUTPUT"

      - name: Restore spaCy model cache
        id: spacy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .venv/lib/python3*/site-packages/de_core_news_md*/**
            .venv/lib/python3*/site-packages/en_core_web_md*/**
            .venv/lib/python3*/site-packages/fr_core_web_md*/**
          key: spacy-models-${{ runner.os }}-spacy${{ steps.spacy-version.outputs.version }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0" # pinned — zizmor unpinned-tools

      - name: Install spaCy NLP models
        run: just install-nlp-models

      # WRITE gate (spec §7 trust boundary): schedule only — nightly/
      # probe nights are the only writers (test-integration does not run
      # on push). PRs and dispatch are restore-only; the cache-hit guard
      # skips futile re-saves of an existing immutable key. (If both
      # this job and test-e2e miss on the same night, the losing save
      # logs a benign "cache already exists" warning — job stays green.)
      - name: Save spaCy model cache
        if: github.event_name == 'schedule' && steps.spacy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .venv/lib/python3*/site-packages/de_core_news_md*/**
            .venv/lib/python3*/site-packages/en_core_web_md*/**
            .venv/lib/python3*/site-packages/fr_core_web_md*/**
          key: spacy-models-${{ runner.os }}-spacy${{ steps.spacy-version.outputs.version }}

      - name: Run migrations
        run: cd apps/api && uv run alembic upgrade head

      # ── Export toolchain cache (W3-3, spec §7) — full variant ─────────
      # `full` namespace: INSTALL_EPUBCHECK=1 (the `lite` cache test-unit
      # saves must never be hit here, nor poison a full tree). Key =
      # script hash (pins) + os; exact-key only — no stale-binary
      # fallback. Hit mechanism: install step skipped on exact hit (the
      # script force-reinstalls by design); NARRARE_TOOLCHAIN_DIR aims
      # the installer at the cacheable dir, the PATH step keeps
      # shutil.which() resolution identical.
      - name: Restore export toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .toolchain/
          key: export-toolchain-full-${{ runner.os }}-${{ hashFiles('scripts/install_export_toolchain.sh') }}

      - name: Install export toolchain
        # Typst + pandoc (render binaries) + EPUBCheck (EPUB validation gate).
        # The Golden-Pages acceptance tests (tests/golden/export/) need all
        # three; the RULE-08 checker runs statically in the architecture job.
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          NARRARE_TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchain
        run: INSTALL_EPUBCHECK=1 bash scripts/install_export_toolchain.sh

      - name: Add export toolchain to PATH
        run: echo "${{ github.workspace }}/.toolchain/bin" >> "$GITHUB_PATH"

      # WRITE gate: schedule only (nightly/probe nights are the only
      # writers; test-integration does not run on push). PRs/dispatch
      # restore-only; cache-hit guard skips futile re-saves. Shared key
      # with test-e2e's save: on a shared night the second writer logs a
      # benign already-exists warning.
      - name: Save export toolchain cache
        if: github.event_name == 'schedule' && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .toolchain/
          key: export-toolchain-full-${{ runner.os }}-${{ hashFiles('scripts/install_export_toolchain.sh') }}

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ -v -n auto --dist=loadfile --timeout=120 -m "not schema_mutating"
          # Schema-mutating migration round-trip tests (alembic downgrade/upgrade)
          # run serially in a second phase — they must never race other tests
          # against the shared test-DB schema.
          uv run pytest tests/integration/ -v --timeout=120 -m schema_mutating

      - name: Run Golden-Pages export tests (EPUBCheck gate)
        # W3C EPUBCheck validates the rendered EPUB end-to-end (ADR-081 D7).
        # EPUBCheck (installed above via INSTALL_EPUBCHECK=1) is a Java tool;
        # the ubuntu runner image ships a JRE, so no setup-java step is needed.
        # EPUBCheck is CI-only — never a local-dev or production dependency —
        # so this gate lives in tests/golden/ and is exercised only here (the
        # test-unit job installs pandoc but not EPUBCheck, so the
        # epubcheck-subprocess test skips there; the structural EPUB
        # assertions still run in test-unit). Serial for clear EPUBCheck output.
        run: uv run pytest tests/golden/ -v -m golden_pages --timeout=120

  # -------------------------------------------------------------------------
  # Update coverage badge in README (nightly only — test-unit no longer
  # runs on push, so push runs produce no coverage artifact)
  # -------------------------------------------------------------------------
  update-coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test-unit
    # Nightly-only: test-unit is skipped on push, so no coverage artifact
    # exists there to download (spec §4.1 — push+schedule collapses to
    # schedule). With the event-driven nightly, unit ALSO skips on idle
    # and non-backend nights — without the result guard this job would
    # fail downloading a nonexistent artifact (spec §5.1 table, fixed in
    # W1-2). Needs stays `test-unit` only: the condition references no
    # nightly-gate output, and with no status-check function in the `if`
    # the implicit success() prefix additionally guarantees the job never
    # runs after a failed/cancelled unit run.
    if: github.event_name == 'schedule' && needs.test-unit.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-artifacts

      - name: Extract coverage percentage
        id: coverage
        run: |
          python3 -c "
          import os, xml.etree.ElementTree as ET
          rate = float(ET.parse('coverage.xml').getroot().attrib['line-rate'])
          pct = int(round(rate * 100))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'coverage={pct}\n')
          print(f'coverage={pct}')
          "

      - name: Update README badge
        env:
          COVERAGE: ${{ steps.coverage.outputs.coverage }}
        run: |
          python3 -c "
          import os, re
          coverage = int(os.environ['COVERAGE'])
          if coverage >= 90:
              color = 'brightgreen'
          elif coverage >= 80:
              color = 'green'
          elif coverage >= 70:
              color = 'yellow'
          elif coverage >= 60:
              color = 'orange'
          else:
              color = 'red'
          badge = f'<a href=\"https://github.com/jmerifjKriwe/narrare/blob/main/README.md\"><img alt=\"Coverage\" src=\"https://img.shields.io/badge/Coverage-{coverage}%25-{color}.svg\" /></a>'
          badge_block = f'<!-- Pytest Coverage Comment:Begin -->\n{badge}\n<!-- Pytest Coverage Comment:End -->'
          with open('README.md', 'r') as f:
              content = f.read()
          pattern = r'<!-- Pytest Coverage Comment:Begin -->.*?<!-- Pytest Coverage Comment:End -->'
          new_content, count = re.subn(pattern, badge_block, content, flags=re.DOTALL)
          if count == 0:
              lines = content.split('\n')
              insert_idx = -1
              for i, line in enumerate(lines):
                  if 'img.shields.io/badge/' in line or '[![' in line:
                      insert_idx = i
              if insert_idx >= 0:
                  lines.insert(insert_idx + 1, '')
                  lines.insert(insert_idx + 2, badge_block)
                  new_content = '\n'.join(lines)
              else:
                  lines.insert(1, '')
                  lines.insert(2, badge_block)
                  new_content = '\n'.join(lines)
          with open('README.md', 'w') as f:
              f.write(new_content)
          print(f'Updated coverage badge: {coverage}% ({color})')
          "

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          # [skip ci] prevents the badge commit from re-triggering a full
          # push CI run (spec §4.1 — the amplifier loop).
          commit_message: "docs: update coverage badge [skip ci]"
          file_pattern: README.md

  # -------------------------------------------------------------------------
  # Frontend (< 3 min)
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend
    # Pinned to ubuntu-22.04 (not ubuntu-latest) for reproducible font
    # library versions (libpango/libcairo/libfreetype) — VRT screenshot
    # baselines are font-rendering-sensitive. ubuntu-latest silently
    # rotates OS versions and would drift baselines without warning.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [architecture, changes, nightly-gate]
    # Nightly path: frontend/workflow deltas or the weekly probe (§5.1).
    # PR path unchanged (frontend/workflows filter + draft guard); the
    # !cancelled() && !failure() prefix keeps the PR/dispatch paths
    # alive when nightly-gate skips.
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'schedule' &&
        needs.nightly-gate.outputs.should_run == 'true' &&
        (needs.nightly-gate.outputs.probe == 'true' ||
         needs.nightly-gate.outputs.frontend == 'true' ||
         needs.nightly-gate.outputs.workflows == 'true')) ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        (needs.changes.outputs.frontend == 'true' ||
         needs.changes.outputs.workflows == 'true') &&
        github.event.pull_request.draft != true))

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # check_frontend_file_size.py (+ its import scripts/architecture/
      # baselines.py) and check_test_performance.py are both confirmed
      # stdlib-only (json, dataclasses, pathlib, typing / argparse, os,
      # subprocess, time). No uv/venv needed anywhere in this job — GitHub's
      # ubuntu-latest runner ships Python 3.12+ already. This drops
      # setup-uv entirely, on top of the ~45s `uv sync --all-packages
      # --group dev` this job never actually needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Playwright Chromium cache (W3-1, spec §7) ─────────────────────
      # RESTORE early, gated SAVE after the install step — mirrors the
      # Pyright cache pattern (explicit writes, never implicit post-step
      # side effects). Key: the resolved @playwright/test version — the
      # most stable minimal key. @playwright/test, playwright and
      # playwright-core release in exact lockstep (pnpm-lock.yaml resolves
      # a single 1.63.0 across all three), and the pinned Chromium build
      # revision is a pure function of that version — so the key changes
      # ONLY when the browser itself changes. hashFiles('pnpm-lock.yaml')
      # would additionally bust on every unrelated frontend dep bump.
      # runner.os stays in the key: both Playwright jobs pin
      # ubuntu-22.04, but the runner image (not the pin) ships the OS
      # libraries the browser needs. npm gets its own key namespace — the
      # pip ecosystem in test-e2e resolves a DIFFERENT playwright version
      # (different Chromium revision), so the two never share an entry.
      - name: Resolve Playwright version (cache key)
        id: pw-version
        run: |
          cd packages/web
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium cache
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright/
          key: playwright-npm-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            playwright-npm-${{ runner.os }}-

      - name: Biome lint + format check
        run: cd packages/web && npx biome check .

      - name: i18n validation
        run: npx tsx scripts/validate-i18n.ts

      - name: Check frontend file sizes (RULE-04)
        run: python3 scripts/check_frontend_file_size.py

      - name: Type check
        run: cd packages/web && pnpm type-check

      - name: Test
        id: frontend-tests
        run: |
          start_time=$(date +%s)
          trap 'end_time=$(date +%s); echo "duration=$((end_time - start_time))" >> "$GITHUB_OUTPUT"' EXIT
          cd packages/web && pnpm test:coverage

      # NOTE: 307 test files, 2518 tests. Per-file overhead dominates
      # (~90% of time). Consolidating test files is the only path to <120s.
      # Threshold 240s. Re-measured snapshot 2026-07-09: 161.3s locally (307
      # files / 2518 tests), ~49% headroom under the 240s budget. CI runs on a
      # slower 4-core runner than local dev; the budget absorbs that variance.
      # Still WARNING-only — check_test_performance.py emits a ::warning::
      # annotation and always exits 0 (does not block CI).
      # Re-measure locally:
      #   uv run python scripts/check_test_performance.py --run --threshold 99999
      - name: Check frontend test performance
        if: always() && steps.frontend-tests.outcome != 'cancelled'
        run: |
          mkdir -p /tmp/warnings
          threshold=240
          duration=${{ steps.frontend-tests.outputs.duration }}
          if [ -z "$duration" ]; then
            echo "⚠️ Could not determine test duration (step may have been cancelled)"
            echo "⚠️ Frontend test duration unavailable (cancelled)" >> /tmp/warnings/report.txt
            exit 0
          fi
          # Capture output for the step log; only real ::warning:: lines go to
          # the warnings report (keeps the summary clean when under threshold).
          output=$(python3 scripts/check_test_performance.py \
            --duration "$duration" --threshold "$threshold" 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q "::warning::"; then
            printf '%s\n' "$output" >> /tmp/warnings/report.txt
          fi

      - name: Check component markers (data-testid)
        run: cd packages/web && npx tsx scripts/check-testid.ts --strict --fail --ratchet-baseline scripts/testid_baselines.json

      # ADR-059 Mock Contract (BINDING) — static check that every VRT spec
      # has the catch-all route, expect.poll guard, and timezoneId. Runs
      # BEFORE the expensive Playwright browser install + dev-server compile
      # so a contract violation fails in <1s instead of after minutes.
      - name: Check VRT mock contract (ADR-059 BINDING)
        run: cd packages/web && npx tsx scripts/check-vrt-mock-contract.ts

      - name: Install Playwright Chromium
        # Cache-aware (restore above): with a warm ~/.cache/ms-playwright
        # playwright validates the pinned Chromium revision's completion
        # marker and skips the download — a near-no-op on exact cache
        # hit. On a restore-keys fallback (older version) it downloads
        # only the missing revision.
        run: cd packages/web && pnpm playwright install chromium

      # WRITE gate (spec §7 trust boundary): schedule only — nightly/
      # probe nights are the only writers (this job does not run on
      # push, so unlike the Pyright cache there is no push-main writer).
      # PRs and dispatch are restore-only: PR-supplied code can never
      # poison a cache other runs consume. The cache-hit guard skips
      # futile re-saves of an already-existing immutable key.
      - name: Save Playwright Chromium cache
        if: github.event_name == 'schedule' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright/
          key: playwright-npm-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: VRT Screenshot Tests
        id: vrt-tests
        run: |
          start_time=$(date +%s)
          trap 'end_time=$(date +%s); echo "duration=$((end_time - start_time))" >> "$GITHUB_OUTPUT"' EXIT
          cd packages/web && pnpm playwright test --project=vrt

      # VRT is a hard gate: baselines are CI-native (ubuntu-22.04), regenerated
      # via .github/workflows/vrt-update-baselines.yml. Diffs are uploaded on
      # failure for diagnosis.
      - name: Upload VRT diffs
        if: failure() && steps.vrt-tests.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-test-results
          path: packages/web/test-results/
          retention-days: 7

      - name: Build
        run: cd packages/web && pnpm build

      # ── Standalone boot smoke (folded from frontend-standalone, W1-6) ──
      # test-e2e boots the standalone Next server but runs nightly + on
      # dispatch — the next@16.3.1/@swc/helpers standalone crash (fixed in
      # 5e014943) was invisible on PR CI. Steps lifted near-verbatim from
      # the removed frontend-standalone job (spec §5.6): the smoke reuses
      # this job's Build output and is not font-sensitive (server boot +
      # curl only), so colocating on ubuntu-22.04 costs nothing. It now
      # also runs on frontend-active nights and dispatch — harmless:
      # bounded by the poll loop below plus this job's timeout. Drafts
      # skip until marked ready (this job's draft guard; W1-5's
      # ready_for_review type makes the transition rerun).
      - name: Copy static + public into standalone tree
        run: |
          cp -r packages/web/.next/static packages/web/.next/standalone/packages/web/.next/static
          cp -r packages/web/public packages/web/.next/standalone/packages/web/public

      - name: Boot standalone server (smoke check)
        run: |
          # Use the standalone server instead of 'pnpm start' because Next.js
          # standalone mode is not compatible with 'next start' (mirrors test-e2e).
          AUTH_JWT_SECRET=test-secret-key-not-for-production \
          PORT=3000 node packages/web/.next/standalone/packages/web/server.js > /tmp/standalone-server.log 2>&1 &
          server_pid=$!
          # Always stop the server once the smoke check is done (success or fail).
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          echo "Waiting for standalone server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Standalone server is ready"
              break
            fi
            sleep 1
          done
          # Verify the server actually started
          if ! curl -sf http://localhost:3000 > /dev/null; then
            echo "ERROR: Standalone server failed to start. Logs:"
            cat /tmp/standalone-server.log || true
            exit 1
          fi

      - name: Upload warnings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warnings-frontend
          path: /tmp/warnings/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # E2E tests (nightly + manual dispatch + path-gated PRs, full stack)
  # -------------------------------------------------------------------------
  test-e2e:
    name: E2E Tests
    # Pinned to ubuntu-22.04 to match the frontend (VRT) job — both use
    # Playwright, keeping them on the same OS version avoids environment
    # divergence between the two browser-driven jobs.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # `architecture` replaces the dissolved quality edge (W1-4, §5.8) —
    # LOAD-BEARING: with `needs: [quality, …]` left in place this job
    # would silently skip on every PR/nightly run once quality became
    # push-only (spec §12 risk row "Missed needs rewires"). `changes`
    # feeds the PR branch's e2e_specs gate (W1-12, §5.10).
    needs: [architecture, changes, nightly-gate]
    # Full-stack E2E moved from every main-push to nightly + manual
    # dispatch (spec §3; was 192 min of the Sept 1-14 burn). Nightly
    # path: active nights only — `e2e` is backend ∨ frontend (full-stack),
    # plus the weekly probe (§5.1). Dispatch = full matrix (the gate
    # emits all-true). PR path (W1-12, §5.10): path-gated on tests/e2e/**
    # only, draft != true — the PO-sealed closure of the W0-3 cluster-A
    # blind spot (new E2E specs' first CI contact was the post-merge
    # nightly; PRs #253/#256). Accepted cost: +1 ~9-min run per
    # E2E-spec PR (~2-4/mo = +18..36 min/mo, §5.10/§9.1). The
    # !cancelled() && !failure() prefix keeps the PR/dispatch paths
    # alive when nightly-gate skips on other events (W1-2 pattern).
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'schedule' &&
        needs.nightly-gate.outputs.should_run == 'true' &&
        (needs.nightly-gate.outputs.probe == 'true' ||
         needs.nightly-gate.outputs.e2e == 'true')) ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.draft != true &&
        needs.changes.outputs.e2e_specs == 'true'))

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      TEST_DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-not-for-production
      ANTHROPIC_API_KEY: sk-test-dummy
      OPENAI_API_KEY: sk-test-dummy
      NARRARE_ENCRYPTION_KEY: WYcr1iULJse2Oo6GPpmw1Au4ovp_fXZwbrNF11C12ZQ=
      NARRARE_E2E_TEST: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Jobs below execute PR-supplied scripts — do not leave the
          # repo token persisted in the workspace (spec §5.4).
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          # World-drift pin — see architecture job (unpinned uv resolves the newest CPython; psycopg-binary wheel lag).
          python-version: "3.14"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Python dependencies
        run: uv sync --frozen --all-packages --group dev --extra nlp

      # ── spaCy model cache (W3-2, spec §7) ─────────────────────────────
      # Same contract as the test-integration cache: `just
      # install-nlp-models` wheels three de/en/fr_core_news_md-<SPACY_VER>
      # releases whose version derives from the INSTALLED spacy (not a
      # justfile literal — hashFiles('justfile') would never bust). Key
      # resolves the recipe's own derivation from the synced venv.
      # Restore lands the pure wheels inside .venv site-packages AFTER
      # `uv sync` (which prunes foreign packages), so `uv pip install`
      # short-circuits already-satisfied and skips the download.
      # Restore-only on PRs/dispatch; schedule writes (trust boundary).
      - name: Resolve spaCy model version (cache key)
        id: spacy-version
        run: echo "version=$(uv run python -c 'import spacy; print(spacy.__version__.rsplit(".", 1)[0] + ".0")')" >> "$GITHUB_OUTPUT"

      - name: Restore spaCy model cache
        id: spacy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .venv/lib/python3*/site-packages/de_core_news_md*/**
            .venv/lib/python3*/site-packages/en_core_web_md*/**
            .venv/lib/python3*/site-packages/fr_core_web_md*/**
          key: spacy-models-${{ runner.os }}-spacy${{ steps.spacy-version.outputs.version }}

      # ── Playwright Chromium cache (W3-1, spec §7) — pip twin ──────────
      # Same design as the frontend job's npm cache, but its own key
      # namespace: this job installs the browser via the PYTHON
      # playwright package (uv.lock — 1.61.0), which pins a DIFFERENT
      # Chromium revision than the npm @playwright/test 1.63.0 the
      # frontend resolves. Verified: the two package identities differ,
      # so per the W3-1 contract they get separate keys — a shared key
      # would leave exactly one job's revision present per save, and the
      # cache-hit guard would then block the other job's refresh.
      - name: Resolve Playwright version (cache key)
        id: pw-version
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium cache
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright/
          key: playwright-pip-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            playwright-pip-${{ runner.os }}-

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0" # pinned — zizmor unpinned-tools

      - name: Install spaCy NLP models
        run: just install-nlp-models

      # WRITE gate (spec §7 trust boundary): schedule only — nightly/
      # probe nights are the only writers (test-e2e does not run on
      # push). PRs/dispatch restore-only; cache-hit guard skips futile
      # re-saves. Same key namespace as test-integration's save: on a
      # shared night the second writer logs a benign "already exists"
      # warning; on later nights the exact hit makes the install step a
      # near-no-op for BOTH jobs.
      - name: Save spaCy model cache
        if: github.event_name == 'schedule' && steps.spacy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .venv/lib/python3*/site-packages/de_core_news_md*/**
            .venv/lib/python3*/site-packages/en_core_web_md*/**
            .venv/lib/python3*/site-packages/fr_core_web_md*/**
          key: spacy-models-${{ runner.os }}-spacy${{ steps.spacy-version.outputs.version }}

      - name: Install Playwright Chromium
        # Cache-aware (restore above): warm cache → pinned revision
        # validated, download skipped (near-no-op on exact hit; only the
        # missing revision downloads on a restore-keys fallback).
        run: uv run playwright install chromium

      # WRITE gate: schedule only (nightly/probe nights are the only
      # writers — test-e2e does not run on push). PRs/dispatch are
      # restore-only (spec §7 trust boundary); the cache-hit guard skips
      # futile re-saves of an existing immutable key.
      - name: Save Playwright Chromium cache
        if: github.event_name == 'schedule' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright/
          key: playwright-pip-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: cd apps/api && uv run alembic upgrade head

      - name: Seed dev user
        run: uv run python scripts/seed_dev_user.py

      # ── Export toolchain cache (W3-3, spec §7) — full variant ─────────
      # Same contract as test-integration's (`full` key with EPUBCheck;
      # script-hash key; skip-install-on-exact-hit; NARRARE_TOOLCHAIN_DIR
      # + PATH step for shutil.which() parity). Restore-only on PRs/
      # dispatch; schedule writes (trust boundary).
      - name: Restore export toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .toolchain/
          key: export-toolchain-full-${{ runner.os }}-${{ hashFiles('scripts/install_export_toolchain.sh') }}

      - name: Install export toolchain
        # Typst + pandoc so a real export E2E can run (ADR-081).
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          NARRARE_TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchain
        run: INSTALL_EPUBCHECK=1 bash scripts/install_export_toolchain.sh

      - name: Add export toolchain to PATH
        run: echo "${{ github.workspace }}/.toolchain/bin" >> "$GITHUB_PATH"

      # WRITE gate: schedule only (test-e2e does not run on push);
      # cache-hit guard skips futile re-saves of an existing key.
      - name: Save export toolchain cache
        if: github.event_name == 'schedule' && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .toolchain/
          key: export-toolchain-full-${{ runner.os }}-${{ hashFiles('scripts/install_export_toolchain.sh') }}

      - name: Build frontend
        run: cd packages/web && pnpm build

      - name: Start API server
        run: |
          cd apps/api && uv run uvicorn narrare._app.main:app \
            --host 0.0.0.0 --port 8000 > /tmp/api-server.log 2>&1 &
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API server is ready"
              break
            fi
            sleep 1
          done
          # Verify the server actually started
          if ! curl -sf http://localhost:8000/health > /dev/null; then
            echo "ERROR: API server failed to start. Logs:"
            cat /tmp/api-server.log || true
            exit 1
          fi

      - name: Start frontend server
        run: |
          # Use the standalone server instead of 'pnpm start' because Next.js standalone mode
          # is not compatible with 'next start'.
          # We need to copy static and public files into the standalone directory first.
          cp -r packages/web/.next/static packages/web/.next/standalone/packages/web/.next/static
          cp -r packages/web/public packages/web/.next/standalone/packages/web/public

          AUTH_JWT_SECRET=test-secret-key-not-for-production \
          PORT=3000 node packages/web/.next/standalone/packages/web/server.js > /tmp/frontend-server.log 2>&1 &
          echo "Waiting for frontend server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Frontend server is ready"
              break
            fi
            sleep 1
          done
          # Verify the server actually started
          if ! curl -sf http://localhost:3000 > /dev/null; then
            echo "ERROR: Frontend server failed to start. Logs:"
            cat /tmp/frontend-server.log || true
            exit 1
          fi

      - name: Run E2E tests
        timeout-minutes: 15
        run: uv run pytest tests/e2e/ -v -m e2e --timeout=300 --timeout-method=thread
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
          CI: "true"
          NARRARE_E2E_TEST: 1
          AUTH_JWT_SECRET: test-secret-key-not-for-production

      - name: Collect server logs on failure
        if: failure()
        run: |
          echo "=== API Server Logs ==="
          cat /tmp/api-server.log || echo "No API logs found"
          echo ""
          echo "=== Frontend Server Logs ==="
          cat /tmp/frontend-server.log || echo "No frontend logs found"

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # Warning summary — aggregates ::warning:: annotations across all jobs
  # -------------------------------------------------------------------------
  warnings-summary:
    if: >-
      always() && !cancelled() &&
      (needs.test-unit.result != 'skipped' ||
       needs.frontend.result != 'skipped')
    needs: [architecture, test-unit, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download warning artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: warnings-*
          merge-multiple: true

      - name: Build warning summary
        run: |
          # Show ⚠️ header only when there are real warnings; otherwise a clean
          # all-clear line so an all-green run no longer looks like a problem.
          if [ -f report.txt ] && [ -s report.txt ]; then
            echo "# ⚠️ CI Warning Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See individual job steps for full ::warning:: annotation details." \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No CI warnings across all jobs." >> $GITHUB_STEP_SUMMARY
          fi

  # -------------------------------------------------------------------------
  # Quota guardrail (spec §4.3): month-to-date Actions minutes vs the
  # 2000-min GitHub Free quota. Sums per-job wall time — billing counts
  # each job separately and rounds each job up to the minute, so this
  # stays ~1-3% low; treat 80% as "act now". Fetching one jobs page per
  # completed run takes a couple of minutes, hence timeout-minutes 10.
  # -------------------------------------------------------------------------
  budget-report:
    name: Quota Budget Report
    # Weekly only (W1-7, §5.7): the Sunday 03:07 schedule entry — the exact
    # string is the 02:37-vs-03:07 discriminator; the nightly no longer
    # runs this job. Quota-overrun warning latency 1d → 7d (accepted, §8).
    if: >-
      github.event_name == 'schedule' &&
      github.event.schedule == '7 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Sum month-to-date workflow minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          quota = 2000
          warn_at = 0.80
          first = datetime.now(timezone.utc).strftime("%Y-%m-01T00:00:00Z")
          runs_cap = 500  # bound jobs API calls (~1 request per run)

          def fetch(url):
              # At this request volume (~1 per run) transient 5xx/429s do
              # happen; retry with backoff so the guardrail never dies on one.
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={
                          "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                          "Accept": "application/vnd.github+json"})
                      with urllib.request.urlopen(req) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if attempt == 3 or e.code not in (429, 500, 502, 503, 504):
                          raise
                      time.sleep(2 * (attempt + 1))

          def job_minutes(started, completed):
              s = datetime.fromisoformat(started.replace("Z", "+00:00"))
              c = datetime.fromisoformat(completed.replace("Z", "+00:00"))
              return (c - s).total_seconds() / 60

          repo = os.environ["REPO"]
          total = 0.0
          processed = 0
          suspect = 0  # runs whose jobs data looks empty vs their own wall time
          for page in range(1, 11):  # 10 x 100 runs/month is ample
              data = fetch(f"https://api.github.com/repos/{repo}/actions/runs"
                           f"?per_page=100&page={page}&created=>={first}")
              runs = data.get("workflow_runs", [])
              for run in runs:
                  if run["event"] == "dynamic":   # Dependabot runs are free
                      continue
                  if run.get("status") != "completed":
                      continue
                  if processed >= runs_cap:
                      break
                  processed += 1
                  # Billing counts each job separately: sum per-job wall
                  # time. per_page=100 covers this repo's ~13-job runs.
                  jobs = fetch(f"https://api.github.com/repos/{repo}/actions"
                               f"/runs/{run['id']}/jobs?per_page=100")
                  run_sum = 0.0
                  for job in jobs.get("jobs", []):
                      # Skipped jobs carry bogus timestamps (observed:
                      # completed before started) and are not billed —
                      # exclude by conclusion; clamp residual negatives.
                      started, completed = job.get("started_at"), job.get("completed_at")
                      if (started and completed
                              and job.get("status") == "completed"
                              and job.get("conclusion") != "skipped"):
                          run_sum += max(job_minutes(started, completed), 0.0)
                  total += run_sum
                  # Degraded-API guard: a completed run with minutes of wall
                  # time but almost no job minutes signals missing jobs data
                  # (observed live alongside 502s) — flag it instead of
                  # silently undercounting.
                  wall = 0.0
                  if run.get("run_started_at") and run.get("updated_at"):
                      wall = job_minutes(run["run_started_at"], run["updated_at"])
                  if wall >= 2.0 and run_sum < wall * 0.1:
                      suspect += 1
              if len(runs) < 100 or data.get("incomplete_results") or processed >= runs_cap:
                  break
          pct = total / quota
          summary = (f"Month-to-date CI usage: {total:.0f} min of {quota} "
                     f"({pct:.0%}, per-job sum; billing rounds each job up to the minute).")
          if suspect:
              summary += (f" WARNING: jobs data missing for {suspect} of "
                          f"{processed} run(s) — figure may undercount.")
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(summary + "\n")
          if suspect:
              print(f"::warning title=Actions quota::Jobs data missing for "
                    f"{suspect} run(s) — this figure may undercount.")
          if pct >= warn_at:
              print(f"::warning title=Actions quota::Quota at {pct:.0%} — "
                    "activate reserve levers (spec §8: Phase 2 consolidation, "
                    "weekly nightly).")
          EOF

  # -------------------------------------------------------------------------
  # Release-PR orchestration (W2-1, spec §6.1): creates/updates the
  # release-please pull request on code nights. This is ONE HALF of the
  # release-please split: this job runs with `skip-github-release: true`
  # (release-PR bookkeeping only), while release-please.yml keeps release
  # creation + publishing on push with `skip-github-pull-request: true`
  # (W2-2). Release creation is decided by manifest-version-vs-latest-tag,
  # so the two invocations are cleanly disjoint. Until W2-2 narrows the
  # push trigger, BOTH paths run (double coverage by design, spec §11).
  # Release-PR latency: ≤1 day (PO-sealed, OQ2 — spec §14).
  #
  # Split semantics (W2-3, spec §6): release creation is decided by
  # manifest-version-vs-latest-tag, so the two invocations are cleanly
  # disjoint — this job only creates/updates the release PR
  # (skip-github-release: true), release-please.yml (push-side, W2-2)
  # only tags + publishes (skip-github-pull-request: true) when the
  # release PR merges — a HUMAN merge, which triggers workflows normally
  # (the GITHUB_TOKEN no-retrigger restriction applies only to
  # token-authored commits). A run with nothing to release is an
  # idempotent no-op (~1.7 min). Settings note (PO one-time manual
  # action, NOT a task): bot-authored workflow runs on private repos
  # park at `action_required` — approve the github-actions[bot] runs /
  # unstick release PR #231 once.
  # -------------------------------------------------------------------------
  release-orchestration:
    name: Release PR Orchestration
    # Schedule + code-day only: PR/push/dispatch runs skip the job, so the
    # job-level write token below is never held outside the nightly path.
    # Budget nights (03:07 Sundays) skip too: nightly-gate skips there, its
    # outputs stay empty, and `should_run == 'true'` is false. A skipped
    # nightly-gate (or a failed nightly) also skips this job by default
    # success() semantics — release-PR latency degrades to the failure
    # duration (accepted, spec §12).
    needs: [nightly-gate]
    if: >-
      github.event_name == 'schedule' &&
      needs.nightly-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level escalation (spec §12): release-please must open/update PRs.
    # NEVER widen the workflow-level permissions for this.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No git commands follow: the action drives everything through
          # its own `token:` input (same usage as release-please.yml).
          persist-credentials: false

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        # Same inputs as release-please.yml's step, PLUS the W2-1 half of
        # the split: never create/tag the release here (that happens on
        # the release-PR merge, in release-please.yml, same day).
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: python
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
