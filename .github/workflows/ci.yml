name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly: every capability, every suite — but only when main moved since
    # the last successful nightly (the guard job decides). 03:17 UTC.
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One cheap job every other job waits for. On a nightly it answers the
  # only question that matters first: is main still where the last
  # successful nightly left it? Then nothing below runs, because the same
  # commit has already been tested — no runner minutes, no credits, and
  # every job below reports skipped. On PRs and pushes it always proceeds.
  nightly-guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # gh api prefixes nothing: a relative path without repos/<owner>/<repo>
          # resolves to api.github.com/actions/... and answers 404.
          last=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          echo "last successful nightly tested: ${last:-none}"
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly skipped: main is unchanged since the last successful nightly."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  lint-types:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks scans the push range base^..head, which needs
      # the base commit that a shallow (depth-1) checkout does not have.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync
      - run: pnpm install --frozen-lockfile
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: just lint
      - run: just typecheck
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Which E2E suites a change owes: the capabilities it touches, or all of
  # them when a shared surface moved (spec §6 "affected capabilities"; the
  # shared surfaces are kernel, api, the generated views, web, i18n and the
  # tooling). Pushes and nightly runs take everything.
  changes:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: suites
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "suites=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          changed=$(git diff --name-only origin/main...HEAD)
          echo "$changed"
          # A release PR moves version strings and the changelog; no browser
          # runs any of them. release-please force-pushes this branch on every
          # push to main, so the suites here cost minutes per release and get
          # cancelled mid-flight by the next update. Both conditions are needed:
          # the branch name alone or the file list alone could catch a real PR.
          # A skipped job still satisfies the required check.
          if [ "$GITHUB_HEAD_REF" = "release-please--branches--main--components--narrare" ] \
            && ! echo "$changed" | grep -qvE '^(\.release-please-manifest\.json|CHANGELOG\.md|app/kernel/version\.py|package\.json|web/package\.json|pyproject\.toml|web/lib/api/openapi\.json)$'; then
            echo "suites=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -qE '^(app/(kernel|api|generated)/|web/|i18n/|justfile|pyproject\.toml|uv\.lock|pnpm-lock\.yaml|\.github/workflows/ci\.yml)'; then
            echo "suites=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          capabilities=$(echo "$changed" | grep -oP '^app/capabilities/\K[^/]+' | sort -u)
          if [ -z "$capabilities" ]; then
            echo "suites=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          suites=""
          for name in $capabilities; do suites="$suites app/capabilities/$name/e2e/"; done
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  tests:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U narrare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv sync
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: just test

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-types, changes]
    if: needs.changes.outputs.suites != 'none'
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U narrare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - run: pnpm install --frozen-lockfile
      # The same invocation `just test-e2e` makes; the suites come from the
      # changes job, so a PR pays for what it touches.
      - name: E2E
        run: |
          suites="${{ needs.changes.outputs.suites }}"
          [ "$suites" = all ] && suites="app/capabilities/*/e2e/"
          uv run pytest $suites -v -m e2e --timeout=60

  build:
    needs: nightly-guard
    if: needs.nightly-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: just build

  coverage:
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U narrare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run pytest app --cov --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
