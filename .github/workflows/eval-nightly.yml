name: Eval Nightly (Runtime)

# ---------------------------------------------------------------------------
# Nightly runtime eval suites + drift baseline check.
#
# Per ADR-032 (Pydantic Evals SSOT) and the eval-expansion plan §CI
# Integration Strategy:
#   - Smoke runs in ci.yml (architecture job) — CI-blocking, secret-free.
#   - Runtime runs here, nightly, with NARRARE_EVAL_API_KEY.
#   - P0 drift (defined in evals/p0_priorities.json) is CI-blocking — a
#     regression of a P0 anchor (e.g. the writing_prose guardrail case)
#     fails the nightly. Non-P0 drift remains WARNING-only.
#
# This workflow is intentionally NOT triggered on push / pull_request.
# It runs on a cron schedule and on manual dispatch only. Tier 2/3 suites
# (analysis_metrics, kb_operations, planning_structure) are smoke-only by
# plan; the runner skips them gracefully when invoked with
# `--suite all --mode runtime`.
#
# COST NOTE (2026-07): cadence reduced from daily to Mon/Thu to cut a
# fixed, commit-independent drain on the monthly CI-minutes budget
# (timeout-minutes: 30 × 365 days was ~180+ min/month regardless of repo
# activity). Runtime evals still aren't PR-blocking, so this only affects
# how quickly non-urgent drift surfaces — P0 anchors remain blocking on
# whichever run they land in.
# ---------------------------------------------------------------------------

on:
  schedule:
    # 03:00 UTC, Mon + Thu — reduced from daily as a CI-minutes budget
    # measure (see cost note below). Revert to "0 3 * * *" once minutes
    # budget allows; P0 drift detection just runs at lower cadence in the
    # meantime, not weaker — a regression is still caught within days.
    - cron: "0 3 * * 1,4"
  workflow_dispatch: {} # manual trigger for on-demand runtime runs

permissions:
  contents: read

concurrency:
  group: eval-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-eval:
    name: Runtime Eval Suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Provider/model are configurable via repository variables so the
      # nightly can be retargeted (e.g. to a cheaper model) without a
      # workflow edit. API key is always a secret.
      NARRARE_EVAL_PROVIDER: ${{ vars.NARRARE_EVAL_PROVIDER || 'openai' }}
      NARRARE_EVAL_MODEL: ${{ vars.NARRARE_EVAL_MODEL || 'gpt-5-mini' }}
      NARRARE_EVAL_API_KEY: ${{ secrets.NARRARE_EVAL_API_KEY }}
      NARRARE_EVAL_BASE_URL: ${{ vars.NARRARE_EVAL_BASE_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev

      # If the API key isn't configured the runtime evals can't run, but
      # we skip gracefully instead of failing — the key may be absent in
      # forks or when the workflow is run from a branch that doesn't have
      # the secret. Smoke evals in ci.yml cover the deterministic paths.
      - name: Verify runtime API key is present
        id: verify
        env:
          NARRARE_EVAL_API_KEY: ${{ secrets.NARRARE_EVAL_API_KEY }}
        run: |
          if [ -z "$NARRARE_EVAL_API_KEY" ]; then
            echo "::warning::NARRARE_EVAL_API_KEY secret is not set. Runtime evals will be skipped. To run, add the secret to repository settings."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "NARRARE_EVAL_API_KEY is present (length: ${#NARRARE_EVAL_API_KEY})."
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Run runtime eval suites
        if: steps.verify.outputs.skipped != 'true'
        env:
          NARRARE_EVAL_API_KEY: ${{ secrets.NARRARE_EVAL_API_KEY }}
        run: |
          uv run python -m evals run \
            --suite all \
            --mode runtime \
            --results-dir evals/results

      # P0 drift is CI-blocking: a regression of a P0 anchor case (declared in
      # evals/p0_priorities.json, decoupled from the auto-regenerated
      # baselines) fails the nightly. Non-P0 drift is reported as a WARNING
      # but does not affect the exit code. Update baselines deliberately with
      # `--update-baselines` in a follow-up.
      - name: Check eval drift (P0-blocking)
        if: steps.verify.outputs.skipped != 'true'
        run: |
          uv run python scripts/check_eval_drift.py \
            --results-dir evals/results \
            --priorities evals/p0_priorities.json \
            --fail-on-priority P0

      # Upload results when evals actually ran, even if a step failed, so
      # regressions can be inspected (e.g. new failures that haven't yet
      # been baselined).
      - name: Upload eval results
        if: always() && steps.verify.outputs.skipped != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-results-${{ github.run_id }}
          path: evals/results/*.json
          retention-days: 30
