name: LLM Prompt Evaluation

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Test case filter (e.g., writing-generation, name-generation)"
        required: false
        default: ""
  schedule:
    # Nightly at 3 AM UTC — only runs if eval test cases exist
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install promptfoo
        run: npm install -g promptfoo

      - name: Run evaluations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.test_filter }}" ]; then
            TEST_NAME="${{ github.event.inputs.test_filter }}"
            promptfoo eval -c "evals/testcases/${TEST_NAME}.yaml" \
              --output "evals/results/${TEST_NAME}.json" || true
          else
            for f in evals/testcases/*.yaml; do
              echo "=== Running: $f ==="
              TEST_NAME="$(basename "$f" .yaml)"
              promptfoo eval -c "$f" \
                --output "evals/results/${TEST_NAME}.json" || true
            done
          fi

      - name: Check eval drift against baselines
        if: always()
        run: |
          python scripts/check_eval_drift.py \
            --results-dir evals/results \
            --baselines-dir evals/baselines \
            --threshold 0.05

      - name: Update baselines (manual trigger only)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          python scripts/check_eval_drift.py --update-baselines

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/
          retention-days: 30
