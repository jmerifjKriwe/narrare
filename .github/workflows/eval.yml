name: AI Evaluation

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Suite filter (kb_extraction, rewrite_selection, preference_analysis)"
        required: false
        default: ""
  schedule:
    # Nightly at 3 AM UTC on main.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev --extra nlp

      - name: Install spaCy NLP models
        run: just install-nlp-models

      - name: Run evaluations
        run: |
          if [ -n "${{ github.event.inputs.test_filter }}" ]; then
            uv run python -m evals run \
              --suite "${{ github.event.inputs.test_filter }}" \
              --mode smoke \
              --results-dir evals/results
          else
            uv run python -m evals run \
              --suite all \
              --mode smoke \
              --results-dir evals/results
          fi

      - name: Check eval drift against baselines
        if: always()
        run: |
          uv run python scripts/check_eval_drift.py \
            --results-dir evals/results \
            --baselines-dir evals/baselines \
            --threshold 0.05

      - name: Update baselines (manual trigger only)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          uv run python scripts/check_eval_drift.py --update-baselines

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/
          retention-days: 30
