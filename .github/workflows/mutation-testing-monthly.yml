name: Mutation Testing (Monthly)

on:
  schedule:
    - cron: '0 6 1 * *'   # 1. jedes Monats, 06:00 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: 'Module scope to mutate'
        default: 'core'
        type: choice
        options:
          - core
          - api
          - all

permissions:
  contents: read
  issues: write

jobs:
  mutmut:
    name: MutMut Mutation Score
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      TEST_DATABASE_URL: postgresql+asyncpg://narrare:narrare@localhost:5432/narrare_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-not-for-production
      ANTHROPIC_API_KEY: sk-test-dummy
      OPENAI_API_KEY: sk-test-dummy

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Run migrations
        run: cd apps/api && uv run alembic upgrade head

      - name: Determine scope label
        id: scope
        run: |
          SCOPE="${{ inputs.scope || 'core' }}"
          case "$SCOPE" in
            core) LABEL="core (prompts, writing, intents)" ;;
            api)  LABEL="api (all backend modules)" ;;
            all)  LABEL="all (core + api)" ;;
            *)    LABEL="$SCOPE" ;;
          esac
          echo "label=$LABEL" >> $GITHUB_OUTPUT

      - name: Run MutMut
        id: mutmut
        continue-on-error: true
        run: |
          SCOPE="${{ inputs.scope || 'core' }}"
          uv run python scripts/run_mutmut.py --scope "$SCOPE" 2>&1 | tee mutmut-output.txt

      - name: Generate report
        if: always()
        run: |
          echo "## MutMut Mutation Testing Report" > mutation-report.md
          echo "" >> mutation-report.md
          echo "**Scope:** ${{ steps.scope.outputs.label }}" >> mutation-report.md
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> mutation-report.md
          echo "" >> mutation-report.md

          # MutMut 3.x CI/CD stats (JSON, designed for CI consumption)
          echo "### CI/CD Stats" >> mutation-report.md
          echo '```json' >> mutation-report.md
          uv run mutmut export-cicd-stats 2>/dev/null >> mutation-report.md || true
          echo '```' >> mutation-report.md
          echo "" >> mutation-report.md

          # Survived / timed-out mutants
          echo "### Mutant Results" >> mutation-report.md
          echo '```' >> mutation-report.md
          uv run mutmut results 2>/dev/null | head -100 >> mutation-report.md || true
          echo '```' >> mutation-report.md
          echo "" >> mutation-report.md

          # Raw run output (always included for debugging)
          echo "### Raw Output (last 50 lines)" >> mutation-report.md
          echo '```' >> mutation-report.md
          tail -50 mutmut-output.txt >> mutation-report.md
          echo '```' >> mutation-report.md

      - name: Create Issue
        if: always() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('mutation-report.md', 'utf8');

            // Find existing open issue for mutation testing
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['mutation-testing'],
            });

            const title = `Mutation Testing Report (${new Date().toISOString().slice(0, 7)})`;

            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                title: title,
                body: body,
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['mutation-testing'],
              });
            }

      - name: Report summary
        if: always()
        run: |
          echo "### Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat mutation-report.md >> $GITHUB_STEP_SUMMARY
