# Monthly mutation-testing sweep over the kernel and service layer.
# Advisory only: it names no context in `ci-required`, so a surviving mutant
# is a finding to triage, never a blocked merge. Mutation testing finds weak
# tests that coverage alone cannot (a test that never fails is a test that
# never bites).
name: Mutation

on:
  schedule:
    - cron: "17 4 1 * *"  # first Sunday-ish slot, monthly
  workflow_dispatch:

permissions: {}

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          node: "false"
      - name: Run mutation testing (advisory)
        run: |
          set -euo pipefail
          uv run --with mutmut mutmut run --paths-to-mutate app/kernel --tests-dir app/kernel/tests || true
          uv run --with mutmut mutmut results
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: .mutmut-cache
          if-no-files-found: ignore
