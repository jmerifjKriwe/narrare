name: Nightly

# The nightly is its own workflow, not a schedule branch of the PR gate: its
# trigger surface (schedule + manual dispatch) and its question (did main
# move since the last successful nightly?) are not the pull request's, and
# it reports through the `ci/nightly` issue, not through required checks.

on:
  schedule:
    # Nightly: every capability, every suite — but only when main moved since
    # the last successful nightly (the gate job decides). 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
    # Manual dispatch never skips: whoever runs it asked for a sweep.

# A nightly must not cancel the previous one: the gate reads the last
# successful scheduled run, so the one run this workflow depends on is the
# one still in flight. Queued sequentially, never dropped.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

# Actions are pinned by commit SHA and name their release in a trailing comment;
# release-please.yml, which carries write tokens, has always done it this way.
# A major tag is a mutable ref: its owners can move `v7` to any commit, and that
# commit then runs with this workflow's token — no diff here, no review.
# Dependabot's weekly `github-actions` update keeps the pins current.
#
# The pin also fixes the runtime: every action below runs on Node 24, so no
# action is forced onto a runtime its own CI never tested.

jobs:
  # One cheap job every other job waits for. On a schedule it answers the
  # only question that matters first: is main still where the last
  # successful nightly left it? Then nothing below runs, because the same
  # commit has already been tested — no runner minutes, no credits, and
  # every job below reports skipped. On a manual dispatch it always
  # proceeds, because whoever dispatched asked for a sweep. On the way out
  # it resolves the full suite list once, for the e2e matrix to fan out
  # over.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      capabilities: ${{ steps.capabilities.outputs.capabilities }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # gh api prefixes nothing: a relative path without repos/<owner>/<repo>
          # resolves to api.github.com/actions/... and answers 404.
          last=$(gh api "repos/$GH_REPO/actions/workflows/nightly.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          echo "last successful nightly tested: ${last:-none}"
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly skipped: main is unchanged since the last successful nightly."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Same gate as the resolver step: a night that owes nothing owes no
        # checkout either, so a checkout failure on such a night cannot redden
        # the gate and open an issue over main unchanged.
        if: steps.guard.outputs.proceed == 'true'
        with:
          # Nothing below pushes; the token has no work to persist.
          persist-credentials: false
      # The resolver is stdlib only, so the runner's python3 before any uv
      # sync. A nightly has no range to read: --all names every suite, and
      # the matrix below is derived, never a static list.
      - id: capabilities
        if: steps.guard.outputs.proceed == 'true'
        run: |
          capabilities=$(python3 scripts/affected.py --all --json)
          echo "::notice::the nightly owes: $capabilities"
          echo "capabilities=$capabilities" >> "$GITHUB_OUTPUT"

  # The lockfile audit: every dependency `uv.lock` and `pnpm-lock.yaml`
  # carry, runtime and dev. The shipped runtime does not carry pytest and
  # friends, but a CVE published against a dev dependency after merge has no
  # PR to ride in on either — and that is the only case this sweep exists
  # for. One export, one audit; the package name in the report says which
  # side a finding is on. It reddens the nightly but blocks nothing on the
  # PR path.
  audit:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing below pushes; the token has no work to persist.
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] — actionlint 1.7.12 rejects `$/`
      - name: Export locked requirements
        # --locked: judge the committed lockfile, not a fresh resolution.
        run: uv export --locked --format requirements-txt --output-file /tmp/requirements.txt
      - name: pip-audit
        # --strict: a dependency pip-audit cannot collect must not exit 0.
        run: uvx pip-audit==2.10.1 --strict -r /tmp/requirements.txt
      - name: pnpm audit
        # No --prod: the dev tree is part of the lock a developer installs,
        # and an advisory against one of its packages is still news.
        run: pnpm audit --audit-level high

  # Lint, typecheck, generated-file freshness and secrets scan — one definition
  # for every workflow: `_lint.yml`. Same job name as ci.yml's caller, same
  # inputs.
  #
  # `./`, not `$/`: same trade as ci.yml's comment — the pinned actionlint
  # image (1.7.12) does not know the self-repository syntax zizmor prefers.
  # Flip to `$/` when the actionlint pin is bumped past the version that
  # understands `$/`, or when `sha_pinning_required` rejects the `./`
  # reference.
  lint-types:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    uses: ./.github/workflows/_lint.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      python-version: "3.14"
      node-version: "22"
      pnpm-version: "11.5.2"
      just-version: "1.58.0"

  # The Python suite — one definition for every workflow: `_test.yml`.
  # Same job name as ci.yml's caller, so `nightly-result` still names
  # `tests`. Plain suite, no coverage: coverage is a main-push concern —
  # the Codecov dashboard keys on those runs — so the nightly reports
  # through its `ci/nightly` issue instead and never instruments here.
  #
  # `./`, not `$/`: same trade as `_lint.yml`'s comment — the pinned
  # actionlint image (1.7.12) does not know the self-repository syntax
  # zizmor prefers. Flip to `$/` when the actionlint pin is bumped past
  # the version that understands `$/`, or when `sha_pinning_required`
  # rejects the `./` reference.
  tests:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    uses: ./.github/workflows/_test.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      coverage: false

  # The web unit suite lived only in the pre-commit hook: a fresh clone has
  # that hook, a drive-by contributor does not, so their frontend could reach
  # `main` with `vitest` red. It runs here as it does in ci.yml, unfiltered.
  frontend:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing below pushes; the token has no work to persist.
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] — actionlint 1.7.12 rejects `$/`
        with:
          python: "false"
      - run: just test-frontend

  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing below pushes; the token has no work to persist.
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] — actionlint 1.7.12 rejects `$/`
        with:
          python: "false"
      - run: just build

  # The suites the gate resolved, one runner per capability, side by side —
  # writing is the slowest and becomes the wall clock. `fail-fast: false`:
  # a red writing suite must not hide whether knowledge is red too. A
  # nightly owes every suite, and the gate's --all resolution decides what
  # those are — no name is ever expanded into a path by string surgery on
  # the JSON list. One definition for every workflow: `_e2e.yml` — same job
  # name, so `nightly-result` still names `e2e-suites`.
  #
  # `./`, not `$/`: same trade as `_lint.yml`'s comment — the pinned
  # actionlint image (1.7.12) does not know the self-repository syntax
  # zizmor prefers. Flip to `$/` when the actionlint pin is bumped past
  # the version that understands `$/`, or when `sha_pinning_required`
  # rejects the `./` reference.
  e2e-suites:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        capability: ${{ fromJSON(needs.gate.outputs.capabilities) }}
    uses: ./.github/workflows/_e2e.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      capability: ${{ matrix.capability }}

  # A red nightly must not be discoverable only by scrolling through
  # Actions: one open issue labeled `ci/nightly` carries the failed run and
  # the jobs that did not reach green, gains a comment for each further
  # failure while it stays red, and is closed the morning a nightly goes
  # green again. A gate
  # that failed outright is also red news and reports here; the
  # unchanged-main skip is not (`proceed` empty or 'false' — nothing
  # below the gate ran, so there is nothing to report). A manual dispatch
  # reports to no one but its own run log; it never touches the issue.
  nightly-result:
    needs: [gate, audit, lint-types, tests, frontend, build, e2e-suites]
    if: always() && github.event_name == 'schedule' && (needs.gate.result != 'success' || needs.gate.outputs.proceed == 'true')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    timeout-minutes: 5
    steps:
      - name: Open, update or close the ci/nightly issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_RESULT: ${{ needs.gate.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          LINT_TYPES_RESULT: ${{ needs.lint-types.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_SUITES_RESULT: ${{ needs.e2e-suites.result }}
        run: |
          failed=""
          note() {
            # The new `if` can pass a failed gate through, too; whatever did
            # not end success — failed, cancelled or skipped — is red news.
            if [ "$2" != success ]; then
              failed="${failed:+$failed, }$1 ($2)"
            fi
          }
          note "gate" "$GATE_RESULT"
          note "audit" "$AUDIT_RESULT"
          note "lint-types" "$LINT_TYPES_RESULT"
          note "tests" "$TESTS_RESULT"
          note "frontend" "$FRONTEND_RESULT"
          note "build" "$BUILD_RESULT"
          note "e2e-suites" "$E2E_SUITES_RESULT"
          # `gh issue create --label` fails when the label does not exist, so
          # check for `ci/nightly` first and create it only when a real
          # failure to look up must not be missed — no swallowed errors.
          gh label list --search ci/nightly --json name --jq '.[].name' | grep -qx ci/nightly || gh label create ci/nightly --description "A nightly run failed" --color D93F0B
          existing=$(gh issue list --label ci/nightly --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$failed" ]; then
            body=$(printf 'Nightly not green: %s\n\nNot green jobs: %s\n' "$RUN_URL" "$failed")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --label ci/nightly --title "Nightly failed" --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Nightly green: $RUN_URL"
          else
            echo "::notice::Nightly green; no open ci/nightly issue to close."
          fi
