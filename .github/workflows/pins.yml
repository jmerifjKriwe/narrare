name: Tool pins

# The CI pins Dependabot cannot follow — actionlint's image digest and the
# version its comment names, zizmor's `version:` input, the Codecov CLI,
# pip-audit, and the Postgres image digest — checked monthly against their
# upstream releases. Advisory: it opens or updates one issue labelled
# `ci/tool-pins` and blocks no merge.
#
# The pins are read from the files that carry them (`scripts/check_pins.py`),
# never copied here, so a bump needs no second edit. A pin the script cannot
# read, or an upstream it cannot reach, reddens the run: the check must not be
# able to say "current" when it could not ask.

on:
  schedule:
    # Monthly, the 1st at 08:23 UTC — off the nightly's 03:17 and Scorecard's
    # Sunday 07:11 slots.
    - cron: "23 8 1 * *"
  workflow_dispatch:
    # Manual dispatch never skips: whoever runs it asked for the check.

permissions: {}

concurrency:
  group: tool-pins
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout of the files that carry the pins
      issues: write # one issue is the report
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing below pushes; the token has no work to persist.
          persist-credentials: false
      # The runner's python3, no uv sync: the script is stdlib only, like
      # scripts/affected.py, and this job should stay cheap.
      - name: Read the pins and ask their upstreams
        run: |
          set -euo pipefail
          python3 scripts/check_pins.py --json > /tmp/pins.json
          jq -r .report /tmp/pins.json
      # One issue carries the answer: opened on the first behind pin, a comment
      # per further run while it stays behind, closed the month everything is
      # current. A failed check never reaches this step (the one above failed),
      # so it cannot close an issue it did not read.
      - name: Open, update or close the ci/tool-pins issue
        run: |
          set -euo pipefail
          behind=$(jq -r '.behind | length' /tmp/pins.json)
          report=$(jq -r .report /tmp/pins.json)
          run_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          # `gh issue create --label` fails when the label does not exist, so
          # check for it first, exactly as nightly-result does.
          gh label list --search ci/tool-pins --json name --jq '.[].name' | grep -qx ci/tool-pins \
            || gh label create ci/tool-pins --description "A CI tool pin is behind its upstream" --color D93F0B
          existing=$(gh issue list --label ci/tool-pins --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ "$behind" != "0" ]; then
            body=$(printf '%s\n\nRun: %s\n' "$report" "$run_url")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --label ci/tool-pins --title "CI tool pins are behind" --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All pins current: $run_url"
          else
            echo "::notice::All pins current; no open ci/tool-pins issue."
          fi
