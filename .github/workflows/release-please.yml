name: Release Please

# One invocation, on every push to main: it maintains the release PR and, when
# that PR is merged, tags the release and writes the GitHub Release.
#
# The push trigger is deliberately unfiltered. A `paths` filter on the manifest
# waits for a file only this workflow writes: with PR creation off - the split
# this file carried until 2026-10-25 - nothing ever bumped the manifest, so the
# workflow could not run at all and had been silent since 2026-10-17. A filter
# is unreliable on big pushes as well: GitHub skips a path-filtered run when the
# diff holds more than 3,000 files and the matches fall outside the first 3,000
# it lists, which is what the 5,937-file v2 rewrite did on 2026-10-22.
#
# The release PR carries every version copy, because the version is one fact and
# release-please is its only writer: `pyproject.toml` and `app/kernel/version.py`
# (the python strategy updates both), plus the four `extra-files` entries in
# release-please-config.json: `package.json`, `web/package.json`,
# `web/lib/api/openapi.json` and `uv.lock`. `web/lib/api/openapi.json` is
# included on purpose - its `info.version` comes from the app, so leaving it out
# would let it fall one release behind and turn
# `test_committed_openapi_document_matches_the_app` red on main.
#
# The token is a GitHub App installation token, not `secrets.GITHUB_TOKEN`, for
# two reasons. Resources created with `GITHUB_TOKEN` trigger no workflow runs, so
# the release PR would show none of the four required status checks and could
# only be merged with an admin bypass. And this repository keeps "Allow GitHub
# Actions to create and approve pull requests" off, so automation can never
# satisfy the required approval itself: the App authors the PR, a human approves.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # API-bound release-PR orchestration, no builds — cap the default 360-min hang risk (spec §4.2).
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Least privilege lives in the App definition (contents, pull requests,
      # issues: read & write) and the token is scoped to this repository and to
      # the same three permissions at the call site.
      - name: Mint the release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          # Manifest mode: the release type lives in the config file, and the
          # action rejects it as an input here.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
