name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # API-bound release-PR orchestration, no builds — cap the default 360-min hang risk (spec §4.2).
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: python
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    # Docker build + GHCR push + SBOM can legitimately run long — bounded, not unbounded (spec §4.2).
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Push-to-main trusted trigger; no git commands follow (image
          # push and release upload carry their own tokens), so don't
          # persist the repo token in the workspace.
          persist-credentials: false

      # ── Setup ────────────────────────────────────────────────────
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          # World-drift pin — see ci.yml architecture job (unpinned uv resolves the newest CPython; psycopg-binary wheel lag).
          python-version: "3.14"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: echo "VERSION=${{ needs.release-please.outputs.tag_name }}" >> $GITHUB_OUTPUT

      - name: Set canonical image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/${owner}/narrare" >> "$GITHUB_OUTPUT"

      # ── Docker Build + Push to GHCR ──────────────────────────────
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}
            ${{ steps.image.outputs.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── SBOM Generation ──────────────────────────────────────────
      - name: Generate Python dependency list
        run: |
          mkdir -p /tmp/bundle
          uv export --format requirements-txt --no-dev --output-file /tmp/bundle/requirements.txt

      - name: Generate Docker image SBOM (best-effort)
        continue-on-error: true
        run: |
          IMAGE="${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}"
          echo "Generating SBOM for $IMAGE"
          mkdir -p /tmp/bundle

          # Try docker sbom first (Docker SBOM CLI plugin)
          if docker sbom --help &>/dev/null; then
            echo "Using docker sbom..."
            docker sbom "$IMAGE" \
              --format cyclonedx-json \
              --output /tmp/bundle/sbom.cyclonedx.json
          else
            # Fall back to Syft (Anchore)
            echo "docker sbom not available, installing Syft..."
            # Pull the just-pushed image for local scanning
            docker pull "$IMAGE" 2>/dev/null || {
              echo "⚠ docker pull failed, SBOM generation skipped"
              exit 0
            }
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
              | sh -s -- -b /usr/local/bin 2>/dev/null
            syft "$IMAGE" -o cyclonedx-json > /tmp/bundle/sbom.cyclonedx.json
          fi
          echo "✓ SBOM generated for $IMAGE"

      # ── Release Bundle ───────────────────────────────────────────
      - name: Create release bundle
        run: |
          # SBOM files are already in /tmp/bundle from the generation steps above

          # Copy release assets
          cp docker-compose.release.yml /tmp/bundle/docker-compose.yml
          cp .env.example /tmp/bundle/.env.example

          # Verify SBOM files exist (best-effort generation may have skipped)
          [ -f /tmp/bundle/requirements.txt ] \
            && echo "✓ Python requirements.txt included" \
            || echo "⚠ No requirements.txt generated"
          [ -f /tmp/bundle/sbom.cyclonedx.json ] \
            && echo "✓ CycloneDX SBOM included" \
            || echo "⚠ No SBOM generated (best-effort step may have failed)"

          # Create a README for the bundle
          cat > /tmp/bundle/README.md << 'READMEEOF'
          # Narrare — Self-Hosted Setup

          ## Quick Start

          1. Copy `.env.example` to `.env` and configure your values
          2. Start the services:
             ```bash
             docker compose up -d
             ```
          3. Open http://localhost:3000

          ## Configuration

          Edit `.env` and set at minimum:
          - `SECRET_KEY` — generate with: `python -c "import secrets; print(secrets.token_urlsafe(32))"`
          - `NARRARE_ENCRYPTION_KEY` — generate with: `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`
          - At least one AI provider API key (e.g. `ANTHROPIC_API_KEY` or `OPENAI_API_KEY`)

          **Important:** The bundled `.env.example` is the VM-first template from the repository.
          Change the DATABASE_URL to use the Docker service name for release compose:
          - `DATABASE_URL=postgresql+asyncpg://narrare:narrare@postgres:5432/narrare`

          The compose file defaults to image `${{ steps.image.outputs.IMAGE_NAME }}:<version>`.

          ## Updates

          ```bash
          docker compose pull
          docker compose up -d
          ```

          ## Stop

          ```bash
          docker compose down
          ```

          ## Verification

          ### Release Bundle Integrity

          This release bundle (`narrare-<version>.zip`) is published as a GitHub
          Release artifact. GitHub automatically signs all Release artifacts.
          To verify the download integrity:

          ```bash
          # Compare checksum with the SHA hash in the GitHub Release metadata
          sha256sum narrare-<version>.zip
          ```

          ### Docker Image Verification

          The Docker image is published to GitHub Container Registry (GHCR):

          ```bash
          # Pull by version tag
          docker pull ${{ steps.image.outputs.IMAGE_NAME }}:<version>

          # Pull by digest (immutable — recommended for production)
          docker pull ${{ steps.image.outputs.IMAGE_NAME }}@<digest>
          ```

          Each release includes the image digest in the Release summary.
          Always verify the digest when pulling for production deployments.

          ### SBOM (Software Bill of Materials)

          This bundle includes two SBOM artifacts:

          - **`requirements.txt`** — Python dependencies exported from
            `uv.lock`. Lists all direct and transitive Python packages.

          - **`sbom.cyclonedx.json`** — Machine-readable SBOM in CycloneDX
            format, generated from the published Docker image. Covers all
            image layers (system packages, Python, Node.js).

          Analyze the SBOM for vulnerabilities with any CycloneDX-compatible
          scanner:

          ```bash
          # Using Grype
          grype sbom:sbom.cyclonedx.json

          # Using Trivy
          trivy sbom sbom.cyclonedx.json
          ```

          ### Provenance

          | Artifact | Verification Method | Trust Level |
          |----------|-------------------|-------------|
          | GitHub Release | Signed by GitHub (automatic) | High |
          | Docker Image | Pull by digest for immutable ref | Medium |
          | Release Bundle | SHA256 checksum in Release | Medium |
          | SBOM (CycloneDX) | Generated from published image | Medium |

          **Key principles:**
          - GitHub Release artifacts are automatically signed by GitHub's
            infrastructure. The release tag is created by release-please,
            which only runs on merges to `main`.
          - Docker images are pushed from the same trusted workflow. For
            supply-chain security, pin to the digest rather than the tag.
          - The SBOM is generated during the release workflow and represents
            exactly what is in the published image.

          ### Optional: Cosign Signing (Future Enhancement)

          For cryptographic signing of Docker images, future releases may
          include Cosign keyless signing via GitHub OIDC. The planned
          verification command is:

          ```bash
          cosign verify ${{ steps.image.outputs.IMAGE_NAME }}:<version> \
            --certificate-identity-regexp 'https://github.com/<owner>/narrare/.github/workflows/release-please.yml@refs/tags/*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          ```

          **Prerequisites:** Install Cosign (`brew install cosign`), no
          manual key management needed (keyless mode uses GitHub OIDC).
          READMEEOF

          cd /tmp && zip -r /tmp/narrare-${{ steps.meta.outputs.VERSION }}.zip bundle/

      - name: Upload release bundle
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            /tmp/narrare-${{ steps.meta.outputs.VERSION }}.zip
            /tmp/bundle/sbom.cyclonedx.json
            /tmp/bundle/requirements.txt

      - name: Create GitHub Release summary
        run: |
          echo "## Release ${{ needs.release-please.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker image:** \`${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release bundle:** \`narrare-${{ steps.meta.outputs.VERSION }}.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "**SBOM (CycloneDX):** \`sbom.cyclonedx.json\` (separate asset + inside bundle)" >> $GITHUB_STEP_SUMMARY
          echo "**Python deps:** \`requirements.txt\` (exported from uv.lock)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Docker image** — pull by tag or immutable digest" >> $GITHUB_STEP_SUMMARY
          echo "2. **Release bundle** — verify SHA256 checksum" >> $GITHUB_STEP_SUMMARY
          echo "3. **SBOM** — scan \`sbom.cyclonedx.json\` with Grype/Trivy" >> $GITHUB_STEP_SUMMARY
          echo "4. **Cosign signing** — planned for future releases" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release created successfully." >> $GITHUB_STEP_SUMMARY
