name: Screenshots

# Regenerates the README's images from the real app and opens a pull request
# when they changed. Runs on manual dispatch, on the weekly Sunday schedule, and
# on every push to main; the decide job skips a push when no UI-relevant path
# changed and no commit carries a `Screenshots: regenerate` footer. A
# `Screenshots: skip` footer suppresses a run that would otherwise fire, unless
# a UI path changed too. The decision itself lives in
# `scripts/screenshots_decide.py`: it reads complete git output and ignores
# merge-commit bodies, where GitHub writes an editable pull request title. An
# open screenshot update PR is left untouched instead of being duplicated; it
# may be stale after newer UI changes, and a human closes or replaces it when
# the newer captures matter. This workflow is deliberately not a required
# check: a flaky screenshot run must never block a merge.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"
  push:
    branches: [main]

concurrency:
  group: screenshots
  cancel-in-progress: false

permissions: {}

jobs:
  decide:
    name: decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether to regenerate
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m scripts.screenshots_decide \
            --event "$EVENT" \
            --before "$BEFORE" \
            --sha "$SHA" | tee -a "$GITHUB_OUTPUT"

  screenshots:
    name: screenshots
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8 # pg17 — digest is the contract
        env:
          POSTGRES_USER: narrare
          POSTGRES_PASSWORD: narrare
          POSTGRES_DB: narrare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U narrare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          python: "true"
          node: "true"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Playwright browser
        run: uv run playwright install chromium
      - name: Regenerate screenshots
        run: uv run python -m scripts.screenshots --out assets/screenshots --index docs/screenshots/README.md
      - name: Open pull request if images changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="chore/screenshots-${RUN_ID}"
          git add assets/screenshots docs/screenshots/README.md
          if git diff --cached --quiet; then
            echo "no screenshot changes; nothing to do"
            exit 0
          fi
          # A real diff is worth publishing, but a previous run may already
          # have an update PR waiting. Defer to that PR before creating a
          # branch; it is left untouched and may be stale after newer UI
          # changes. The exported GH_TOKEN authenticates the query without
          # putting it in argv.
          pending=$(python3 -m scripts.screenshots_pr --repository "$REPOSITORY")
          # The lookup has exactly two valid shapes: pending=none, or a
          # positive PR number (GitHub starts at 1). Anything else means the
          # lookup broke; fail loudly instead of mistaking it for "no PR" and
          # publishing again.
          fail_lookup() {
            local detail=${pending//$'\n'/ }
            echo "::error::Screenshot PR lookup returned an unexpected value: '$detail' (expected pending=none or pending=<positive number>)"
            exit 1
          }
          case "$pending" in
            pending=none)
              ;;
            pending=*[!0-9]*|pending=)
              fail_lookup
              ;;
            pending=[1-9][0-9]*)
              echo "screenshot update PR #${pending#pending=} is already open; leaving it in place"
              exit 0
              ;;
            *)
              fail_lookup
              ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # No `Screenshots: regenerate` footer: the merge back to main must not
          # retrigger this workflow.
          git commit -m "chore(screenshots): regenerate README images"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Regenerated README screenshots" \
            --body "Automated screenshot regeneration from the Screenshots workflow. Review the updated frames and docs/screenshots/README.md, and merge if they look right."