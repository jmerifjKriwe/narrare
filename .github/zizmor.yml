# zizmor config — GitHub Actions security auditing (spec §5.2).
# Plain CLI in CI, blocking; no SARIF (private repo, Free plan: no GHAS).
# Docs: https://docs.zizmor.sh/usage/
#
# BASELINE POLICY (ratchet): every rule stays armed so NEW violations fail
# the gate (spec §5.2 "…going forward"). The pre-existing findings present
# when this check was introduced are frozen below as per-location ignores
# — the same pattern as the exception/type-ignore baselines. Removing an
# entry requires fixing its finding first; every entry carries the reason
# it was accepted and, where applicable, a follow-up note. Line numbers
# are 1-based and must move with their finding: an edit that shifts a line
# un-ignores it and fails CI until the baseline is re-triaged (intended).
#
# zizmor 1.30.1 semantics: the exit code reflects the HIGHEST finding
# severity (11=informational … 14=high) — any unsuppressed finding from
# any rule fails the job.
rules:
  unpinned-uses:
    # This check's core gate (Task 5): every `uses:` must be SHA-pinned
    # (Tasks 4a/4b); Dependabot keeps the pins fresh. Default severity is
    # medium — remapped to blocking high. (The per-rule `level:` key used
    # by older zizmor configs was replaced by `remap.severity` in
    # v1.25.0; this is the v1.30.1 syntax for the same promotion.)
    remap:
      severity: high

  artipacked:
    ignore:
      # ci.yml:117 `changes` — dorny/paths-filter takes the git path on
      # push runs (`git fetch origin <sha>`; depth-1 clone lacks the
      # previous head). Persisted credentials REQUIRED — Task-2
      # adjudication (report CONCERN 1).
      - ci.yml:117
      # ci.yml:673 `update-coverage-badge` — git-auto-commit pushes the
      # README badge commit. Persisted credentials REQUIRED — Task-2
      # documented exception ("git-auto-commit needs the token").
      - ci.yml:673
      # vrt-update-baselines.yml:65 — the job runs `git commit &&
      # git push` on regenerated baselines (contents: write, dispatch
      # only). Persisted credentials REQUIRED.
      - vrt-update-baselines.yml:65

  cache-poisoning:
    ignore:
      # release-please.yml:49 — spec §5.5 adjudication: no
      # pull_request_target anywhere in the repo; publish tokens (GHCR
      # login, release upload) exist only inside this push-to-main job;
      # the uv cache is default-branch-scoped and never shared with PR
      # runs, so no PR-reachable consumer can inherit it.
      - release-please.yml:49

  superfluous-actions:
    ignore:
      # release-please.yml:262 — softprops/action-gh-release could be
      # `gh release` in a script step; the action is SHA-pinned and
      # Dependabot-tracked, so this is hygiene only. Cosmetic follow-up.
      - release-please.yml:262

  template-injection:
    ignore:
      # All entries below expand trusted contexts (this workflow's own
      # step outputs / release-please tag names) inside run: blocks —
      # not attacker-controllable input. zizmor cannot model step-output
      # provenance statically, hence the findings. Fixing them via env
      # indirection is a bulk follow-up, not accepted risk per line.
      - ci.yml:824 # frontend-tests duration (own step output, numeric)
      - mutation-testing-monthly.yml:106 # scope label (own step output)
      - release-please.yml:65 # VERSION (release-please tag output)
      - release-please.yml:95 # IMAGE name:tag (own step outputs)
      - release-please.yml:160 # bundle README heredoc (own step outputs)
      - release-please.yml:194 # docker pull docs line (own step outputs)
      - release-please.yml:250 # cosign verify docs (own step outputs)
      - release-please.yml:259 # bundle zip name (own step outputs)
      - release-please.yml:272 # release summary: tag name
      - release-please.yml:274 # release summary: image:tag (2 findings)
      - release-please.yml:275 # release summary: image digest
      - release-please.yml:277 # release summary: bundle zip name
      # vrt-update-baselines.yml:136-137 — job-summary echo of the
      # workflow's own git-status outputs (changed, changed_count) and,
      # at 137 col 117, `github.ref_name`. Accepted risk for line 137:
      # this workflow is workflow_dispatch-only (maintainer-triggered,
      # no pull_request path), so ref_name is a branch name chosen by
      # someone with push rights in the dispatch picker — not
      # PR-controllable. Follow-up: env-indirection (REF_NAME env) to
      # drop both entries.
      - vrt-update-baselines.yml:136
      - vrt-update-baselines.yml:137
