title = "Narrare secret-scanning gate"

[extend]
useDefault = true

[allowlist]
description = "Only explicitly fake local/test values approved for docs, examples, and CI fixtures."
regexTarget = "match"
regexes = [
  '''sk-test-dummy''',
  '''sk-test-''',               # Broader: covers sk-test-key-1234, sk-test-key-6789
  '''sk-or-key''',              # Test OpenRouter key fixture
  '''test-secret-key-not-for-production''',
  '''test-secret-key-at-least-32-(characters|chars)-long''',  # JWT test fixture (2 forms: characters-long & chars-long)
  '''result\d\.key_points''',   # Python attribute false positive (not a secret)
  '''narrare-dev''',
  '''postgresql\+asyncpg://narrare:narrare@localhost:5432/narrare_(dev|test)''',
  '''redis://localhost:6379/0''',
  '''WYcr1iULJse2Oo6GPpmw1Au4ovp_fXZwbrNF11C12ZQ=''',
  # ADR-071 doc example (multi-line span): generic-api-key joins
  # `openai_api_key="test-key",` + newline + `encryption_key="test-encryption-key",`
  # across the newline; the greedy secret group then includes the '=' after
  # `encryption_key` (secret "encryption_key="), which escapes the default
  # rule-level allowlist. Allowlist the exact doc pattern so real keys remain flagged.
  '''test-key",\n\s*encryption_key="''',
  # Plan doc "pydantic-ai 2.52 upgrade" leak-probe example code: fake marker
  # constants (SECRET_INSTRUCTION/SECRET_USER_PROMPT/SECRET_OUTPUT), not credentials.
  '''SECRET-(INSTRUCTION|USER-PROMPT|OUTPUT)-MARKER-[0-9a-f]+''',
]
