# Each hook names a failure that has happened: unformatted code, lint
# findings, type errors that only show up across files, a leaked secret, a
# commit subject release-please cannot parse, a lockfile that no longer
# matches pyproject, and the gates a developer should not push past.
#
# A commit checks the staged files; a push checks the pushed tree. The web
# suite follows that split: the commit runs only the tests the change reaches,
# a push that touches web runs all of them.
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: local
    hooks:
      - id: secrets
        name: Secrets (gitleaks)
        entry: python3 scripts/check_secrets.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: pyright-changed
        name: Pyright (changed files)
        entry: uv run pyright
        language: system
        types: [python]
        stages: [pre-commit]

      # `app/capabilities/.*/web/`, not `app/capabilities/`: a backend-only
      # capability commit owes neither tsc nor vitest (issue #446). One hook
      # runs both: the types first, then the tests the working tree's change
      # reaches — not all of them, because the full suite runs on a
      # web-touching push (`web-tests-full`) and in CI's `frontend` job, which
      # no path filter can skip. A missed generated-input change is caught in
      # CI by `just check-generated`; the hook stays out of it because
      # `pnpm dlx` needs the network and the run is not sub-second (issue
      # #622).
      - id: web
        name: Web typecheck and tests (changed)
        entry: bash -c 'pnpm --dir web typecheck && pnpm --dir web exec vitest run --changed HEAD'
        language: system
        pass_filenames: false
        files: (^web/|^app/capabilities/.*/web/|^i18n/)
        stages: [pre-commit]

      # Only the subject grammar: release-please reads the type, and a subject
      # it cannot parse is lost from the changelog. Whether a `User-visible:`
      # line is real stays review's call (CONTRIBUTING).
      - id: commit-message
        name: Commit message
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]

      # The lockfile check is first at push: a stale lock costs nothing to
      # find and two minutes to wait for behind the suites. A push hook runs
      # against the index (pre-commit stashes unstaged changes), so the guard
      # refuses a lock update that is staged but not committed; `uv lock
      # --check` then reads the pair the push actually carries.
      - id: uv-lock
        name: Lockfile (uv)
        entry: bash -c 'git diff --quiet HEAD -- pyproject.toml uv.lock || { echo "uncommitted dependency change — commit or revert it before pushing"; exit 1; }; uv lock --check'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pyright-full
        name: Pyright (whole project)
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest
        name: Tests
        entry: bash
        args:
          - "-c"
          - "{ exec 3<>/dev/tcp/localhost/5433; } 2>/dev/null || { echo 'dev services not running — run: just dev-services'; exit 2; }; exec 3>&-; uv run pytest app -q"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: web-tests-full
        name: Web tests (all)
        entry: pnpm --dir web test
        language: system
        pass_filenames: false
        files: (^web/|^app/capabilities/.*/web/|^i18n/)
        stages: [pre-push]
