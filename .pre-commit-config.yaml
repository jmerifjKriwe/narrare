# Six hooks, and each names a failure that has happened: unformatted code,
# lint findings, type errors that only show up across files, a leaked secret,
# and the two gates a developer should not push past.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: pyright-changed
        name: Pyright (changed files)
        entry: uv run pyright
        language: system
        types: [python]
        stages: [pre-commit]

      - id: secrets
        name: Secrets (gitleaks)
        entry: python3 scripts/check_secrets.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pyright-full
        name: Pyright (whole project)
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest
        name: Tests
        entry: uv run pytest app -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
