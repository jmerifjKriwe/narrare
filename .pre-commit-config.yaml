# Six hooks, and each names a failure that has happened: unformatted code,
# lint findings, type errors that only show up across files, a leaked secret,
# and the two gates a developer should not push past.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: pyright-changed
        name: Pyright (changed files)
        entry: uv run pyright
        language: system
        types: [python]
        stages: [pre-commit]

      - id: secrets
        name: Secrets (gitleaks)
        entry: python3 scripts/check_secrets.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: web-typecheck
        name: Web typecheck (tsc)
        entry: pnpm --dir web typecheck
        language: system
        pass_filenames: false
        always_run: false
        files: ^web/
        stages: [pre-commit]

      - id: web-tests
        name: Web tests (vitest)
        entry: pnpm --dir web test
        language: system
        pass_filenames: false
        always_run: false
        files: ^web/
        stages: [pre-commit]

      - id: pyright-full
        name: Pyright (whole project)
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest
        name: Tests
        entry: bash
        args:
          - "-c"
          - "{ exec 3<>/dev/tcp/localhost/5433; } 2>/dev/null || { echo 'dev services not running — run: just dev-services'; exit 2; }; exec 3>&-; uv run pytest app -q"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
