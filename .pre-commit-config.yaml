# Each hook names a failure that has happened: unformatted code, lint
# findings, type errors that only show up across files, a leaked secret, a
# commit subject release-please cannot parse, a lockfile that no longer
# matches pyproject, and the gates a developer should not push past.
#
# A commit checks the staged files; a push checks the pushed tree. The web
# suite follows that split: the commit runs only the tests the change reaches,
# the full suite runs in CI. Locally, push runs typecheck + lock only.
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: local
    hooks:
      - id: secrets
        name: Secrets (gitleaks)
        entry: python3 scripts/check_secrets.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: pyright-changed
        name: Pyright (changed files)
        entry: uv run pyright
        language: system
        types: [python]
        stages: [pre-commit]

      # `app/capabilities/.*/web/`, not `app/capabilities/`: a backend-only
      # capability commit owes neither tsc nor vitest (issue #446). One hook
      # runs both: the types first, then the tests the working tree's change
      # reaches. The full web suite runs in CI's `frontend` job (required via
      # `ci-required`); it no longer runs on push locally. A missed
      # generated-input change is caught in CI by `just check-generated`; the
      # hook stays out of it because
      # `pnpm dlx` needs the network and the run is not sub-second (issue
      # #622).
      - id: web
        name: Web typecheck and tests (changed)
        entry: bash -c 'pnpm --dir web typecheck && pnpm --dir web exec vitest run --changed HEAD'
        language: system
        pass_filenames: false
        files: (^web/|^app/capabilities/.*/web/|^i18n/)
        stages: [pre-commit]

      # The subject grammar, and a real `User-visible:` line for the types that
      # reach the release notes (feat, fix, perf, docs): release-please reads
      # the type, and a subject it cannot parse is lost from the changelog.
      # Whether a line is an honest sentence stays review's call (CONTRIBUTING).
      - id: commit-message
        name: Commit message
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]

      # The lockfile check is first at push: a stale lock costs nothing to
      # find. A push hook runs against the index (pre-commit stashes unstaged
      # changes), so the guard
      # refuses a lock update that is staged but not committed; `uv lock
      # --check` then reads the pair the push actually carries.
      - id: uv-lock
        name: Lockfile (uv)
        entry: bash -c 'git diff --quiet HEAD -- pyproject.toml uv.lock || { echo "uncommitted dependency change — commit or revert it before pushing"; exit 1; }; uv lock --check'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pyright-full
        name: Pyright (whole project)
        entry: uv run pyright
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$
        stages: [pre-push]

      # Full Python + web suites moved to CI (`tests` and `frontend` jobs,
      # required via `ci-required`). Local push keeps typecheck + lock only.
      # Run `just test` / `just test-frontend` before pushing when touching
      # risky code. The commit hook still runs the changed web tests.
