repos:
  - repo: local
    hooks:
      # Architecture constraints — must pass before anything else
      - id: architecture-constraints
        name: Architecture Constraints
        entry: uv run python scripts/check_architecture.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OpenAPI spec auto-regeneration — keeps spec in sync with API surface
      - id: openapi-regenerate
        name: OpenAPI Spec (auto-regenerate)
        entry: uv run python scripts/export_openapi.py
        language: system
        pass_filenames: false
        files: ^(apps/api/|packages/core/)

      # Ruff lint + fix
      - id: ruff-lint
        name: Ruff Lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: false

      # Ruff format
      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: false

      # Pyright — only on changed files for speed
      - id: pyright
        name: Pyright Type Check
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      # Security
      - id: bandit
        name: Security (Bandit)
        entry: uv run bandit -c pyproject.toml
        language: system
        types: [python]
        require_serial: false

      # ── Frontend checks ────────────────────────────────────────────

      # Biome lint + format — catches code issues and enforces style
      - id: biome-frontend
        name: Biome (Frontend)
        entry: bash -c 'cd packages/web && npx biome check --write "${@/#packages\/web\//}"' --
        language: system
        types_or: [ts, tsx]
        files: ^packages/web/

      # i18n validation — catches hardcoded user-facing strings
      - id: validate-i18n
        name: i18n Validation
        entry: bash -c 'npx tsx scripts/validate-i18n.ts "$@"' --
        language: system
        types_or: [tsx, python, json]
        files: ^(packages/web/.*\.tsx|apps/api/.*\.py|packages/i18n/messages/.*\.json)

      # TypeScript type check — consider moving to stages: [pre-push] or CI-only if slow
      - id: typecheck-frontend
        name: TypeScript Check (Frontend)
        entry: bash -c 'cd packages/web && npx tsc --noEmit'
        language: system
        types: [tsx]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Standard hooks for file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      # - id: no-commit-to-branch
      #   args: ["--branch", "main"]

  # Conventional commits
  - repo: local
    hooks:
      - id: conventional-commits
        name: Conventional Commits
        entry: uv run python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
        pass_filenames: false

ci:
  skip: [pyright]  # pyright runs as full check in CI, not per-file in CI
