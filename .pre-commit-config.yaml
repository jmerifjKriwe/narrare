# Each hook names a failure that has happened: unformatted code, lint
# findings, type errors that only show up across files, a leaked secret, and
# the gates a developer should not push past.
#
# A commit checks the staged files; a push checks the pushed tree. The web
# suite follows that split: the commit runs only the tests the change reaches,
# a push that touches web runs all of them.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: secrets
        name: Secrets (gitleaks)
        entry: python3 scripts/check_secrets.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: pyright-changed
        name: Pyright (changed files)
        entry: uv run pyright
        language: system
        types: [python]
        stages: [pre-commit]

      # `app/capabilities/.*/web/`, not `app/capabilities/`: a backend-only
      # capability commit owes neither tsc nor vitest (issue #446). The cost of
      # a missed generated-input change is the gap tracked separately; no web
      # check reads generated inputs for staleness anyway.
      - id: web-typecheck
        name: Web typecheck (tsc)
        entry: pnpm --dir web typecheck
        language: system
        pass_filenames: false
        files: (^web/|^app/capabilities/.*/web/|^i18n/)
        stages: [pre-commit]

      # The tests the working tree's change reaches, not all of them: the full
      # suite runs on a web-touching push and in CI's `frontend` job, which no
      # path filter can skip.
      - id: web-tests
        name: Web tests (changed)
        entry: pnpm --dir web exec vitest run --changed HEAD
        language: system
        pass_filenames: false
        files: (^web/|^app/capabilities/.*/web/|^i18n/)
        stages: [pre-commit]

      - id: pyright-full
        name: Pyright (whole project)
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest
        name: Tests
        entry: bash
        args:
          - "-c"
          - "{ exec 3<>/dev/tcp/localhost/5433; } 2>/dev/null || { echo 'dev services not running — run: just dev-services'; exit 2; }; exec 3>&-; uv run pytest app -q"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: web-tests-full
        name: Web tests (all)
        entry: pnpm --dir web test
        language: system
        pass_filenames: false
        files: (^web/|^app/capabilities/.*/web/|^i18n/)
        stages: [pre-push]
