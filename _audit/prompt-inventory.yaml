      - entity_summaries
      - existing_relationships
      - template_structures
      - user_preferences
      - world_context
    notes: "EN-only (no DE/FR bundled variants). context_modes: worldbuilding/phase1, worldbuilding/phase2."

  worldbuilding_phase2:
    intent: LLMIntent.KB_CONSISTENCY  # context_mode: worldbuilding/phase2
    bundled:
      en: kb/en/worldbuilding/phase2/system.md
    variables:
      - avoidance_patterns
      - candidate_pairs
      - entity_details
      - existing_relationships
      - user_preferences
      - world_context
    notes: "EN-only (no DE/FR bundled variants)."

