# _audit/prompt-inventory.yaml
# Automatically generated prompt inventory.
# Last updated: 2026-06-01
# Validate with: check_architecture.py --prompt-integrity
#
# Schema:
#   category:
#     mode:
#       intent: LLMIntent.<NAME>
#       bundled:
#         en: relative/path/to/en/system.md
#         de: relative/path/to/de/system.md
#         fr: relative/path/to/fr/system.md
#       lite:        (optional — EN-only variant)
#       variables:   list of {{variable}} names used in the prompt
#       notes:       (optional — e.g. EN-only rationale, known gaps)

meta:
  system:
    intent: null  # prepended by PromptComposer, not an LLMIntent itself
    bundled:
      en: meta/en/system.md
      de: meta/de/system.md
      fr: meta/fr/system.md
    lite:
      en: meta/en/system.lite.md
      # DE/FR: no lite variants — EN-only documented
    variables:
      - author_name
      - genre
      - project_title
      - tone
      - story_structure
      - writing_language
      - avoidance_patterns

