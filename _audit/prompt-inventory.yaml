      - genre
      - language
      - timeline_position
      - story_structure
      - kb_characters
      - kb_locations
      - kb_factions
      - kb_relationships
      - recent_chapters
      - novel_synopsis
      - style_profile
      - character_voice_profiles
      - chapter_outline
      - author_instructions  (USER_CONTENT)
      - word_target
      - tone_instructions
      - user_preferences
      - avoidance_patterns
      - writing_language
      - culture_guidelines

  extend_chapter:
