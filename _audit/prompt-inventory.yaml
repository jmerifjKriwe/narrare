# ──────────────────────────────────────────────────────────────────────
# kb — knowledge base operations
# ──────────────────────────────────────────────────────────────────────

kb:
  consistency:
    intent: LLMIntent.KB_CONSISTENCY  # context_mode: consistency (default)
    bundled:
      en: kb/en/consistency/system.md
    variables:
      - avoidance_patterns
      - entity_name
      - entity_type
      - entry_content  (USER_CONTENT)
      - template_structure
      - user_preferences
    notes: "EN-only (no DE/FR bundled variants). context_modes: consistency, merge."

  enhance:
    intent: LLMIntent.KB_ENHANCE
    bundled:
      en: kb/en/enhance/system.md
    variables:
      - avoidance_patterns
      - entity_type
      - existing_answers  (USER_CONTENT)
      - template_structure
      - user_preferences
      - world_context

  extract:
    intent: LLMIntent.KB_EXTRACT
    bundled:
      en: kb/en/extract/system.md
    variables:
      - avoidance_patterns
      - chapter_title
      - existing_entity_names
      - genre
      - user_preferences
      - world_context

  improve:
    intent: LLMIntent.KB_IMPROVE
    bundled:
      en: kb/en/improve/system.md
    variables:
      - avoidance_patterns
      - entity_type
      - entry_content  (USER_CONTENT)
      - existing_relationships
      - template_structure
      - user_preferences
      - world_context

  interview:
    intent: LLMIntent.KB_INTERVIEW
    bundled:
      en: kb/en/interview/system.md
    variables:
      - avoidance_patterns
      - existing_answers  (USER_CONTENT)
      - template_structure
      - user_preferences
      - world_context

  merge:
    # ADR-054 D5/D9: merge is a context_mode of KB_CONSISTENCY intent
    intent: LLMIntent.KB_CONSISTENCY  # context_mode: merge
    bundled:
      en: kb/en/merge/system.md
    variables:
      - avoidance_patterns
      - candidate_pairs
      - entity_type
      - genre
      - project_title
      - user_preferences
      - world_context
      - writing_language
    notes: "EN-only (no DE/FR bundled variants). context_mode of KB_CONSISTENCY."

  suggest:
    intent: LLMIntent.KB_SUGGEST
    bundled:
      en: kb/en/suggest/system.md
    variables:
      - avoidance_patterns
      - existing_answers  (USER_CONTENT)
      - target_field
      - target_field_description
      - template_structure
      - user_preferences
      - world_context

  worldbuilding_phase1:
    intent: LLMIntent.KB_WORLDBUILD  # context_mode: worldbuilding/phase1
