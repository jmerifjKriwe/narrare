# _audit/prompt-inventory.yaml
# Prompt inventory — all bundled prompt templates.
# Last updated: 2026-07-11
# Validate with: check_architecture.py --prompt-integrity
#
# Schema:
#   category:
#     mode:
#       intent: LLMIntent.<NAME>
#       bundled:
#         en: relative/path/to/en/system.md
#         de: relative/path/to/de/system.md  (if exists)
#         fr: relative/path/to/fr/system.md  (if exists)
#       variables:   list of {{variable}} names used in the prompt
#       notes:       (optional — e.g. EN-only rationale, known gaps)
#
# Variable suffixes:
#   (USER_CONTENT) — variable carries raw user-supplied text (USER_CONTENT_VARS)
#
# Notes:
#   - "language" is a DEPRECATED alias for "writing_language" (VARIABLE_ALIASES)
#   - Paths are relative to packages/core/narrare_core/prompts/_bundled/
#   - Templates marked EN-only lack DE/FR bundled variants on disk

# ──────────────────────────────────────────────────────────────────────
# meta — prepended by PromptComposer, not an LLMIntent itself
# ──────────────────────────────────────────────────────────────────────

meta:
  system:
    intent: null  # loaded by NarrareMeta Capability (ADR-026)
    bundled:
      en: meta/en/system.md
      de: meta/de/system.md
      fr: meta/fr/system.md
    variables:
      - author_name
      - avoidance_patterns
      - genre
      - project_title
      - story_structure
      - tone
      - writing_language

# ──────────────────────────────────────────────────────────────────────
# universal — loaded by NarrareUniversalRules Capability (ADR-026)
# No LLMIntent, no {{variable}} placeholders — injected automatically.
# ──────────────────────────────────────────────────────────────────────

universal:
  system:
    intent: null  # Capability, not an LLMIntent
    bundled:
      en: universal/en/system.md
      de: universal/de/system.md
      fr: universal/fr/system.md
    variables: []  # no {{variable}} placeholders — static rules
    notes: "Universal rules (fiction craft, conflict, injection defense). Auto-injected by NarrareUniversalRules Capability."

