[project]
name = "narrare"
version = "0.1.0"
description = "Narrare FastAPI backend"
requires-python = ">=3.14"

dependencies = [
  # Web framework
  "fastapi==0.137.0",
  "uvicorn[standard]==0.49.0",
  "python-multipart==0.0.32",

  # Data validation
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "email-validator==2.3.0",

  # Database
  "sqlalchemy==2.0.51",
  "asyncpg==0.31.0",
  "alembic==1.18.4",
  "pgvector==0.4.2",

  # LLM
  "pydantic-ai-slim[openai,anthropic,google,groq]==1.107.0",

  # Background tasks
  "taskiq==0.12.4",
  "taskiq-redis==1.2.2",
  "taskiq-fastapi==0.5.0",

  # CVE fix: taskiq transitive dep
  "aiohttp>=3.14.0",

  # Cache & broker
  "redis>=7.0.0,<9",

  # Auth
  "PyJWT==2.13.0",
  "argon2-cffi>=25.1.0",

  # HTTP client
  "httpx==0.28.1",

  # Observability
  "structlog==26.1.0",
  "opentelemetry-api>=1.39.0,<1.43.0",
  "opentelemetry-sdk>=1.39.0,<1.43.0",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<0.63",
  "opentelemetry-exporter-otlp>=1.39.0,<1.43.0",

  # Rate limiting
  "pyrate-limiter>=4.0,<5",

  # Email
  "aiosmtplib==5.1.1",

  # Templates
  "jinja2==3.1.6",

  # File operations
  "filelock==3.29.4",
  "aiofiles==25.1.0",

  # YAML
  "pyyaml==6.0.3",

  # Workspace packages
  "narrare-core",
  "narrare-i18n",
]

[tool.uv.sources]
narrare-core = { workspace = true }
narrare-i18n = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narrare"]
artifacts = ["narrare/py.typed"]
