[project]
name = "narrare"
version = "0.1.0"
description = "Narrare FastAPI backend"
requires-python = ">=3.14"

dependencies = [
  # Web framework
  "fastapi==0.136.3",
  "uvicorn[standard]==0.48.0",
  "python-multipart==0.0.32",

  # Data validation
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "email-validator==2.3.0",

  # Database
  "sqlalchemy==2.0.50",
  "asyncpg==0.31.0",
  "alembic==1.18.4",
  "pgvector==0.4.2",

  # LLM
  "pydantic-ai-slim[openai,anthropic,google,groq]==1.106.0",

  # Background tasks
  "taskiq==0.12.4",
  "taskiq-redis==1.2.2",
  "taskiq-fastapi==0.5.0",

  # CVE fix: taskiq transitive dep
  "aiohttp>=3.14.0",

  # Cache & broker
  "redis==8.0.0",

  # Auth
  "PyJWT==2.13.0",
  "argon2-cffi>=25.1.0",

  # HTTP client
  "httpx==0.28.1",

  # Memory layer
  "mem0ai==2.0.4",

  # Observability
  "structlog==25.5.0",
  "opentelemetry-api>=1.39.0,<1.43.0",
  "opentelemetry-sdk>=1.39.0,<1.43.0",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<0.63",
  "opentelemetry-exporter-otlp>=1.39.0,<1.43.0",

  # Rate limiting
  "fastapi-limiter>=0.2.0",

  # Email
  "aiosmtplib==5.1.1",

  # Templates
  "jinja2==3.1.6",

  # File operations
  "filelock==3.29.0",
  "aiofiles==25.1.0",

  # YAML
  "pyyaml==6.0.3",

  # Workspace packages
  "narrare-core",
  "narrare-i18n",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "pyright==1.1.409",
  "ruff==0.15.15",
  "bandit==1.9.4",
  "pip-audit==2.10.0",
]

[tool.uv.sources]
narrare-core = { workspace = true }
narrare-i18n = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narrare"]
artifacts = ["narrare/py.typed"]
