[project]
name = "narrare"
version = "0.1.0"
description = "Narrare FastAPI backend"
requires-python = ">=3.14"

dependencies = [
  # Web framework
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "python-multipart==0.0.32",

  # Data validation
  "email-validator==2.3.0",

  # Database
  "sqlalchemy==2.0.51",
  "asyncpg==0.31.0",
  "alembic==1.18.5",
  "pgvector==0.5.0",

  # Auth
  "PyJWT==2.13.0",
  "argon2-cffi>=25.1.0",

  # Observability
  "structlog==26.1.0",
  "opentelemetry-api>=1.39.0,<1.45.0",
  "opentelemetry-sdk>=1.39.0,<1.45.0",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<0.65",
  "opentelemetry-exporter-otlp>=1.39.0,<1.45.0",

  # Rate limiting
  "pyrate-limiter>=4.0,<5",

  # Email
  "aiosmtplib==5.1.2",

  # Templates
  "jinja2==3.1.6",

  # File operations
  "filelock==3.32.2",

  # Workspace packages
  "narrare-core",
]

[tool.uv.sources]
narrare-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narrare"]
artifacts = ["narrare/py.typed"]

[tool.hatch.build]
dev-mode-dirs = ["."]
