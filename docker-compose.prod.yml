# docker-compose.prod.yml — Production overrides
# Usage: docker compose -f docker-compose.dev.yml -f docker-compose.prod.yml up
#
# This file activates pgBouncer (removes profile restriction) for
# single-user / small self-hosted deployments.
#
# Note: The API itself runs locally (not in Docker) in this deployment
# model — it connects to pgBouncer via DATABASE_URL. The full containerized
# production deployment uses docker-compose.release.yml (narrare image).

services:
  pgbouncer:
    profiles: []  # Override: remove profile restriction in production
