# =============================================================================
# Narrare Configuration Adoption Matrix (ADR-051)
# =============================================================================
# Machine-readable classification of every CR-08 configuration value.
# Loaded by: scripts/check_configuration_matrix.py
# Spec: docs/features/remediation/cr-08-configuration-effect-drift.md
# ADR:  docs/architecture/decisions/ADR-051-configuration-effect-adoption-contract.md
#
# Two classification dimensions (per ADR-051):
#   lifecycle      — the *adoption state* of the value (adopted, governed_default,
#                    operator_default, formal_finding, covered_by_existing,
#                    not_applicable).
#   classification — the *kind/layer* of the setting (user, project, operator,
#                    runtime-derived, governed_default, test-only).
#
# Enforcement (P0 baseline):
#   * classification user/project  => runtime_consumer + enforcement_evidence
#                                     are required (checker FAILs otherwise).
#   * lifecycle adopted            => enforcement_evidence required.
#   * every expected_setting_ids   => must appear exactly once in entries.
# =============================================================================

version: "1.0.0"
adr: "ADR-051"
spec: "docs/features/remediation/cr-08-configuration-effect-drift.md"
description: >-
  Configuration Effect Adoption Matrix. Every material configuration value
  exposed, stored, resolved, or documented in Narrare must have exactly one
  lifecycle classification and, when user/project-facing, a proven
  source -> resolver -> runtime-consumer -> evidence chain.

# ── Expected CR-08 setting_ids ────────────────────────────────────────────────
# Every id listed here MUST appear in `entries`. An entry referencing an id
# not listed here is rejected (typo guard). This is the "no unclassified
# value" guarantee (P0 DoD).
expected_setting_ids:
  # P0 — high-risk runtime binding
  - output_limit_enforcement          # FIND-001 / CR-AUFG-08-01
  - tier_percentages_consumption      # FIND-012 / CR-AUFG-08-02
  - configuration_adoption_matrix     # CR-AUFG-08-09 (this artifact)
  # P1 — vocabulary & UI/API drift
  - token_profile_vocabulary          # CR-AUFG-08-03 / FIND-013
  - token_settings_ui_api_parity      # CR-AUFG-08-10 / FIND-013
  - model_limit_calibration           # CR-AUFG-08-07
  - model_suitability_policy          # CR-AUFG-08-11
  # P2 — operator defaults, catalogs, system resolvers
  - inline_suggest_cap                # CR-AUFG-08-04
  - consistency_caps                  # CR-AUFG-08-05
  - setup_fallback_catalogs           # CR-AUFG-08-06
  - system_background_model_defaults  # CR-AUFG-08-08
  - operator_default_governance       # CR-AUFG-08-12
  - profile_output_limits_defaults    # governed code defaults
  - resolved_model_config_fallback    # 4096 fallback
  - provider_inference_prefixes       # dev/debug utility
  - cost_rate_fallback_defaults       # operator fallback
  # P3 — long-tail governed defaults
  - governed_defaults_manifest        # CR-AUFG-08-13
  - embedding_threshold_search_limit  # CR-AUFG-08-13
  - name_dedup_context_cap            # CR-AUFG-08-13
  - sse_connect_retry_defaults        # CR-AUFG-08-13
  # P4 / covered-by-existing
  - ws_idle_timeout                    # WebSocket idle timeout (ADR-060 split)
  - llm_transport_retry                # provider-SDK transport max_retries (ADR-060)
  - default_model_per_feature         # ModelRoutingResolverImpl cascade
  - mem0_defaults                     # Settings/mem0 config
  - feature_flags_kill_switches       # per current config paths
  - status_doc_taxonomy               # CR-AUFG-08-14

# ── Matrix entries ────────────────────────────────────────────────────────────
entries:
  # ── P0 ────────────────────────────────────────────────────────────────────
  - setting_id: output_limit_enforcement
    classification: project
    lifecycle: adopted
    source: >-
      UI TokenSettings slider; DB token-limit overrides
      (TokenLimitOverrides.output_limit); operator Settings.default_max_tokens.
    resolver_service: TokenLimitsService.get_resolved_limits
    runtime_consumer: >-
      ModelRegistry.run / ModelRegistry.stream via DefaultRunLimitResolver ->
      pydantic-ai model_settings["max_tokens"] + UsageLimits.output_tokens_limit.
    effect_semantics: >-
      Changing the output profile or custom limit changes the max_tokens passed
      to the model call and caps completion tokens.
    fallback_policy: >-
      Cap to known provider max output (models.dev); warn/label on unknown or
      offline provider. Never silently exceed a resolved limit.
    enforcement_evidence:
      - "tests/unit/core/llm/test_run_limits.py::TestModelRegistryLimitEnforcement.test_run_passes_resolved_usage_limits_and_model_settings"
      - "tests/unit/core/llm/test_run_limits.py::TestModelRegistryLimitEnforcement.test_stream_passes_resolved_usage_limits_and_model_settings"
      - "tests/unit/core/llm/test_run_limits.py::TestDefaultRunLimitResolver"
      - "tests/unit/core/llm/test_run_limits.py::test_comprehensive_profile_is_recognized_by_gateway_profile_mapping"
    cross_layer_evidence:
      - "ADR-045 ResolvedRunLimits (core run_limits.py) consumed by backend agents + gateway."
      - "TokenLimitsService API returns resolved output_limit; frontend TokenSettings writes it."
    cr_task: CR-AUFG-08-01
    finding: FIND-001
    phase: P0
    rationale: >-
      Enforcement exists on disk at the model boundary with regression tests
      proving changed profile/limit changes model-call settings (ADR-045).

  - setting_id: tier_percentages_consumption
    classification: project
    lifecycle: adopted
    source: >-
      UI ContextBudget / useAiTabData; DB TokenLimitOverrides.tier_percentages
      (user/project); core TokenBudgetManager tier_overrides.
    resolver_service: TokenLimitsService.get_resolved_limits (.tier_percentages)
    runtime_consumer: >-
      WritingContextAssembler (tier_overrides) -> TokenBudgetManager ->
      emitted tier budgets in WritingContext metadata and assemble() output.
    effect_semantics: >-
      Changing a tier percentage changes the token budget allocated to that
      writing-context tier and the amount of content that survives truncation.
    fallback_policy: >-
      tier_percentages=None (not configured) preserves mode-specific default
      allocations; invalid sums raise ValueError at construction (fail-fast).
    enforcement_evidence:
      - "tests/unit/core/writing/test_context_assembler_tier_overrides.py::TestWritingContextAssemblerTierOverrides"
      - "tests/unit/core/writing/test_context_assembler_tier_overrides.py::TestWritingPipelineForwardsOverrides"
      - "tests/unit/api/writing/test_deps_tier_overrides.py (create_pipeline forwards tier_percentages)"
    cross_layer_evidence:
      - "Core WritingContextAssembler.tier_overrides mirrors backend TokenLimitOverrides.tier_percentages (dict[str, float])."
      - "Backend DI factories resolve limits and forward at factory time; core stays backend-agnostic."
    cr_task: CR-AUFG-08-02
    finding: FIND-012
    phase: P0
    rationale: >-
      Source -> resolver -> consumer chain is wired end-to-end with tests
      proving changing the UI setting changes emitted tier budgets.

  - setting_id: configuration_adoption_matrix
    classification: governed_default
    lifecycle: adopted
    source: docs/architecture/governance/configuration-adoption-matrix.yaml
    resolver_service: scripts/governance/configuration_matrix.py
    runtime_consumer: scripts/check_configuration_matrix.py (CI + just check)
    effect_semantics: >-
      Adding/removing a CR-08 setting_id changes whether the checker passes;
      a user/project setting without runtime_consumer/evidence fails the gate.
    fallback_policy: fail-fast — unclassified or malformed matrix fails CI.
    enforcement_evidence:
      - "tests/unit/scripts/governance/test_configuration_matrix.py"
    cross_layer_evidence:
      - "Platform gate (RULE-07): reads the manifest, imports no application runtime modules."
    cr_task: CR-AUFG-08-09
    phase: P0
    rationale: >-
      This artifact is the prevention gate itself; its checker and tests are
      delivered in the same slice (CR-AUFG-08-09).

  # ── P1 ────────────────────────────────────────────────────────────────────
  - setting_id: token_profile_vocabulary
    classification: user
    lifecycle: adopted
    source: >-
      Core token_profiles.py public vocabulary and preset limits; API schemas
      and metadata catalogue; frontend token-profiles.ts constants/types.
    resolver_service: >-
      packages/core/narrare_core/llm/token_profiles.py::TokenLimitProfile
      consumed by Backend schemas/validators and Frontend contract constants.
    runtime_consumer: >-
      ModelRegistry profile mapping; API token-limit schemas; frontend
      TokenSettings profile selector.
    effect_semantics: >-
      Selecting a profile (quick/balanced/long_texts/comprehensive/custom)
      should select a single canonical output limit across all layers.
    fallback_policy: >-
      P1 policy removes `conservative` from the public contract; new writes reject
      it and existing persisted values normalize to `balanced`. `custom` is raw
      output_limit mode, not a preset.
    enforcement_evidence:
      - "tests/unit/core/llm/test_token_profiles.py"
      - "tests/unit/api/settings/test_cr08_p1_token_profile_contract.py"
      - "tests/unit/api/settings/test_cr08_p1_cross_layer_contract.py::test_core_backend_and_frontend_public_profiles_are_identical"
      - "tests/unit/api/settings/test_cr08_p1_cross_layer_contract.py::test_preset_maps_and_custom_semantics_match_across_layers"
      - "packages/web/lib/__tests__/token-profiles.test.ts"
    cross_layer_evidence:
      - "packages/core/narrare_core/llm/token_profiles.py owns the Python vocabulary and caps."
      - "apps/api/narrare/settings/token_limits/_validators.py and metadata_service.py derive public profile contracts from Core."
      - "packages/web/lib/token-profiles.ts mirrors the contract and is checked by Platform parity tests."
    cr_task: CR-AUFG-08-03
    finding: FIND-013
    phase: P1
    review_trigger: >-
      Becomes `adopted` when the P1 policy in
      docs/architecture/governance/cr-08-p1-token-limits-and-suitability-policy.md
      is implemented with frontend/backend/core parity tests.
    rationale: >-
      Formal cross-layer vocabulary drift; tracked remediation required.

  - setting_id: token_settings_ui_api_parity
    classification: user
    lifecycle: adopted
    source: >-
      Frontend TokenSettings slider max (16000); API max_tokens ceiling
      (131072); profile visibility in UI vs API schema.
    resolver_service: >-
      TokenLimitsMetadataService shared token settings metadata: profile values, preset limits,
      TOKEN_OUTPUT_ABSOLUTE_MAX=131072, UX recommended max=16000, and model cap.
    runtime_consumer: Frontend TokenSettings; API token-limit validators.
    effect_semantics: >-
      UI hard caps and profile visibility should match backend/core or be
      explicitly labelled UX-protective.
    fallback_policy: >-
      UI may keep a 16000 slider only as an explicitly labelled UX-recommended
      range and only if custom input exposes the API/model effective max.
    enforcement_evidence:
      - "tests/unit/api/settings/test_cr08_p1_token_limit_metadata.py::TestResponseCatalogueMetadata"
      - "tests/unit/api/settings/test_cr08_p1_cross_layer_contract.py::test_absolute_and_recommended_caps_match_with_ux_protective_evidence"
      - "tests/unit/api/settings/test_cr08_p1_cross_layer_contract.py::test_frontend_options_are_anchored_to_the_contract_not_a_stale_literal"
      - "packages/web/components/studio/settings/__tests__/AiTab.test.tsx"
      - "packages/web/components/studio/editor/__tests__/TokenSettings.test.tsx"
    cross_layer_evidence:
      - "Backend response metadata exposes absolute_max=131072 and ux_recommended_max=16000 from Core."
      - "Frontend settings UI labels the 16k slider as a recommended range and exposes custom numeric input above 16k."
      - "Compact editor TokenSettings refetches resolved limits after 204 writes and supports custom >16k paths."
    cr_task: CR-AUFG-08-10
    finding: FIND-013
    phase: P1
    review_trigger: Becomes `adopted` when UI/API/core cap+profile parity tests pass.
    rationale: >-
      Formal UI/API drift; FIND-013 tracks the slider-max / profile drift.

  - setting_id: model_limit_calibration
    classification: operator
    lifecycle: adopted
    source: >-
      models.dev cache / metadata snapshots; selected provider/model from DB
      settings; typed calibration source status.
    resolver_service: >-
      DefaultRunLimitResolver plus typed ModelLimitCalibration with source
      status (known_fresh, known_stale, unknown_model, offline_no_cache,
      invalid_metadata).
    runtime_consumer: >-
      ModelRegistry run/stream (caps applied); token-limit metadata calibration
      warnings and labels.
    effect_semantics: >-
      Too-high limits are now capped to known provider max; too-low/unknown/
      offline states should emit warning labels rather than imply calibration.
    fallback_policy: >-
      Cap to known fresh/stale max when available; warn on stale metadata; warn
      and do not claim calibration for unknown/offline/invalid metadata. No silent
      fake ceiling.
    enforcement_evidence:
      - "tests/unit/core/llm/test_run_limits.py::TestDefaultRunLimitResolver.test_caps_to_known_provider_max_output"
      - "tests/unit/core/llm/test_model_limit_calibration.py"
      - "tests/unit/api/settings/test_cr08_p1_token_limit_metadata.py::TestCalibrationMetadataExposure"
      - "packages/web/components/studio/settings/__tests__/AiTab.test.tsx"
      - "packages/web/components/studio/settings/__tests__/TokenMetadataWarnings.test.tsx"
    cross_layer_evidence:
      - "Core model_calibration.py exposes known_fresh/known_stale/unknown_model/offline_no_cache/invalid_metadata statuses."
      - "Backend TokenLimitsMetadataService maps calibration status into response metadata."
      - "Frontend TokenMetadataWarnings renders stale/offline/unknown/invalid labels without presenting them as calibrated."
    cr_task: CR-AUFG-08-07
    phase: P1
    review_trigger: >-
      Becomes `adopted` when too-low/unknown/offline calibration warnings are
      tested at settings/runtime boundaries.
    rationale: >-
      Capping and warning/label surfaces for known/stale/unknown/offline/invalid
      metadata are implemented and enforced across Core, Backend, and Frontend.

  - setting_id: model_suitability_policy
    classification: operator
    lifecycle: adopted
    source: >-
      Intent profiles (get_intent_profile); ResolvedModel.recommended_tier;
      provider/model capability metadata.
    resolver_service: >-
      Core model_suitability evaluator using get_intent_profile(), model
      limit metadata, requested/effective output limits, and provider usability.
    runtime_consumer: >-
      Advisory only — recommended_tier stored but does not constrain/select
      model.
    effect_semantics: >-
      Selecting a model below recommended tier should surface advisory vs
      warning vs hard block per intent tier.
    fallback_policy: >-
      Advisory for lower/unknown capability when technically usable; warning for
      stale/offline/unknown metadata or capped-but-viable output; hard block only
      unusable provider/model, non-text model, known output below intent minimum
      viable floor, or insufficient context for required input plus minimum output.
    enforcement_evidence:
      - "tests/unit/core/llm/test_model_suitability.py"
      - "tests/unit/api/settings/test_cr08_p1_token_limit_metadata.py::TestSuitabilityWarningExposure"
      - "packages/web/components/studio/settings/__tests__/TokenMetadataWarnings.test.tsx"
    cross_layer_evidence:
      - "Core model_suitability.py evaluates advisory/warning/hard_block severity from intent profile and calibration."
      - "Backend TokenLimitsMetadataService exposes suitability metadata for API/UI consumers."
      - "Frontend TokenMetadataWarnings renders suitability advisory/warning/hard block messages."
    cr_task: CR-AUFG-08-11
    phase: P1
    review_trigger: Becomes `adopted` when policy table + warning/block tests exist.
    rationale: >-
      Advisory-only drift; tracked remediation required.

  # ── P2 ────────────────────────────────────────────────────────────────────
  - setting_id: inline_suggest_cap
    classification: governed_default
    lifecycle: adopted
    source: >-
      packages/core/narrare_core/llm/run_limits.py SUGGEST_MAX_TOKENS=60.
      Consumed by apps/api/narrare/writing/deps_suggest.py and
      deps_writing.py.
    resolver_service: SUGGEST_MAX_TOKENS named constant (run_limits.py)
    runtime_consumer: Inline suggest dependency factory (max_tokens).
    effect_semantics: >-
      Caps inline suggestion length for <500ms latency target (ADR-045 D3 C).
    fallback_policy: >-
      Immutable UX cap — changing requires re-validating the 500ms latency
      target (ADR-045 D3 C).
    enforcement_evidence:
      - "packages/core/narrare_core/llm/run_limits.py (SUGGEST_MAX_TOKENS = 60 named constant with latency rationale)"
      - "tests/unit/core/llm/test_run_limits.py (assert SUGGEST_MAX_TOKENS == 60)"
    cross_layer_evidence:
      - "Core run_limits.py SUGGEST_MAX_TOKENS imported by apps/api deps_suggest.py and deps_writing.py."
    cr_task: CR-AUFG-08-04
    phase: P2
    review_trigger: >-
      Re-evaluate if the 500ms latency target (ADR-045 D3 C) is revised
      or if provider response-time profiles change significantly.
    rationale: >-
      Named UX-latency cap with rationale and regression test. Immutable
      by design — not user/operator configurable.

  - setting_id: consistency_caps
    classification: operator
    lifecycle: operator_default
    source: >-
      Operator-only fields (max_chapter_tokens, max_kb_entries).
      max_selection_words removed from API response (CR-08 P2).
    resolver_service: TokenLimitsService (operator fields)
    runtime_consumer: consistency/prompt_builder.
    effect_semantics: >-
      Caps consistency input context per chapter/KB.
      max_selection_words no longer exposed in API response.
    fallback_policy: Operator default retained; user/project exposure
      is intentionally operator-only per CR-08 P2 decision.
    enforcement_evidence:
      - "CR-08 P2: max_selection_words removed from API response schema"
      - "consistency caps are operator-only fields in TokenLimitsService"
    cross_layer_evidence: []
    cr_task: CR-AUFG-08-05
    phase: P2
    review_trigger: >-
      Becomes `adopted` if caps become user/project-tunable with API/UI
      parity. Currently documented operator-only — no misleading UI.
    rationale: >-
      Operator-only caps with no misleading UI exposure. max_selection_words
      confirmed removed from API response per CR-08 P2 implementation.

  - setting_id: setup_fallback_catalogs
    classification: operator
    lifecycle: adopted
    source: >-
      apps/api/narrare/setup/provider_service.py static fallback catalog.
      OLLAMA_DEFAULT_URL centralized in apps/api/narrare/setup/constants.py
      — all 6 hardcoded Ollama URL references replaced.
    resolver_service: setup/constants.py OLLAMA_DEFAULT_URL
    runtime_consumer: Setup provider/model listing.
    effect_semantics: >-
      Fallback model list shown when provider API unavailable. Ollama default
      URL has a single canonical source.
    fallback_policy: >-
      Must carry freshness/source labels; stale/offline fallback explicitly
      marked. OLLAMA_DEFAULT_URL change requires verifying local-first
      assumption still holds.
    enforcement_evidence:
      - "apps/api/narrare/setup/constants.py (OLLAMA_DEFAULT_URL single source)"
      - "Consumed by: provider_schemas.py, router.py, provider_service.py, user_provider_models_service.py (all 6 references use the constant)"
    cross_layer_evidence:
      - "All 6 hardcoded Ollama URLs replaced with OLLAMA_DEFAULT_URL constant from setup/constants.py."
    cr_task: CR-AUFG-08-06
    phase: P2
    review_trigger: Re-evaluate if local-first architecture assumption changes.
    rationale: >-
      All Ollama URLs centralized to single-source constant. Still a static
      fallback catalog (no dynamic freshness labels), but the stale-source
      risk from duplicated URLs is resolved.

  - setting_id: system_background_model_defaults
    classification: operator
    lifecycle: adopted
    source: >-
      apps/api/narrare/_app/dependencies_services.py
      build_system_default_config uses typed SystemModelCategory enum
      (WRITING / ANALYSIS) replacing raw "writing"/"analysis" strings.
      max_tokens 4096 retained as code default.
    resolver_service: SystemModelCategory enum + build_system_default_config
    runtime_consumer: Wiki/background task model config.
    effect_semantics: >-
      Selects model for background summarization tasks via typed
      policy-boundary enum.
    fallback_policy: Operator default; bypasses user/project resolver by design.
    enforcement_evidence:
      - "apps/api/narrare/_app/dependencies_services.py (SystemModelCategory enum, 13 callers updated)"
      - "tests/unit/api/_app/test_dependencies_services.py"
      - "tests/unit/api/settings/test_cr08_p2_system_model_resolver.py"
    cross_layer_evidence:
      - "SystemModelCategory enum replaces raw string branching — type safety at the policy boundary."
      - "13 callers across chat, kb, consistency, wiki, memory, analysis use the enum."
    cr_task: CR-AUFG-08-08
    phase: P2
    review_trigger: >-
      Re-evaluate if background task model requirements change or new
      categories are needed.
    rationale: >-
      Raw string branching replaced by typed SystemModelCategory enum.
      13 callers migrated. Regression tests verify resolver behavior.

  - setting_id: operator_default_governance
    classification: operator
    lifecycle: operator_default
    source: >-
      Centralized named constants: CATALOG_TIMEOUT=10.0, OPENROUTER_MAX_MODELS=30
      (model_listing.py); CACHE_TTL=86400, FETCH_TIMEOUT=10.0
      (models_dev_source.py); _DEFAULT_RETRY_DELAYS=[30,120,300]
      (wiki/tasks.py, embeddings/tasks.py); DEFAULT_RATES (model_pricing.py).
    resolver_service: Named constants at each module boundary
    runtime_consumer: >-
      ModelCatalogClient; cost_rates cache; wiki/embedding task retry;
      model listing; cost estimation.
    effect_semantics: >-
      Controls timeouts, catalog caps, cache freshness, retry backoff,
      and cost fallback rates.
    fallback_policy: >-
      Operator defaults with constructor/function parameter overrides.
      Fail-if-changed-without-review tests enforce review discipline.
    enforcement_evidence:
      - "packages/core/narrare_core/llm/model_listing.py (CATALOG_TIMEOUT, OPENROUTER_MAX_MODELS named constants)"
      - "packages/core/narrare_core/llm/models_dev_source.py (CACHE_TTL, FETCH_TIMEOUT named constants)"
      - "apps/api/narrare/wiki/tasks.py (_DEFAULT_RETRY_DELAYS named constant)"
      - "apps/api/narrare/embeddings/tasks.py (_DEFAULT_RETRY_DELAYS named constant)"
      - "packages/core/narrare_core/llm/model_pricing.py (DEFAULT_RATES named constant)"
      - "tests/unit/operators/test_cr08_p2_operator_defaults.py (fail-if-changed tests)"
    cross_layer_evidence:
      - "All operator defaults now have named constants and failing-if-changed-without-review tests."
    cr_task: CR-AUFG-08-12
    phase: P2
    review_trigger: >-
      Re-evaluate when provider response-time profiles, pricing cadence,
      or retry requirements change.
    rationale: >-
      All operator defaults centralized, documented, and tested as named
      constants with review triggers.

  - setting_id: profile_output_limits_defaults
    classification: governed_default
    lifecycle: governed_default
    source: >-
      packages/core/narrare_core/llm/model_config.py PROFILE_OUTPUT_LIMITS
      (quick 500, balanced 2000, long_texts 8000, comprehensive 16000).
    resolver_service: ModelRegistry profile mapping; DefaultRunLimitResolver.
    runtime_consumer: ModelRegistry run/stream via resolved output budget.
    effect_semantics: >-
      Per-profile default output token ceilings.
    fallback_policy: >-
      Acceptable as code defaults only after profile contract tests and
      provider-ceiling calibration (CR-AUFG-08-07).
    enforcement_evidence:
      - "tests/unit/core/llm/test_run_limits.py::test_comprehensive_profile_is_recognized_by_gateway_profile_mapping"
    cross_layer_evidence: []
    cr_task: CR-AUFG-08-07
    phase: P2
    review_trigger: Re-evaluate when provider ceilings change or profiles are re-tuned.
    rationale: >-
      Code-default output profiles are consumed at the model boundary and covered
      by CR-AUFG-08-07 calibration evidence.

  - setting_id: resolved_model_config_fallback
    classification: operator
    lifecycle: covered_by_existing
    source: >-
      ResolvedModelConfig.max_tokens=4096 fallback (model_config.py);
      Settings.default_max_tokens.
    resolver_service: DefaultRunLimitResolver
    runtime_consumer: ModelRegistry run/stream.
    effect_semantics: >-
      Last-resort output ceiling when no profile/override resolved.
    fallback_policy: >-
      Must not be the only enforcement path — covered by output_limit_enforcement.
    enforcement_evidence:
      - "tests/unit/core/llm/test_run_limits.py::TestModelRegistryLimitEnforcement"
    cross_layer_evidence: []
    cr_task: CR-AUFG-08-01
    phase: P0
    rationale: >-
      Delegated to output_limit_enforcement (FIND-001 resolved); the fallback
      is no longer the sole enforcement path. No duplicate task.

  - setting_id: provider_inference_prefixes
    classification: governed_default
    lifecycle: governed_default
    source: >-
      packages/core/narrare_core/llm/_providers/registry.py provider inference
      prefixes.
    resolver_service: Explicit provider resolver (runtime path).
    runtime_consumer: Provider registry inference (dev/debug only).
    effect_semantics: >-
      Infers provider from model id prefix for dev/debug convenience.
    fallback_policy: >-
      Acceptable only for dev/debug inference; runtime resolver uses explicit
      provider.
    enforcement_evidence: []
    cross_layer_evidence: []
    phase: P2
    review_trigger: >-
      immutable — inference prefixes are dev/debug-only; runtime resolver
      uses explicit provider from settings. No re-evaluation needed.
    rationale: >-
      Governed utility default; runtime resolver uses explicit provider, so
      inference is dev/debug convenience only.

  - setting_id: cost_rate_fallback_defaults
    classification: operator
    lifecycle: operator_default
    source: >-
      packages/core/narrare_core/llm/cost_rates.py DEFAULT_RATES (from
      model_pricing.py); Settings.cost_rates_json operator override.
