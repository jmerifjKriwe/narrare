# =============================================================================
# Narrare Status Vocabulary (ADR-062 P3 — Status SSOT Consistency)
# =============================================================================
# The reconciliation anchor for doc↔status-SSOT consistency. Derived status
# surfaces (CURRENT_STATE.md, docs/features/INDEX.md, feature specs) make free-
# text status claims about subjects; this vocabulary normalizes those claims to
# canonical tokens and declares which token pairs are contradictions, so a
# checker can fail when two surfaces (or a surface and the authoritative SSOT
# status) disagree about the same subject.
#
# WARNING-only this cycle (ADR-062): the checker reports contradictions but
# never fails the gate. Ratchets to blocking in a follow-up once the baseline
# is proven stable.
#
# Design principles (per ADR-062 Decision P3):
#   * Seed the contradiction table CONSERVATIVELY — only clear contradictions,
#     to avoid false positives during the warning phase.
#   * Governed subjects are an explicit allowlist (high precision): only known
#     subjects are reconciled, so incidental prose does not generate noise.
#   * `ssot_status` per subject is the authoritative adoption status curated by
#     Architecture (the single status SSOT the ADR designates); derived docs
#     reconcile against it or contradict.
#
# ADR: docs/architecture/decisions/ADR-062-governance-drift-phase2-status-ssot.md
# Loaded by: scripts/governance/_status_vocab.py
# =============================================================================

version: "1.0.0"
adr: "ADR-062"

# ── Canonical status tokens and the raw phrases that normalize to each ───────
# Matching is case-insensitive on the normalized (lowercased, collapsed) phrase.
# A phrase not listed here is ignored (no claim extracted) — this is the
# conservative precision guard.
status_terms:
  runtime_verified:
    - runtime-verified
    - runtime verified
    - runtime_verified
  adopted:
    - adopted
  stable:
    - stable
  governed_debt:
    - governed debt
    - governed_debt
    - governed-debt
  pending:
    - pending
  # "static-verified-only" / "static verified only" — the explicit "pending
  # runtime evidence" hedge. Bare "static verified" (without "only") is NOT
  # mapped: a feature can be both static- and runtime-verified (progression).
  static_only:
    - static-verified-only
    - static verified only
    - static-verified only

# ── Contradiction pairs ──────────────────────────────────────────────────────
# Both tokens cannot be true for the same subject at the same time. Symmetric.
# Seeded conservatively: only adoption-state vs debt/pending contradictions.
contradictions:
  - [runtime_verified, governed_debt]
  - [adopted, governed_debt]
  - [stable, governed_debt]
  - [runtime_verified, pending]
  - [runtime_verified, static_only]

# ── Governed subjects ────────────────────────────────────────────────────────
# Only these subjects are reconciled (high precision). `ssot_status` is the
# authoritative adoption status for the subject; derived docs must not
# contradict it.
subjects:
  character_voice:
    ssot_status: runtime_verified
  voice_check:
    ssot_status: adopted

# ── Allowlist ───────────────────────────────────────────────────────────────
# Explicit (subject, doc_path_substring) pairs to suppress a contradiction for
# legitimately nuanced per-doc phrasing. Seeded empty — the baseline is clean.
# Format:
#   - subject: character_voice
#     doc: docs/features/some-spec.md
#     reason: "..."
allowlist: []
