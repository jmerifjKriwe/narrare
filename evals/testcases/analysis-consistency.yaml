# Analysis Consistency prompt evaluation
# Tests cross-chapter consistency checking
# Prompt source: packages/core/narrare_core/prompts/_bundled/analysis/en/consistency/system.md
# NOTE: Keep inline prompt in sync with the production bundled prompt.
description: "Analysis Consistency — Cross-Chapter Contradiction Detection"

prompts:
  - id: "analysis-consistency"
    raw: |
      You are a consistency checker for a creative writing project. Your job is to detect contradictions and inconsistencies across chapters and entity data.

      ### Check Types

      - **character**: Behavior, voice, knowledge, abilities, physical descriptions.
      - **timeline**: Event sequencing, durations, ages, temporal markers.
      - **world**: Location properties, system rules, faction relationships, geography.
      - **plot**: Cause/effect chains, character motivations, setup/payoff, loose ends.

      ### Your Task

      Compare facts extracted from the chapter prose against the provided KB entity data and across chapters. Identify contradictions with severity ratings:
      - **error**: Impossible contradiction (e.g., character alive in one chapter, dead in next).
      - **warning**: Likely inconsistency (e.g., personality trait contradicts behavior).
      - **info**: Minor discrepancy (e.g., slight age mismatch that might be intentional).

      ### Input Context

      <user_provided_text>
      {{chapter_texts}}
      </user_provided_text>
      {{kb_entities}}
      Check types: {{check_types}}

      ### Output Format

      Return a JSON object with:
      - `issues`: List of issues found, each with:
        - `check_type`: "character" | "timeline" | "world" | "plot"
        - `severity`: "error" | "warning" | "info"
        - `description`: What the contradiction is
        - `locations`: Which chapters/entities are involved
        - `conflicting_facts`: The conflicting facts
        - `suggestion` (optional): How to resolve
        - `confidence`: 0.0-1.0
      - `overall_assessment`: 1-2 sentence summary of consistency health.
      - `checked_types`: Which check types were actually executed.

      ### Quality Rules

      - Be thorough but fair — not every difference is an inconsistency.
      - Allow for intentional ambiguity, character development, and unreliable narration.
      - Severity "error" = confirmed contradiction that needs fixing.
      - Severity "warning" = likely issue that should be reviewed.
      - Severity "info" = subtle note the author might want to consider.

providers:
  - "openai:gpt-4o-mini"

tests:
  # Test Case 1: Timeline contradiction across two chapters
  # Evaluates: error detection, severity classification, specific conflicting facts
  - vars:
      chapter_texts: |
        ## Chapter 3: The Gathering

        Elena had been studying magic for three months now — ever since the incident at the Saltwood Market that had awakened her abilities. She still couldn't control the fire spells reliably, but the water charms came naturally. Her mentor, old Fenwick, said she was progressing faster than any student he'd seen in forty years of teaching.

        "Three months is nothing," Fenwick had told her that morning, pouring tea in his cramped office above the bookshop. "Most mages take a year just to light a candle. You summoned a waterspout in your first week."

        ## Chapter 7: The Saltwood Covenant

        Elena pressed her back against the cold stone of the archive. She had been honing her magical abilities for over a year now — ever since she first sensed the strange warmth in her fingertips during a thunderstorm in Thornwall. The market incident had been her public awakening, but the truth was she'd been practicing in secret for months before that.
      kb_entities: |
        Elena — Protagonist, young mage
        Fenwick — Elena's mentor, retired mage, runs a bookshop
      check_types: "character, timeline"
      user_preferences: ""
      avoidance_patterns: "None"
      language: "English"
    assert:
      - type: llm-rubric
        value: |
          The consistency check should:
          1. Return valid JSON with "issues" array, "overall_assessment", and "checked_types"
          2. Detect the TIMELINE contradiction: Chapter 3 says Elena has been studying for "three months" while Chapter 7 says "over a year"
          3. Classify this as severity "error" (impossible contradiction — either 3 months or 1+ years, not both)
          4. Include the conflicting_facts with quotes from both chapters
          5. List "Chapter 3" and "Chapter 7" in locations
          6. set check_type to "timeline" for this issue
          7. Optionally flag the character inconsistency about when Elena first awakened (market incident vs. thunderstorm)
          8. Include at least one suggestion for how to resolve the timeline contradiction
        threshold: 0.7
      - type: not-contains
        value: "I'm sorry"
      - type: not-contains
        value: "As an AI"

  # Test Case 2: Character behavior inconsistency
  # Evaluates: character consistency, severity calibration, fair assessment
  - vars:
      chapter_texts: |
        ## Chapter 5: The Council's Shadow

        Lord Voss entered the chamber without knocking — a habit his aides had long since stopped trying to correct. He was not a man who waited for permission. His cold eyes swept the room, cataloguing every face, every shifted posture.

        "We have a security breach," he said, his voice flat and emotionless. "Someone in this room has been feeding information to the resistance. I want to know who." He placed both palms flat on the table and leaned forward. "And I always find out."

        ## Chapter 9: The Reckoning

        Lord Voss paced behind his desk, his face flushed with rage. "I trusted you!" he screamed at Corwin, spittle flying from his lips. His hands trembled as he gripped the edge of the desk. "Everything I built — everything our family stood for — and you threw it away for a pack of rebels!" He swept the documents from his desk in a single violent gesture.
      kb_entities: |
        Lord Voss — Antagonist, head of the Magic Council, cold and calculating
        Corwin — Lord Voss's estranged son, member of the Saltwood Resistance
      check_types: "character"
      user_preferences: ""
      avoidance_patterns: "None"
      language: "English"
    assert:
      - type: llm-rubric
        value: |
          The consistency check should:
          1. Return valid JSON with "issues" array and "overall_assessment"
          2. Flag the CHARACTER inconsistency: Lord Voss is described as "flat and emotionless" with "cold eyes" in Chapter 5, but is "flushed with rage" and "screaming" in Chapter 9
          3. Note that this COULD be explained as character development (a cold man pushed to breaking point by his son's betrayal) — so severity should be "warning" or "info" rather than "error"
          4. Include conflicting_facts quoting from both chapters
          5. The overall_assessment should acknowledge both the inconsistency and the possible justification
          6. Be fair and thorough — not every difference is a true contradiction
        threshold: 0.7
      - type: not-contains
        value: "I'm sorry"
      - type: not-contains
        value: "As an AI"
