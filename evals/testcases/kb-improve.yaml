# KB Improve prompt evaluation
# Tests quality of KB entry improvement suggestions
# Prompt source: packages/core/narrare_core/prompts/_bundled/kb/en/improve/system.md
# NOTE: Keep inline prompt in sync with the production bundled prompt.
description: "KB Improve — Entry Improvement Analysis"

prompts:
  - id: "kb-improve"
    raw: |
      You are a Knowledge Base improvement analyst. Your job is to **analyze** an existing KB entry and identify specific, actionable improvement opportunities. You do NOT generate content — you identify what's missing, weak, or could be better.

      ### Context

      #### Entity Type

      {{entity_type}}

      #### Template Structure

      The entity being analyzed should follow this template structure:

      {{template_structure}}

      #### Current Entry Content

      Here is the existing entry content:

      <user_provided_text>
      {{entry_content}}
      </user_provided_text>

      #### Existing Relationships

      Current connections to other entities:

      {{existing_relationships}}

      #### World Context

      Related KB entities already in the database:

      {{world_context}}

      ### Output Format

      Return a JSON object with this structure:

      ```json
      {
        "suggestions": [
          {
            "type": "add_field" | "connect" | "expand" | "reorganize",
            "target": "<field_key or entity_name>",
            "description": "<what needs improvement and why>",
            "confidence": 0.0-1.0,
            "reasoning": "<why this suggestion matters>"
          }
        ],
        "overall_assessment": "<1-2 sentence summary>",
        "completeness_score": 0.0-1.0
      }
      ```

      ### Quality Rules

      - Maximum 8 suggestions per analysis — be selective.
      - Minimum confidence threshold: 0.6.
      - Never suggest removing content — only additions and improvements.
      - List suggestions sorted by confidence (highest first).
      - Do NOT fabricate entity names that don't exist.

providers:
  - "openai:gpt-4o-mini"

tests:
  # Test Case 1: Sparse character entry with obvious gaps
  # Evaluates: completeness detection, suggestion quality, confidence calibration
  - vars:
      entity_type: "character"
      template_structure: |
        name: string (required)
        role: string (required)
        description: string
        appearance: string
        personality: string
        motivations: string
        abilities: string
        backstory: string
        relationships: list
      entry_content: |
        Name: Elena
        Role: Protagonist, young mage
        Description: A young woman who recently discovered she has magical abilities.
      existing_relationships: "None recorded"
      world_context: |
        Lord Voss — Antagonist, head of the Magic Council
        The Magic Council — Governing body that banned magic
        Thornwall — Capital city where the Council operates
        The Saltwood Resistance — Underground opposition group
      user_preferences: "Detailed, dark fantasy tone"
      avoidance_patterns: "None"
    assert:
      - type: llm-rubric
        value: |
          The analysis should:
          1. Return valid JSON with "suggestions" array, "overall_assessment", and "completeness_score"
          2. Identify that appearance, personality, motivations, abilities, and backstory are empty — suggest "add_field" for the most important ones
          3. Suggest "connect" to link Elena to Lord Voss (antagonist relationship) and the Saltwood Resistance
          4. Suggest "expand" for the vague description — "A young woman who recently discovered she has magical abilities" is too generic
          5. Each suggestion should have type, target, description, confidence, and reasoning
          6. Confidence should be ≥ 0.6 for all suggestions
          7. completeness_score should be low (0.2-0.4 range) given how sparse the entry is
          8. Maximum 8 suggestions — be selective
          9. Only reference entities that exist in world_context
        threshold: 0.7
      - type: not-contains
        value: "I'm sorry"
      - type: not-contains
        value: "As an AI"

  # Test Case 2: Moderately complete location entry
  # Evaluates: identifying subtler gaps, connection suggestions, fair completeness scoring
  - vars:
      entity_type: "location"
      template_structure: |
        name: string (required)
        type: string (required)
        description: string
        atmosphere: string
        history: string
        notable_features: list
        connected_locations: list
        factions: list
        dangers: string
      entry_content: |
        Name: The Crystal Spire
        Type: Government tower
        Description: A towering structure of enchanted crystal in the heart of Thornwall. Home to the Magic Council's chambers and the vault of forbidden artifacts. The Spire's crystal walls shimmer with residual magic, casting prismatic light across the Council plaza below.
        Atmosphere: Imposing, sterile, crackling with suppressed magical energy
        Notable Features: Council chambers at the peak, artifact vault in the basement, enchanted wards
      existing_relationships: |
        - Located in: Thornwall
        - Operated by: The Magic Council
      world_context: |
        Lord Voss — Head of the Magic Council, resides in the Spire
        Elena — Protagonist, recently infiltrated the Spire
        The Saltwood Resistance — Planning an operation against the Spire
        Thornwall — Capital city where the Spire is located
        The Sewers — Underground passages leading to the Spire's foundations
      user_preferences: "Gritty, detailed worldbuilding"
      avoidance_patterns: "None"
    assert:
      - type: llm-rubric
        value: |
          The analysis should:
          1. Return valid JSON with "suggestions" array, "overall_assessment", and "completeness_score"
          2. Note that history, dangers, connected_locations, and factions fields are empty or incomplete — suggest appropriate improvements
          3. Suggest "connect" to link the Spire to Elena (she infiltrated it) and the Saltwood Resistance (they're planning against it)
          4. Possibly suggest "connect" to the Sewers (connected via underground passages)
          5. completeness_score should be moderate (0.4-0.6) — some fields are filled well but several are empty
          6. Suggestions should be specific and reference the existing content, not generic
          7. Only reference entities that exist in world_context
          8. Do NOT suggest removing existing content
        threshold: 0.7
      - type: not-contains
        value: "I'm sorry"
      - type: not-contains
        value: "As an AI"
