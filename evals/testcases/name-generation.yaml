# Name generation prompt evaluation
# Tests quality and diversity of generated names
description: "Name Generation — Culture-Specific Names"

prompts:
  - id: "name-gen-fantasy"
    raw: |
      Generate {{count}} unique {{type}} names for a {{genre}} setting.
      Culture: {{culture}}

      For each name provide:
      - Name
      - Pronunciation guide
      - Brief meaning/etymology (1 sentence)

providers:
  - "openai:gpt-4o-mini"

tests:
  - vars:
      count: 5
      type: "character"
      genre: "high fantasy"
      culture: "celtic-inspired"
    assert:
      - type: llm-rubric
        value: "Names should: 1) Sound phonetically distinct from each other 2) Include pronunciation guide 3) Have plausible etymology 4) Feel authentic to the specified culture 5) Not be obvious real-world names"
        threshold: 0.7
      - type: not-contains
        value: "I cannot"

  - vars:
      count: 3
      type: "location"
      genre: "dark fantasy"
      culture: "norse-inspired"
    assert:
      - type: llm-rubric
        value: "Location names should: 1) Evocative and atmospheric 2) Consistent with dark fantasy tone 3) Linguistically coherent 4) Not generic English place names"
        threshold: 0.7

  - vars:
      count: 5
      type: "character"
      genre: "modern"
      culture: "contemporary western"
    assert:
      - type: llm-rubric
        value: "Names should: 1) Be realistic for contemporary settings 2) Include diverse cultural backgrounds 3) Not all be common top-100 names 4) Include pronunciation for uncommon names"
        threshold: 0.7
