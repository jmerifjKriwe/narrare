# Chapter summarization prompt evaluation
# Tests quality of chapter summaries for storyboard and planning
description: "Chapter Summarization — Summary Quality"

prompts:
  - id: "chapter-summary"
    raw: |
      Summarize the following chapter concisely. Include:
      - Main plot developments (2-3 key events)
      - Character arcs (who changed and how)
      - Unresolved tensions or cliffhangers

      Chapter text:
      {{chapter_text}}

providers:
  - "openai:gpt-4o-mini"

tests:
  - vars:
      chapter_text: |
        The old lighthouse keeper climbed the spiral staircase for the last time.
        Thirty years of watching ships navigate the treacherous rocks below, and now
        the automated system was replacing him. His hands traced the brass telescope
        mount, remembering the night he'd spotted the foundering schooner through the fog.
        He'd saved twelve lives that night, or so the newspaper said. The truth was more
        complicated — he'd been too slow to light the lamp, and the ship had nearly
        foundered because of his mistake. The rescue had been luck, not skill.
        Now the fog was rolling in again, thicker than he'd ever seen it, and the new
        automated light flickered once, twice, then went dark.
    assert:
      - type: llm-rubric
        value: "Summary should: 1) Identify the keeper's internal conflict (guilt vs. public hero image) 2) Note the foreshadowing (light going dark) 3) Mention the automation theme 4) Be concise (under 100 words) 5) Capture the mood (melancholic, ominous)"
        threshold: 0.7
      - type: not-contains
        value: "As an AI"

  - vars:
      chapter_text: |
        Captain Elara Vance stared at the star chart, tracing the route to Kepler-442b
        with her finger. Behind her, the crew debated in hushed tones. Martinez wanted
        to turn back — they'd lost contact with Earth six months ago, and the food
        recyclers were failing. Chen argued they had no choice but to continue;
        the planet was their only hope. But Elara knew something they didn't: the signal
        from Kepler-442b wasn't a distress call. It was a warning. She folded the
        star chart and made her decision. "We go forward," she said, her voice steady
        despite the lie she was telling. "We have no other choice."
    assert:
      - type: llm-rubric
        value: "Summary should: 1) Identify Elara's deception as the central tension 2) Note the crew division (Martinez vs Chen) 3) Mention the signal revelation 4) Capture the cliffhanger 5) Be concise and well-structured"
        threshold: 0.7
