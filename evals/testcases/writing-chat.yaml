# Writing Chat prompt evaluation
# Tests scope boundaries of the writing craft assistant
# Prompt source: packages/core/narrare_core/prompts/_bundled/writing/en/chat/system.md
# NOTE: Keep inline prompt in sync with the production bundled prompt.
description: "Writing Chat — Scope Compliance and Craft Quality"

prompts:
  - id: "writing-chat"
    raw: |
      You are a writing craft assistant embedded in Narrare, an AI-powered creative writing tool. Your role is to help authors think through their writing — not to write prose for them.

      ### Your Scope

      You answer questions about:

      1. **The author's project:** Characters, plot, worldbuilding, consistency, structure, and any other aspect of their current novel.
      2. **General writing craft:** Dialogue technique, show-vs-tell, pacing, point of view, scene structure, voice, revision strategy, and other craft topics.

      You do NOT answer:

      - Questions unrelated to writing (history, science, coding, current events)
      - Personal advice, therapy, or counseling — if the user shares emotional content, acknowledge with brief empathy ("I hear you") and redirect to writing
      - Questions asking you to write large sections of prose (use the writing features instead)

      If a question is outside your scope, gently redirect: "I'm here to help with your writing. Shall I help with a craft question instead?"

      ### Project Context

      - Project: {{project_title}}
      - Genre: {{genre}}
      - Language: {{language}}

      Characters in this project:
      {{kb_characters}}

      Key locations:
      {{kb_locations}}

      ### Guidelines

      - Ground your answers in the project context when relevant. Use the KB entities to give specific, actionable advice.
      - For general craft questions, provide knowledgeable guidance with examples from the author's own project when possible.
      - If the author's question is vague or unclear, ask clarifying questions.
      - You are a discussion partner, not an oracle. Offer perspectives, explore possibilities, and help the author reach their own conclusions.
      - Do not write prose for the author unless they explicitly ask for a short example (1-3 sentences) to illustrate a craft point.
      - If the author becomes emotional about their writing or creative struggles, that IS within scope — discuss craft confidence, overcoming blocks, and creative process.
      - Only non-writing personal topics are out of scope.

providers:
  - "openai:gpt-4o-mini"

tests:
  # Test Case 1: In-scope writing question — should answer helpfully
  # Evaluates: craft knowledge, project-grounded advice, conversational quality
  - vars:
      project_title: "The Thornwall Chronicles"
      genre: "fantasy"
      language: "English"
      kb_characters: |
        Elena — Young mage, protagonist
        Lord Voss — Head of the Magic Council, antagonist
        Corwin — Voss's estranged son, Resistance member
      kb_locations: |
        Thornwall — Capital city
        Crystal Spire — Council headquarters
      conversation_history: ""
      user_message: "I'm struggling with Elena's character arc. She's been passive for the last few chapters — things keep happening TO her. How do I give her more agency without making the transition feel sudden?"
    assert:
      - type: llm-rubric
        value: |
          The response should:
          1. Address the craft question directly — discuss character agency and how to build it gradually
          2. Reference Elena specifically and the established story context (her hidden powers, the Council, the Resistance)
          3. Provide actionable techniques for increasing character agency (small decisions that build to bigger ones, internal motivations driving external action, etc.)
          4. Be conversational and collaborative, not lecturing
          5. NOT write prose for the author (no full paragraphs of suggested narrative)
          6. Stay firmly within scope — this is a writing craft question about the author's project
          7. NOT contain refusal language ("I can't help with that")
        threshold: 0.7
      - type: not-contains
        value: "I'm sorry"
      - type: not-contains
        value: "As an AI"
      - type: not-contains
        value: "I'm here to help with your writing"

  # Test Case 2: Out-of-scope question — should redirect
  # Evaluates: scope boundary enforcement, polite redirection
  - vars:
      project_title: "The Thornwall Chronicles"
      genre: "fantasy"
      language: "English"
      kb_characters: |
        Elena — Young mage, protagonist
        Lord Voss — Head of the Magic Council, antagonist
      kb_locations: |
        Thornwall — Capital city
      conversation_history: ""
      user_message: "What's the capital of France? I'm trying to settle a bet with my friend."
    assert:
      - type: llm-rubric
        value: |
          The response should:
          1. Politely redirect the user to writing-related topics
          2. NOT answer the factual question about France's capital
          3. Use a gentle tone, not scolding or robotic
          4. Offer to help with a writing question instead
          5. Keep the redirect brief — do not lecture about scope
          6. The redirect should feel natural, not like an error message
        threshold: 0.7
      - type: not-contains
        value: "Paris"

  # Test Case 3: Emotional writing struggle — should engage (within scope)
  # Evaluates: creative process support, empathy, craft-focused redirection
  - vars:
      project_title: "Dead Signal"
      genre: "science fiction"
      language: "English"
      kb_characters: |
        Captain Vance — Commander of the colony ship Meridian
        Martinez — Navigation officer
      kb_locations: |
        The Meridian — Colony ship
      conversation_history: ""
      user_message: "I've been staring at a blank page for three days. I just can't seem to write the confrontation scene between Vance and Martinez. Every time I try, it comes out flat and I delete it all. I'm starting to think I'm not cut out for this."
    assert:
      - type: llm-rubric
        value: |
          The response should:
          1. Acknowledge the emotional struggle with brief empathy — this IS within scope (creative struggles are writing-related)
          2. NOT give personal therapy or counseling — keep it focused on the creative process
          3. Offer practical craft advice for overcoming the block (e.g., write the scene from a different angle, lower the stakes for the draft, write the dialogue first, etc.)
          4. Reference the specific characters and context (Vance and Martinez, their conflict about the truth)
          5. Be encouraging but not patronizing
          6. Help the author move forward with the specific scene they're stuck on
          7. NOT redirect away from this topic — emotional struggles about writing are in scope
        threshold: 0.7
      - type: not-contains
        value: "I'm sorry"
      - type: not-contains
        value: "As an AI"
      - type: not-contains
        value: "I'm here to help with your writing. Shall I help with a craft question"
