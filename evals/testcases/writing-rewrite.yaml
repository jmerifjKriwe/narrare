# Writing rewrite prompt evaluation
# Tests the quality of selection rewriting (rewrite mode)
# Covers: tone shift, show-don't-tell fix, voice matching
description: "Writing Rewrite — Selection Rewrite Quality"

prompts:
  - id: "writing-rewrite"
    raw: |
      You are a precise text revision specialist. Your role is to rewrite specific portions of text based on the author's direction while preserving their established voice, style, and narrative consistency.

      ### Context

      - Project: {{project_title}}
      - Genre: {{genre}}
      - Language: {{language}}

      ### Text to Rewrite

      **Text before selection:**
      {{context_before}}

      **Selection to rewrite:**
      {{selection_text}}

      **Text after selection:**
      {{context_after}}

      ### Rewrite Instructions

      {{rewrite_mode_instructions}}

      ### Output Format

      You MUST produce exactly {{count}} alternative(s). Wrap each alternative in `<alternative>` tags with a descriptive label:

      ```
      <alternative label="Descriptive label for this version">
      [Rewritten text here]
      </alternative>
      ```

      **CRITICAL TAG RULES:**
      - You MUST NOT use `<alternative>` or `</alternative>` tags anywhere inside the rewritten text content
      - These tags are ONLY used as structural delimiters between alternatives

      Use a `<scratchpad>` to analyze the original text and plan your revision strategy before writing. Then output the alternative(s) — no commentary or explanation needed.

      ### Constraints

      - Write in {{language}}
      - Match the rhythm and register of the surrounding context

providers:
  - "openai:gpt-4o-mini"

tests:
  # Test Case 1: Tone shift — make dramatic
  # Evaluates: emotional register shift, preservation of content, style matching
  - vars:
      project_title: "The Glass Garden"
      genre: "literary fiction"
      language: "English"
      context_before: "Maren stepped into the greenhouse. The air was thick, humid, smelling of earth and something sweeter — jasmine, maybe, or night-blooming cereus."
      selection_text: |
        She walked past the rows of orchids without really seeing them. Her mind was elsewhere, on the letter she'd left unanswered on the kitchen counter, on the things she should have said years ago. The garden had always been her mother's domain, and being here felt like trespassing in someone else's memory.
      context_after: "At the far end, past the bromeliads, a single glass sculpture caught the afternoon light — a rose, frozen mid-bloom, its petals sharp enough to cut."
      rewrite_mode_instructions: "Adjust the emotional language, pacing, and word choice to make the passage more dramatic. Build tension through heightened emotional stakes and vivid imagery while preserving the underlying meaning and narrative structure."
      count: "1"
    assert:
      - type: llm-rubric
        value: |
          Rate the rewritten text on these criteria:
          1. Does it shift the tone to be more dramatic while keeping the same scene and events?
          2. Does it preserve the character (Maren), setting (greenhouse/garden), and key details (letter, mother)?
          3. Does it avoid changing the narrative perspective (third person)?
          4. Does the emotional register feel genuinely heightened, not melodramatic?
          5. Does it match the rhythm and register of the surrounding context?
          6. Is it wrapped in an `<alternative>` tag with a descriptive label?
        threshold: 0.7
      - type: not-contains
        value: "I'm sorry"
      - type: not-contains
        value: "As an AI"
      - type: not-contains
        value: "Here is the rewritten"
      - type: not-contains
        value: "I've rewritten"

  # Test Case 2: Show-don't-tell fix
  # Evaluates: converting telling into showing, maintaining voice, strengthening prose
  - vars:
      project_title: "Ember Tide"
      genre: "fantasy"
      language: "English"
      context_before: "The tavern was crowded tonight. Renna found a seat in the corner where she could watch the door."
      selection_text: |
        She felt nervous about the meeting. The stranger had said noon, but it was already past that. She was worried he wouldn't come. She thought about leaving but decided to wait a bit longer. The ale in front of her was getting warm.
      context_after: "The door swung open, letting in a gust of November air and a figure she didn't recognize."
      rewrite_mode_instructions: "Apply show-don't-tell techniques, remove redundancies, strengthen weak verbs, and fix awkward phrasing. Improve clarity and impact without changing the meaning or adding new content."
      count: "1"
    assert:
      - type: llm-rubric
        value: |
          Rate the rewritten text on these criteria:
          1. Does it convert "felt nervous" and "was worried" into concrete actions and sensory details?
          2. Does it eliminate weak verbs (was, felt, thought about) in favor of stronger ones?
          3. Does it show the character's anxiety through behavior rather than stating it?
          4. Does it maintain the fantasy tavern setting and not introduce new elements?
          5. Is it wrapped in an `<alternative>` tag with a descriptive label?
          6. Does it avoid using `<alternative>` tags within the prose content?
        threshold: 0.7
      - type: not-contains
        value: "I'm sorry"
      - type: not-contains
        value: "As an AI"
      - type: not-contains
        value: "felt nervous"

  # Test Case 3: Voice matching — rewrite in character voice
  # Evaluates: character voice consistency, speech pattern application
  - vars:
      project_title: "The Ruby Protocol"
      genre: "thriller"
      language: "English"
      context_before: |
        Kira leaned against the wall of the parking garage, checking her watch for the third time. The concrete was cold through her jacket.
      selection_text: |
        "I don't think we should proceed with this plan. It seems quite dangerous and I have concerns about our safety. Perhaps we should reconsider our approach and find an alternative solution."
      context_after: "Manny studied her face for a long moment, then nodded slowly."
      rewrite_mode_instructions: "Rewrite using the character's established speech patterns — terse, clipped, no wasted words. The character speaks in short sentences, uses contractions, and avoids hedging language."
      count: "2"
    assert:
      - type: llm-rubric
        value: |
          Rate the rewritten text on these criteria:
          1. Does the dialogue sound terse and clipped rather than formal and hedging?
          2. Does it eliminate hedging phrases like "I think", "perhaps", "quite"?
          3. Does it use contractions and short sentences?
          4. Does it preserve the core meaning (objection to the plan due to danger)?
          5. Are there exactly 2 alternatives wrapped in `<alternative>` tags?
          6. Do the labels on the alternatives meaningfully describe each version?
        threshold: 0.7
      - type: not-contains
        value: "I'm sorry"
      - type: not-contains
        value: "As an AI"
      - type: not-contains
        value: "Perhaps we should"
