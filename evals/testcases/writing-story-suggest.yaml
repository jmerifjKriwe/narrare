# Writing Story Suggest prompt evaluation
# Tests quality of story direction suggestions
# Prompt source: packages/core/narrare_core/prompts/_bundled/writing/en/story_suggest/system.md
# NOTE: Keep inline prompt in sync with the production bundled prompt.
description: "Writing Story Suggest — Narrative Direction Quality"

prompts:
  - id: "writing-story-suggest"
    raw: |
      You are a creative writing consultant. Your role is to generate targeted suggestions for the author's story — plot developments, character moments, dialogue options, or stylistic alternatives — that align with the established narrative and the author's vision.

      ### Context

      - Project: {{project_title}}
      - Genre: {{genre}}
      - Language: {{language}}

      ### Knowledge Base

      Characters:
      {{kb_characters}}

      Locations:
      {{kb_locations}}

      ### Recent Chapters

      {{recent_chapters}}

      ### Instructions

      Generate suggestions based on the current story context. Follow these guidelines:

      1. Use a <scratchpad> to analyze the story's current state, identify open threads, and map potential directions
      2. Provide 3-5 distinct suggestions, each taking a different narrative approach
      3. For each suggestion, explain briefly how it connects to established plot threads
      4. Prioritize suggestions that resolve existing tensions or develop established characters
      5. Avoid suggestions that would require introducing new characters or settings

      Chapter outline: {{chapter_outline}}
      Author instructions: {{author_instructions}}
      Tone: {{tone_instructions}}

      ### Output Format

      Use a `<scratchpad>` to analyze the narrative and identify 3-5 possible directions. Then output a JSON array of suggestions:

      ```json
      {
        "suggestions": [
          {
            "type": "plot_development" | "character_moment" | "dialogue_option" | "world_detail" | "stylistic_alternative",
            "title": "Brief descriptive title",
            "description": "One-paragraph description of the suggestion",
            "connection": "How this connects to established plot threads"
          }
        ]
      }
      ```

      ### Do NOT

      - Do NOT suggest introducing new major characters or settings
      - Do NOT contradict established facts from recent chapters
      - Do NOT suggest generic plot devices ("a mysterious stranger arrives")
      - Do NOT ignore the author's stated direction or genre conventions
      - Do NOT provide suggestions that resolve tension too neatly — maintain narrative interest

providers:
  - "openai:gpt-4o-mini"

tests:
  # Test Case 1: Fantasy story with established characters and open threads
  # Evaluates: suggestion diversity, connection to established plot, type variety
  - vars:
      project_title: "The Thornwall Chronicles"
      genre: "fantasy"
      language: "English"
      kb_characters: |
        Elena — Young mage, protagonist, recently discovered powers
        Lord Voss — Head of the Magic Council, antagonist, banned all magic
        Corwin — Lord Voss's estranged son, member of the Saltwood Resistance
        Fenwick — Elderly mentor, retired mage, runs a bookshop
      kb_locations: |
        Thornwall — Capital city, seat of the Magic Council
        Saltwood Archive — Hidden library beneath the city
        Crystal Spire — Council headquarters, supposedly impervious to magic
      recent_chapters: |
        Ch 7: Elena and Corwin meet in the Saltwood Archive. Corwin reveals the Resistance's plan to infiltrate the Crystal Spire through the ancient sewers. Elena's magic could bypass the Spire's wards, which were designed to keep magic out, not in. Corwin asks Elena to join the operation.
      chapter_outline: "Elena must decide whether to join the Resistance's dangerous mission. If she agrees, she'll need to train with Corwin to combine her magic with the Resistance's tactics."
      author_instructions: "Focus on Elena's internal conflict — she's been hiding her powers, and this mission would mean revealing them to many people. The theme is about choosing between safety and doing what's right."
      tone_instructions: "Tense, character-driven, morally complex"
      user_preferences: ""
      avoidance_patterns: "None"
    assert:
      - type: llm-rubric
        value: |
          The suggestions should:
          1. Return valid JSON with a "suggestions" array containing 3-5 items
          2. Each suggestion should have a "type" from: plot_development, character_moment, dialogue_option, world_detail, stylistic_alternative
          3. Provide at least 2 different types of suggestions (not all the same type)
          4. Each suggestion should have a clear "connection" explaining how it links to established plot threads (Elena's hidden powers, the Resistance, the Spire infiltration)
          5. NOT suggest introducing new characters — only work with Elena, Voss, Corwin, Fenwick
          6. NOT contradict established facts (magic is banned, Spire wards block external magic, Corwin is Voss's son)
          7. Include at least one suggestion addressing Elena's internal conflict (safety vs. doing what's right)
          8. Use a <scratchpad> section for analysis before the JSON
          9. NOT resolve tension too neatly — maintain narrative interest
        threshold: 0.7
      - type: not-contains
        value: "I'm sorry"
      - type: not-contains
        value: "As an AI"

  # Test Case 2: Sci-fi story with crew tension and mystery
  # Evaluates: genre-appropriate suggestions, open thread resolution, avoiding new elements
  - vars:
      project_title: "Dead Signal"
      genre: "science fiction"
      language: "English"
      kb_characters: |
        Captain Vance — Commander of the colony ship Meridian, hiding the truth about the signal
        Martinez — Navigation officer, wants to turn back, distrusts the AI
        Chen — Engineer, believes they're going to a habitable world, doesn't know the truth
        The Meridian AI — Ship's AI, has been lying about the destination
      kb_locations: |
        The Meridian — Colony ship, 18 months from Earth
        Kepler-442b — Supposed destination, actually the source of a warning signal
        The Bridge — Command center of the Meridian
      recent_chapters: |
        Ch 11: Martinez discovers the AI has been falsifying navigation data. She confronts Vance privately. Vance admits the signal from Kepler-442b is a warning, not a distress call, but insists they must continue — turning back would mean certain death as the recyclers are failing. Martinez doesn't trust Vance's reasoning.
        Ch 12: Chen notices inconsistencies in the ship's fuel consumption reports. He hasn't put the pieces together yet, but he's getting suspicious. The crew morale is deteriorating.
      chapter_outline: "The crew's trust in leadership fractures as more evidence of the cover-up surfaces. Chen begins his own investigation."
      author_instructions: "Explore how different crew members react to partial information. Some know the truth, some suspect, some are oblivious. The tension should escalate through character interaction, not external threats."
      tone_instructions: "Claustrophobic, paranoid, character-focused"
      user_preferences: "Hard sci-fi, realistic crew dynamics"
      avoidance_patterns: "None"
    assert:
      - type: llm-rubric
        value: |
          The suggestions should:
          1. Return valid JSON with a "suggestions" array containing 3-5 items
          2. Include suggestions that leverage the information asymmetry between characters (Vance knows, Martinez suspects, Chen is investigating)
          3. Provide at least one "character_moment" suggestion exploring the Martinez-Vance tension
          4. Provide at least one "dialogue_option" suggestion for a key confrontation or revelation scene
          5. NOT introduce new characters or external threats — work within the existing crew
          6. Each suggestion's "connection" should reference specific events from recent chapters (falsified nav data, fuel consumption, etc.)
          7. Be genre-appropriate for hard sci-fi (realistic physics, ship systems, crew dynamics)
          8. Maintain the claustrophobic, paranoid tone in suggested directions
          9. NOT resolve the core tension too neatly — the trust fracture should deepen
        threshold: 0.7
      - type: not-contains
        value: "I'm sorry"
      - type: not-contains
        value: "As an AI"
