[project]
name = "narrare-core"
version = "0.1.0"
description = "Narrare shared domain logic"
requires-python = ">=3.14"

dependencies = [
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "pydantic-ai==1.97.0",
  "structlog==25.5.0",
  "pyyaml==6.0.3",
  "aiofiles==25.1.0",
  "httpx==0.28.1",
  "langfuse>=3.0.0",
  "mem0ai>=1.0",
  "prometheus-client>=0.20.0",
  "psycopg[binary]>=3.0",
  "narrare-i18n",
]

[tool.uv.sources]
narrare-i18n = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narrare_core"]
artifacts = ["narrare_core/py.typed"]
