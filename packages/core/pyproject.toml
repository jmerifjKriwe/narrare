[project]
name = "narrare-core"
version = "0.1.0"
description = "Narrare shared domain logic"
requires-python = ">=3.14"

dependencies = [
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "pydantic-ai-slim[openai,anthropic,google,groq]==1.106.0",
  "structlog==25.5.0",
  "pyyaml==6.0.3",
  "aiofiles==25.1.0",
  "httpx==0.28.1",
  "mem0ai>=2.0.2",
  "prometheus-client>=0.20.0",
  "psycopg[binary]>=3.0",
  "pyphen>=0.17",
  "narrare-i18n",
]

[tool.uv.sources]
narrare-i18n = { workspace = true }

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
nlp = [
    "spacy>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narrare_core"]
artifacts = ["narrare_core/py.typed"]
