[project]
name = "narrare-i18n"
version = "0.1.0"
description = "Narrare internationalization"
requires-python = ">=3.14"

dependencies = [
  "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narrare_i18n"]
artifacts = ["narrare_i18n/py.typed"]
