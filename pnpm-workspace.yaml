packages:
  - "web"

# Capability web folders (app/capabilities/*/web) live outside web/, so their
# bare imports cannot walk up to web/node_modules. The packages a capability
# may import directly — the React and router stack, the editor's TipTap — are
# hoisted to the workspace root, where tsc, vitest, the vite dev server and
# the production build resolve them from anywhere. The list is the boundary:
# capabilities import the shell through @shell/* and the framework through
# these, nothing else.
publicHoistPattern:
  - react
  - react-dom
  - "@types/react"
  - "@types/react-dom"
  - "@tanstack/*"
  - "@tiptap/*"
  - "@testing-library/*"
  - vitest

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - vite@8.3.5

overrides:
  # GHSA-r825-w8mm-5pxw: vite 8.3.0-8.3.2, reached through vitest. 8.3.5 is the
  # first patched release the minimum-release-age guard lets through, which is
  # why it is pinned exactly and listed in minimumReleaseAgeExclude above.
  # Drop the pin when vitest's own range resolves a patched vite on its own.
  vite: "8.3.5"
