[project]
name = "narrare"
version = "0.2.0"
description = "Local-first, AI-assisted creative writing."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "alembic>=1.20.1",
  "anyio>=4.0.0",
  "asyncpg>=0.31.0",
  "cryptography>=50.0.2",
  "fastapi>=0.141.1",
  "jinja2>=3.1.6",
  "json-repair>=0.64.2",
  "keyring>=25.7.0",
  "openai>=3.39.0",
  "pgvector>=0.5.0",
  "pydantic>=2.13.5",
  "pyyaml>=6.0.3",
  "python-multipart>=0.0.32",
  "sqlalchemy[asyncio]>=2.1.1",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "hypothesis>=6.170.12",
  "pyright==1.1.414",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-playwright>=0.8.0",
  "pytest-randomly>=5.0.0",
  "pytest-timeout>=2.4.0",
  "ruff==0.16.9",
]

# The repository root is not an installable package: app/ runs from the checkout,
# which is why `uv run` works without a build step.
[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Pyright — one typechecker, one answer
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = true
venvPath = "."
venv = ".venv"
useLibraryCodeForTypes = false
reportUnknownMemberType = true
reportUnknownVariableType = true
reportUnknownArgumentType = true
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportMissingParameterType = false

include = ["app"]

exclude = [
  "**/.*",
  ".venv",
  "__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  "node_modules",
  ".agents",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "W",   # pycodestyle warnings
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # ruff-specific
  "S",   # flake8-bandit (security)
]
ignore = [
  "S101", # assert in tests is fine
  "S105", # hardcoded password false positives
  "S106",
]

[tool.ruff.lint.per-file-ignores]
".agents/**" = ["S", "TC"]  # External agent skills — not project code
"**/*router*.py" = ["B008", "TC001", "TC003"]  # FastAPI Depends() pattern takes UUID at runtime
# SQLAlchemy needs datetime at runtime, not just type-checking
"**/models.py" = ["TC003"]
"**/*_models.py" = ["TC003"]
# CI's changes job runs this script under the runner's python3 before any uv
# sync; its annotations are evaluated at definition time, so the runtime import
# is what keeps it from NameError there
"scripts/affected.py" = ["TC003"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["error"]
timeout = 30
timeout_method = "thread"
timeout_func_only = true
markers = [
  "e2e: end-to-end tests (full stack: browser, API, Postgres)",
]
norecursedirs = ["e2e", ".venv", "node_modules", ".git", "dist", "build", "__pycache__", "*.egg-info", ".hypothesis", ".pytest_cache"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  "\\.\\.\\.",  # Protocol: ... (Ellipsis) stubs
]
