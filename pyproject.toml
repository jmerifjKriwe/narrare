[project]
name = "narrare-workspace"
version = "0.1.0"
description = "Narrare monorepo workspace"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
# This is a virtual workspace root ([tool.uv] package = false). It has no
# importable package of its own; runtime dependencies belong to the workspace
# members (apps/api, packages/core, packages/i18n). Dev-only tools go in the
# [dependency-groups] dev list below.
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.16.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "pytest-xdist>=3.6",
  "pytest-randomly==4.1.0",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "mutmut==3.6.0",
  "pytest-playwright>=0.7",
  "pydantic-evals==2.18.0",
  "jsonschema>=4.26.0",
]

# Workspace root is a virtual container (no importable package here).
# The previous [build-system] declared packages = ["narrare"] for a
# non-existent root directory, which collided with / shadowed the real
# `narrare` package from apps/api on a fresh `uv sync`, causing
# "No module named 'narrare'" in CI. Marking the root as non-package is
# Astral's documented convention for workspace roots.
[tool.uv]
package = false
override-dependencies = [
  "aiohttp>=3.14.1",
  "pyasn1>=0.6.4",
  "setuptools>=83.0.0",
]

[tool.uv.workspace]
members = ["apps/api", "packages/core", "packages/i18n"]

# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingImports = true
# reportMissingTypeStubs fires for any import without a .pyi stub file.
# Our own packages (narrare_core, narrare, narrare_i18n) include PEP 561
# py.typed marker files in their source roots, which satisfies pyright and
# eliminates false positives. Remaining errors are genuine: third-party
# packages that lack inline types and have no separate stub package.
reportMissingTypeStubs = true

# PERFORMANCE: venv explizit setzen (verhindert Scannen der venv)
venvPath = "."
venv = ".venv"

# Module resolution roots (mirrors pytest `pythonpath` for reliable imports)
extraPaths = ["apps/api", "packages/core", "packages/i18n"]

# PERFORMANCE: Kein Tiefen-Parsen von externen Bibliotheken
useLibraryCodeForTypes = false

# Strict-Regeln: Die wichtigsten 3 aktivieren
reportUnknownMemberType = true
reportUnknownVariableType = true
reportUnknownArgumentType = true

# Diese bleiben deaktiviert (zu noisy für Python)
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportMissingParameterType = false

# ADR-046 transition: MetaPromptLoader is @deprecated but still tested.
# Re-enable reportDeprecated after MetaPromptLoader removal.
reportDeprecated = false

# Was geprüft wird
include = [
  "apps/api",
  "packages/core",
  "packages/i18n",
  "scripts",
  # "tests",  — removed for pyright performance (1.048 test files); tests get
  #             a separate conditional hook in .pre-commit-config.yaml
]

# Was NICHT geprüft wird (Performance + irrelevant)
exclude = [
  # Versteckte Dateien/Verzeichnisse
  "**/.*",

  # E2E tests - require full stack, can't be type-checked in isolation
  "tests/e2e/**",

  # Virtual Environment (explizit, Performance)
  ".venv",

  # Python/Caches
  "__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".mypy_cache",
  "pyrightcache",       # Pyright type-checker cache

  # Build/Dependencies
  "node_modules",
  "dist",
  "*.egg-info",

  # Tool-Artefakte
  ".code-review-graph",
  ".agents",  # External agent skills — not project code
  ".gemini",
  ".qoder",

  # Projekt-spezifisch
  "**/migrations/**",  # Alembic-Migrationen
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["apps/api", "packages/core", "packages/i18n", "evals"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "W",   # pycodestyle warnings
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # ruff-specific
  "S",   # flake8-bandit (security)
]
ignore = [
  "S101", # assert in tests is fine
  "S105", # hardcoded password false positives
  "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]
".agents/**" = ["S", "TC"]  # External agent skills — not project code
"**/migrations/**" = ["E501"]
"**/*router*.py" = ["B008", "TC001"]  # FastAPI Depends() pattern; CurrentUserIdDep needed at runtime
# SQLAlchemy needs datetime at runtime, not just type-checking
"**/models.py" = ["TC003"]
"**/*_models.py" = ["TC003"]
"packages/core/narrare_core/llm/retry.py" = ["S311"]  # PRNG for jitter is OK

[tool.ruff.lint.isort]
known-first-party = ["narrare_core", "narrare_i18n", "narrare"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["apps/api", "packages/core"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["error", "ignore::DeprecationWarning:pydantic_ai", "ignore::DeprecationWarning:google.genai", "ignore:.*sqlite3.*:pytest.PytestUnraisableExceptionWarning", "ignore:.*ADR-048.*:DeprecationWarning", "ignore:.*qdrant.*:pytest.PytestUnraisableExceptionWarning"]
timeout = 10
timeout_method = "thread"
timeout_func_only = true
markers = [
  "unit: unit tests (fast, no I/O, mocked dependencies)",
  "integration: integration tests (real DB, mocked LLM)",
  "e2e: end-to-end tests (full stack, main branch only)",
  "requires_db: marks tests requiring database connection",
  "mutation_inert: test inspects static repo structure (source tree, manifests, file existence) — cannot kill mutants and is incompatible with the MutMut copy-based sandbox; excluded from mutation runs via `-m 'not mutation_inert'`",
]
norecursedirs = ["e2e", ".venv", "node_modules", ".git", "dist", "build", "__pycache__", "*.egg-info", ".hypothesis", ".pytest_cache"]

[tool.coverage.run]
source = ["apps/api/narrare", "packages/core/narrare_core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
    "*/contracts.py",
]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  "\\.\\.\\.",  # Protocol: ... (Ellipsis) stubs
  "pass",  # Protocol: pass in abstract methods
]

# ---------------------------------------------------------------------------
# Bandit (Security)
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = [
  "tests",
  ".venv",
  "__pycache__",
  ".pytest_cache",
  ".agents",
]
skips = ["B101"]  # assert_used is fine in tests

# ---------------------------------------------------------------------------
# MutMut 3.x (Mutation Testing)
# ---------------------------------------------------------------------------
# MutMut 3.x reads ALL configuration from this table. The CLI (`mutmut run`)
# only accepts `--max-children` — there are NO --paths-to-mutate / --runner /
# --use-coverage flags (those were MutMut 2.x).
#
# This is the DEFAULT scope (core domain logic). For other scopes use
# scripts/run_mutmut.py --scope api|all|custom, which rewrites this table
# temporarily and restores it afterwards.
#
# IMPORTANT: source_paths use symlink names (narrare_core, narrare), NOT the
# real workspace paths (packages/core/narrare_core). The wrapper creates
# temporary symlinks so MutMut's path-derived module keys match the Python
# import paths. See scripts/run_mutmut.py docstring for details.
#
# NOTE: we deliberately do NOT add `-n auto` (pytest-xdist) to
# pytest_add_cli_args. MutMut 3.x parallelizes itself via os.fork() +
# max-children; nesting xdist workers inside the forked mutant processes is
# fragile. pytest-randomly is disabled automatically by MutMut.
[tool.mutmut]
# What gets mutated (walked recursively). Uses symlink name, not workspace path.
source_paths = ["narrare_core"]
# Glob restriction on what is actually mutated (must end in `*` or `.py`):
only_mutate = [
    "narrare_core/prompts/*",
    "narrare_core/writing/*",
    "narrare_core/llm/intents.py",
]
# Glob exclusions (must end in `*` or `.py`):
do_not_mutate = [
    "*/migrations/*",
    "*/__pycache__/*",
]
# Extra pytest args appended to every pytest invocation:
pytest_add_cli_args = ["-x", "--timeout=30", "-q"]
# Which tests to run during stats collection (when no specific tests given):
pytest_add_cli_args_test_selection = ["-m", "not mutation_inert", "tests/unit/core/"]

# ---------------------------------------------------------------------------
# Architecture constraints (read by scripts/check_architecture.py)
# ---------------------------------------------------------------------------
[tool.narrare.architecture]
llm_allowed_modules = [
  "packages/core/narrare_core/llm/",
  "packages/core/narrare_core/agents/",
  "tests/",  # Test files can import pydantic_ai for TestModel/FunctionModel testing tools
  "scripts/probes/",  # Eval/adoption probes use TestModel (no real LLM) for ADR-056 runtime evidence
]
agent_allowed_modules = [
  "packages/core/narrare_core/agents/",
  "tests/",
  "scripts/probes/",  # Probes construct fake agents (TestModel) for runtime evidence
]
prompt_allowed_modules = ["packages/core/narrare_core/prompts/"]
forbidden_llm_imports = ["openai", "anthropic", "pydantic_ai"]
forbidden_llm_urls = [
  "api.openai.com",
  "api.anthropic.com",
  "generativelanguage.googleapis.com",
]

[tool.narrare.architecture.file_size_limits]
router = 150
service = 300
repository = 250
contracts = 200
models = 200
schemas = 200
agent = 200
gateway = 300
composer = 250
default = 400

[tool.narrare.architecture.configurable_defaults]
max_allowed_constant = 5
allowed_patterns = ["_PERCENTAGES", "_VALID_", "_PREFERENCE_", "_PROVIDER", "SUPPORTED_"]
ignored_modules = [
  # Script/tooling files (not production code):
  "scripts/architecture/_checkers/inline_prompts.py",
  "scripts/check_gate_expirations.py",
  "scripts/checks/_ai_interaction_checks/_shared.py",
  "scripts/checks/_ai_interaction_checks/check_1_use_ai_operation.py",
  # Governance checker modules — subprocess timeouts and policy windows
  # (STALE_WINDOW_DAYS=90 from §7) are tooling constants, not runtime config:
  "scripts/checks/_ai_interaction_checks/check_6_deprecated_alias.py",
  "scripts/checks/_ai_interaction_checks/check_8_stale_exclude.py",
  "scripts/prompt_checks.py",
  "scripts/run_checks.py",
  # Doc-drift validator — _JUST_LIST_TIMEOUT (10s subprocess timeout for
  # `just --list`) is a tooling constant, not runtime config:
  "scripts/doc_drift/just_command_checks.py",
]

[tool.narrare.architecture.exceptions]
# CANONICAL SOURCE — this is the machine-readable exception register consumed by
# scripts/check_architecture.py. The human-readable documentation mirrors this in
# docs/_shared/CONSTRAINTS.md §7. Both MUST be kept in sync.
# When adding or modifying exceptions, update BOTH files.
# Details here take precedence in case of conflicts.
#
# Format:
# [[tool.narrare.architecture.exceptions.entries]]
# rule = "RULE-XX"
# file = "path/to/file.py"
# reason = "Why this exception exists"
# approved_by = "who-approved"
# date = "2026-01-01"

[[tool.narrare.architecture.exceptions.entries]]
rule = "RULE-01b"
file = "packages/core/narrare_core/llm/embedding_providers.py"
reason = "Batch embedding API requires direct client access for performance"
