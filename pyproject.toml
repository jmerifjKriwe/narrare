file = "packages/core/narrare_core/wiki/agent.py"
reason = "WikiGenerationAgent uses RunContext for pydantic_ai internals"
approved_by = "architecture-review"
date = "2026-06-03"

[[tool.narrare.architecture.exceptions.entries]]
rule = "RULE-01b"
file = "packages/core/narrare_core/wiki/agent_chapter.py"
reason = "WikiChapterGenerator wraps internal PydanticAgent (ADR-015)"
approved_by = "ADR-015"
date = "2026-06-03"

[[tool.narrare.architecture.exceptions.entries]]
rule = "RULE-TEST-01"
