[project]
name = "narrare-workspace"
version = "0.1.0"
description = "Narrare monorepo workspace"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"

[dependency-groups]
dev = [
  "ruff==0.15.12",
  "pyright==1.1.409",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "bandit==1.9.4",
  "pip-audit==2.10.0",
  "pytest-xdist>=3.6",
  "pytest-randomly==4.1.0",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "playwright>=1.52",
  "pytest-playwright>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narrare"]

[tool.uv.workspace]
members = ["apps/api", "packages/core", "packages/i18n"]

# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingImports = true
# reportMissingTypeStubs fires for any import without a .pyi stub file.
# Our own packages (narrare_core, narrare, narrare_i18n) include PEP 561
# py.typed marker files in their source roots, which satisfies pyright and
# eliminates false positives. Remaining errors are genuine: third-party
# packages that lack inline types and have no separate stub package.
reportMissingTypeStubs = true

# PERFORMANCE: venv explizit setzen (verhindert Scannen der venv)
venvPath = "."
venv = ".venv"

# PERFORMANCE: Kein Tiefen-Parsen von externen Bibliotheken
useLibraryCodeForTypes = false

# Strict-Regeln: Die wichtigsten 3 aktivieren
reportUnknownMemberType = true
reportUnknownVariableType = true
reportUnknownArgumentType = true

# Diese bleiben deaktiviert (zu noisy für Python)
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportMissingParameterType = false

# Was geprüft wird
include = [
  "apps/api",
  "packages/core",
  "packages/i18n",
  "scripts",
  "tests",
]

# Was NICHT geprüft wird (Performance + irrelevant)
exclude = [
  # Versteckte Dateien/Verzeichnisse
  "**/.*",

  # Virtual Environment (explizit, Performance)
  ".venv",

  # Python/Caches
  "__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".mypy_cache",

  # Build/Dependencies
  "node_modules",
  "dist",
  "*.egg-info",

  # Tool-Artefakte
  ".code-review-graph",
  ".gemini",
  ".qoder",

  # Projekt-spezifisch
  "**/migrations/**",  # Alembic-Migrationen
  "narrare",            # Leeres Namespace-Paket
]

# Tests: basic mode statt strict (MagicMock/AsyncMock erzeugen zu viel Noise in strict)
[[tool.pyright.executionEnvironments]]
root = "tests"
# typeCheckingMode removed — not supported in executionEnvironments since pyright ~1.1.400
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
# Tests import from tests.fakes / tests.factories — resolved at runtime by pytest pythonpath
reportMissingImports = false

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["apps/api", "packages/core", "packages/i18n"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "W",   # pycodestyle warnings
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # ruff-specific
  "S",   # flake8-bandit (security)
]
ignore = [
  "S101", # assert in tests is fine
  "S105", # hardcoded password false positives
  "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]
"**/migrations/**" = ["E501"]
"**/router.py" = ["B008", "TC001"]  # FastAPI Depends() pattern; CurrentUserIdDep needed at runtime
# SQLAlchemy needs datetime at runtime, not just type-checking
"**/models.py" = ["TC003"]
"packages/core/narrare_core/llm/retry.py" = ["S311"]  # PRNG for jitter is OK

[tool.ruff.lint.isort]
known-first-party = ["narrare_core", "narrare_i18n", "narrare"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["apps/api", "packages/core"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["error", "ignore::DeprecationWarning:pydantic_ai", "ignore::DeprecationWarning:google.genai"]
timeout = 10
timeout_func_only = true
markers = [
  "e2e: end-to-end tests (run with full stack, main branch only)",
]

[tool.coverage.run]
source = ["apps/api/narrare", "packages/core/narrare_core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
    "*/contracts.py",
]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  "\\.\\.\\.",  # Protocol: ... (Ellipsis) stubs
  "pass",  # Protocol: pass in abstract methods
]

# ---------------------------------------------------------------------------
# Bandit (Security)
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = [
  "tests",
  ".venv",
  "__pycache__",
  ".pytest_cache",
]
skips = ["B101"]  # assert_used is fine in tests

# ---------------------------------------------------------------------------
# Architecture constraints (read by scripts/check_architecture.py)
# ---------------------------------------------------------------------------
[tool.narrare.architecture]
llm_allowed_modules = [
  "packages/core/narrare_core/llm/",
]
prompt_allowed_modules = ["packages/core/narrare_core/prompts/"]
forbidden_llm_imports = ["openai", "anthropic", "pydantic_ai"]
forbidden_llm_urls = [
  "api.openai.com",
  "api.anthropic.com",
  "generativelanguage.googleapis.com",
]

[tool.narrare.architecture.file_size_limits]
router = 150
service = 300
repository = 250
contracts = 200
models = 200
schemas = 200
agent = 200
gateway = 300
composer = 250
default = 400

[tool.narrare.architecture.exceptions]
# Format:
# [[tool.narrare.architecture.exceptions.entries]]
# rule = "RULE-01"
# file = "packages/core/narrare_core/llm/embeddings.py"
# reason = "Batch embedding API requires direct client access"
# approved_by = "architecture-review"
# date = "2026-01-01"
entries = []
