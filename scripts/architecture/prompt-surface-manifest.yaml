    fallback_policy: fail_loudly_if_bundled_missing

  - intent: SUGGEST
    routeable: true
    category: writing
    mode: inline_suggest
    template: packages/core/narrare_core/prompts/_bundled/writing/en/inline_suggest/system.md
    content_type: customizable_feature_prompt
    output_language_variable: writing_language
    required_variables: [text_before]
    optional_variables: [text_after, chapter_context, kb_suggested, kb_characters, character_voice_profiles, user_preferences, avoidance_patterns, culture_guidelines, project_title, genre, writing_language, timeline_position, story_structure, world_context]
    security:
      xml_required: [text_before, text_after]
      generated_suggestions_must_be_labelled: [kb_suggested]
    fallback_policy: fail_loudly_if_bundled_missing

  - intent: CHAT
    routeable: true
    # ADR-024 / ADR-049 D1: CHAT is a writing-craft assistant under category
    # "writing", mode "chat". The earlier `category: chat, mode: ""` was an
    # unauthorised drift from ADR-024 that produced an orphan root-mode
    # template (`_bundled/chat/en/system.md`). See ADR-049 FIND-010.
    category: writing
    mode: chat
    template: packages/core/narrare_core/prompts/_bundled/writing/en/chat/system.md
    content_type: customizable_feature_prompt
    output_language_variable: null
    required_variables: []
    optional_variables: [conversation_history, kb_characters, kb_locations, kb_factions, kb_relationships, kb_suggested, recent_chapters, character_voice_profiles, user_preferences, avoidance_patterns, culture_guidelines, project_title, genre, language, writing_language, timeline_position, story_structure, world_context]
    security:
      xml_required: [conversation_history]
      generated_suggestions_must_be_labelled: [kb_suggested]
    fallback_policy: fail_loudly_if_bundled_missing

