        security: {xml_required: [text_before, text_after], generated_suggestions_must_be_labelled: [kb_suggested]}
        fallback_policy: fail_loudly_if_bundled_missing
      - mode: story_suggest
        template: packages/core/narrare_core/prompts/_bundled/writing/en/story_suggest/system.md
        content_type: customizable_feature_prompt
        required_variables: []
        optional_variables: [chapter_outline, story_structure, project_title, genre, writing_language, kb_characters, kb_locations, kb_factions, kb_relationships, kb_suggested, recent_chapters, novel_synopsis, character_voice_profiles, timeline_position, tone_instructions, user_preferences, avoidance_patterns, culture_guidelines, world_context]
        security: {xml_required: [author_instructions], generated_suggestions_must_be_labelled: [kb_suggested]}
        fallback_policy: fail_loudly_if_bundled_missing

  - intent: CHAT
    routeable: true
    # ADR-024 / ADR-049 D1: CHAT is a writing-craft assistant under category
    # "writing", mode "chat". The earlier `category: chat, mode: ""` was an
    # unauthorised drift from ADR-024 that produced an orphan root-mode
    # template (`_bundled/chat/en/system.md`). See ADR-049 FIND-010.
    category: writing
