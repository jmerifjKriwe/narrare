    required_variables: [selection_text]
    optional_variables: [author_instructions, context_before, context_after, kb_suggested, kb_characters, kb_locations, kb_factions, kb_relationships, recent_chapters, style_profile, character_voice_profiles, user_preferences, avoidance_patterns, culture_guidelines, project_title, genre, language, writing_language, co_author_focus_instructions, timeline_position, story_structure, world_context]
    security:
