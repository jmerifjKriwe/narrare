  # ── Non-routeable intents (explicit rationale) ─────────────────────

  - intent: SENTIMENT
    routeable: false
    rationale: "Sentiment analysis is handled by deterministic NLP analyzers."
    fallback_policy: raise_route_not_configured

  - intent: VOICE
    routeable: false
    rationale: "Voice analysis has no dedicated bundled PromptComposer template yet."
    fallback_policy: raise_route_not_configured

  - intent: GENERATE
    routeable: false
    rationale: "Generic generation must use a specific routed intent or feature mode."
    fallback_policy: raise_route_not_configured

