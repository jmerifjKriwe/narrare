# Narrare Prompt Surface Contract Manifest (ADR-037 / INFRA-012)
#
# Governance SSOT for prompt routeability. Core remains the runtime owner;
# Platform reads this manifest and fails CI when routes, templates, variables,
# XML wrappers, or fallback behavior drift from it.
#
# Schema: ADR-037
# Enforced by: scripts/architecture/_checkers/_check_prompt_surface.py

version: "1.0.0"

routes:
  # ── Writing operations ──────────────────────────────────────────────

  - intent: WRITE
    routeable: true
    category: writing
    mode: new_chapter
    template: packages/core/narrare_core/prompts/_bundled/writing/en/new_chapter/system.md
    content_type: customizable_feature_prompt
    output_language_variable: writing_language
    required_variables: [chapter_outline]
    optional_variables: [author_instructions, kb_suggested, kb_characters, kb_locations, kb_factions, kb_relationships, recent_chapters, novel_synopsis, style_profile, character_voice_profiles, user_preferences, avoidance_patterns, culture_guidelines, tone_instructions, project_title, genre, language, writing_language, word_target, timeline_position, story_structure, world_context]
    security:
      xml_required: [author_instructions]
      generated_suggestions_must_be_labelled: [kb_suggested]
    fallback_policy: fail_loudly_if_bundled_missing

  - intent: EXTEND
    routeable: true
    category: writing
    mode: extend_chapter
    template: packages/core/narrare_core/prompts/_bundled/writing/en/extend_chapter/system.md
    content_type: customizable_feature_prompt
    output_language_variable: writing_language
    required_variables: [existing_content]
    optional_variables: [author_instructions, kb_suggested, kb_characters, kb_locations, kb_factions, kb_relationships, recent_chapters, novel_synopsis, style_profile, character_voice_profiles, user_preferences, avoidance_patterns, culture_guidelines, tone_instructions, project_title, genre, language, writing_language, extend_length, timeline_position, story_structure, world_context]
    security:
      xml_required: [existing_content, author_instructions]
      generated_suggestions_must_be_labelled: [kb_suggested]
    fallback_policy: fail_loudly_if_bundled_missing

  - intent: REWRITE
    routeable: true
    category: writing
    mode: rewrite_selection
    template: packages/core/narrare_core/prompts/_bundled/writing/en/rewrite_selection/system.md
    content_type: customizable_feature_prompt
    output_language_variable: writing_language
    required_variables: [selection_text]
    optional_variables: [author_instructions, context_before, context_after, kb_suggested, kb_characters, kb_locations, kb_factions, kb_relationships, recent_chapters, style_profile, character_voice_profiles, user_preferences, avoidance_patterns, culture_guidelines, tone_instructions, project_title, genre, language, writing_language, rewrite_mode_instructions, count, timeline_position, story_structure, world_context]
    security:
      xml_required: [selection_text, context_before, context_after, author_instructions]
      generated_suggestions_must_be_labelled: [kb_suggested]
    fallback_policy: fail_loudly_if_bundled_missing

  - intent: CO_AUTHOR
    routeable: true
    category: writing
    mode: co_author
