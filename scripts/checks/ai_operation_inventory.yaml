    partial_output: "n/a — suggestion is ephemeral; error decoration is also transient (auto-clears after errorStatusDurationMs, default 4000ms)"
    ai_action_i18n: "studio.aiActions + ghostText.errorUnavailable via localized Extension-Options (no hardcoded visible strings)"
    deprecated_key_usage: "No deprecated aliases in use"
    keyboard: "Tab accept, Escape dismiss, ArrowRight first word (GhostText.ts:137-146)"
