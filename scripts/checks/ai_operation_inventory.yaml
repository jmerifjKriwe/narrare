# AI Operation Inventory — ADR-043 / ai-ux-compliance-v2 §4
#
# Machine-readable compliance surface for all frontend AI operations.
# Validated by check_10_operation_inventory gate.
#
# Required fields per §4:
#   operation_id, feature, entry_points, transport, lifecycle_owner,
