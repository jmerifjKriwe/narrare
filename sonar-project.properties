# SonarCloud analysis scope for narrare.
# Read by SonarCloud's automatic analysis (and by the sonar-scanner CLI).
# Keep this file in sync with the exclusions configured in the SonarCloud
# project settings (Project -> Administration -> Analysis Scope).

sonar.projectKey=jmerifjKriwe_narrare
sonar.organization=jmerifjkriwe

# Documentation and generated / vendored / tooling artefacts must not be
# analysed as product code: they dominate the issue count and distort the
# metrics without representing shipped code. The test-file patterns at the
# end keep test code out of the main-code index (mirroring the test
# inclusions below) so every file is indexed exactly once.
sonar.exclusions=\
  docs/**,\
  app/generated/**,\
  web/lib/generated/**,\
  web/lib/api/**,\
  web/dist/**,\
  assets/**,\
  .agents/**,\
  node_modules/**,\
  .venv/**,\
  **/__pycache__/**,\
  fuzz/workdir/**,\
  fuzz/crash-* ,\
  **/*.generated.*,\
  app/**/tests/**,\
  web/**/*.test.ts,\
  web/**/*.test.tsx,\
  app/capabilities/*/web/**/*.test.ts,\
  app/capabilities/*/web/**/*.test.tsx,\
  scripts/**,\
  web/scripts/**,\
  pnpm-lock.yaml,\
  sonar-project.properties,\
  .github/**,\
  app/capabilities/*/e2e/**,\
  justfile,\
  web/vite.config.ts

# Test files are analysed as tests, not as main code. sonar.sources and
# sonar.tests take only literal paths (SonarCloud rejects wildcard patterns
# there), so the test roots are listed one by one and the moving parts live
# in sonar.test.inclusions: its patterns narrow each root to exactly its
# test files — that is how the web tree, whose tests live beside their
# sources, gets the literal root `web` without turning the sources into
# tests — and they keep classifying files as tests when a capability
# folder appears. The scanner derives matching source exclusions from
# them (they are also stated in sonar.exclusions above).
sonar.sources=.
sonar.tests=\
  app/capabilities/chat/tests,\
  app/capabilities/knowledge/tests,\
  app/capabilities/planning/tests,\
  app/capabilities/prompts/tests,\
  app/capabilities/settings/tests,\
  app/capabilities/setup/tests,\
  app/capabilities/writing/tests,\
  app/kernel/db/tests,\
  app/kernel/tests,\
  web
sonar.test.inclusions=\
  app/**/tests/**,\
  web/**/*.test.ts,\
  web/**/*.test.tsx,\
  app/capabilities/*/web/**/*.test.ts,\
  app/capabilities/*/web/**/*.test.tsx

# Coverage: backend pytest-cov Cobertura report (generated by `just test-cov`).
sonar.python.coverage.reportPaths=coverage.xml
# Frontend V8 LCOV report (generated by `just test-frontend-cov`).
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# Infra/tooling false positives: dev-only paths (scripts, workflows, Dockerfile)
# carry SAST findings that do not represent shipped product code.
sonar.issue.ignore.multicriteria=ic1,ic2,ic3,ic4,ic5,ic6,ic7,ic8,ic9,ic10
sonar.issue.ignore.multicriteria.ic1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.ic1.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.ic2.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.ic2.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.ic3.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.ic3.resourceKey=.github/**
sonar.issue.ignore.multicriteria.ic4.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.ic4.resourceKey=.github/**
sonar.issue.ignore.multicriteria.ic5.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.ic5.resourceKey=.github/**
sonar.issue.ignore.multicriteria.ic6.ruleKey=githubactions:S6506
sonar.issue.ignore.multicriteria.ic6.resourceKey=.github/**
sonar.issue.ignore.multicriteria.ic7.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.ic7.resourceKey=Dockerfile
sonar.issue.ignore.multicriteria.ic8.ruleKey=docker:S6506
sonar.issue.ignore.multicriteria.ic8.resourceKey=Dockerfile
sonar.issue.ignore.multicriteria.ic9.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.ic9.resourceKey=.github/workflows/ci.yml
sonar.issue.ignore.multicriteria.ic10.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.ic10.resourceKey=app/kernel/db/url.py