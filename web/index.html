<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Narrare</title>
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" sizes="180x180" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The paint hint: the first frame wears the reader's stored choice
      // before the settings query answers. The server row overwrites this
      // mirror as soon as it lands; it is a cache, never a source.
      try {
        var t = localStorage.getItem("narrare.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
